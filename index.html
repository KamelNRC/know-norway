const SUMMARY = {"en": [{"id": "key", "title": "Numbers and dates", "groups": [["The test", ["**38** multiple-choice questions, **60** minutes, **26** correct to pass.", "You can take it in English or Norwegian."]], ["Dates in order", ["**872** Harald Hårfagre becomes king of all Norway.", "**1030** Battle of Stiklestad; Christianity takes over.", "**Mid-1300s** Black Death kills about **a third** of Norwegians.", "**1397** union with Denmark (and Sweden); Denmark–Norway lasts until **1814**.", "**17 May 1814** Constitution signed at Eidsvoll by **112** men; union with Sweden from November.", "**1898** all men over **25** can vote (Storting elections); **1913** women over 25 too.", "**7 June 1905** union with Sweden ends; **Haakon VII** becomes king.", "**1919** eight-hour working day.", "**9 April 1940** Germany invades; **8 May 1945** liberation.", "**1947** Lånekassen founded. **1948** UN human rights declaration. **1949** NATO.", "**1959** Sámi allowed in schools again. **1989** Sametinget opens.", "**1967** first oil found in the North Sea; Ekofisk **1969**.", "**1972** and **1994** no to the EU; EEA agreement **1994**.", "**1978** Abortion Act; since **2025** abortion on request up to the end of **week 18**.", "**1999** agreement on national minorities’ rights. **2004** dugnad voted national word.", "**2009** same-sex marriage. **2012** church separated from the state.", "**August 2026** Haakon VIII becomes king after Harald V."]], ["Numbers", ["Population about **5.6 million**; over **1 million** immigrants or born to two immigrant parents.", "**15** counties (fylker), **357** municipalities (kommuner).", "Storting: **169** representatives, elected every **4** years. Elections every **2** years (national and local alternate).", "Voting age **18**. Local elections: **3** years’ residence. Storting elections: citizens only.", "Oslo about **725,000** people. Area **385,178 km²**. Coastline **25,148 km**, about **50,000** islands.", "About **half** of employees are union members; about **a third** work in the public sector.", "**60–80%** of jobs are found through networks. Average pay just under **NOK 670,000**.", "**82%** own their home; you need **10%** egenkapital to buy.", "Holiday at least **4 weeks + 1 day**; work week **37.5** hours. Retirement age **67**."]], ["Ages", ["**6** start school. **7** right to be heard. **12** opinion carries great weight.", "**15** choose religion and education, criminally responsible.", "**16** decide over own health information; age of consent.", "**18** adult (myndig): vote, marry, contracts, tobacco, beer and wine.", "**20** buy spirits. **19–44** conscription for men and women.", "Dental care free until **19**; then **25%** for young adults. Parents support children until **18**."]], ["Phone numbers", ["**110** fire. **112** police. **113** ambulance.", "**116 117** legevakt (out-of-hours doctor). **116 111** helpline for children and young people."]]]}, {"id": "m1", "title": "Module 1: Education and work", "groups": [["Barnehage (kindergarten)", ["Run under the Kindergarten Act; based on **Christian and humanist** values and **human rights**.", "Promotes democracy and equality, works against discrimination.", "Parents’ meetings and individual talks; right to an **interpreter**.", "Municipality pays most; Storting sets a **maximum price**; discounts for siblings and low incomes."]], ["Grunnskole (grades 1–10)", ["All children have the right to **13 years** of education; grunnskole is **10 years**, free and compulsory.", "Starts in **August** the year the child turns 6.", "Barneskole **1–7**: no grades. Ungdomsskole **8–10**: grades **1–6** (6 best) plus conduct grades.", "Physical punishment is **banned**. Under **5%** go to private school (parents pay a share).", "Same national curriculum, decided by politicians; group work and projects; extra help if needed."]], ["Home and school", ["Parents have the **main responsibility** for their children.", "Development talk (utviklingssamtale) at least **twice a year**."]], ["Videregående (upper secondary)", ["Free; apply online before **1 March**; grade-10 results decide the school.", "General studies → **vitnemål** (diploma). Vocational → **fagbrev** (2 years school + 2 years apprentice).", "About half choose each track; nearly **80%** complete."]], ["Higher education", ["Public universities are free; apply through **Samordna opptak** before **15 April**.", "**Lånekassen** (founded **1947**) lends money for living costs; part becomes a grant if you pass.", "About **60%** of students are women; about **42%** of adults have higher education."]], ["Adults and Norwegian training", ["Free preparatory education if you lack grunnskole (municipality).", "Upper secondary for adults **25+** (county).", "Norwegian training: free for some, others must pay; finish within **3 years** (**18 months** with higher education).", "Levels A1–A2 (basic), B1–B2 (independent)."]], ["Working life", ["About **50%** in a trade union; unions negotiate pay and rights and can strike.", "Every workplace must have **HMS** (health, safety, environment) work with a **verneombud** (safety rep).", "Working Environment Act: contracts, hours, absence, HMS. Everyone has a right to a **written contract**.", "Holidays Act: at least **4 weeks + 1 day**; many have 5. Holiday pay is based on last year’s pay.", "Notice period: minimum **1 month** (2 after 5 years, 3 after 10).", "Sick pay = full pay; employer pays first **16 days**, then NAV.", "**Svart arbeid** (no tax) is illegal and loses you sick pay, pension and insurance."]], ["Tax and welfare", ["Welfare state built on **equality** and **trust**; depends on many people working and paying tax.", "Taxes and duties fund welfare: sick pay, unemployment benefit, free school, free hospital, child benefit.", "Tax goes to the **municipality, county and state**; employer deducts it each month.", "**Skatteetaten** issues tax cards; tax return (skattemelding) every spring.", "NAV has an office in **every municipality**: sick pay, pensions, child benefit, kontantstøtte, social assistance. It manages about **a third** of the state budget; about **a third** of workers are in the public sector."]], ["Labour market history", ["150 years ago: farming, forestry, fishing. Late 1800s: factories, people move to cities, many emigrate to the USA.", "1950: over **20%** in farming; now under **3%**. Most jobs today are in **service** work.", "Health and care jobs are in short supply."]], ["Getting a job", ["Low unemployment but strong competition.", "Written **application + CV**; use networks (**60–80%** of jobs are never advertised), internet (nav.no, finn.no) and temp agencies."]], ["Critical thinking", ["**Kildekritikk**: judge who wrote something and why.", "**Etisk bevissthet**: balance different considerations; leads to better judgement.", "Personal data is protected; ask before sharing photos of others; hateful speech is illegal online too."]]]}, {"id": "m2", "title": "Module 2: Family, health and everyday life", "groups": [["Family in numbers", ["About **50,000** births a year; **1.4** children per woman; first child at about **30**.", "**70%** of couples are married, **30%** samboere; about **20,000** marry each year; about **40%** divorce.", "Nuclear family is most common; **75%** of children live with both parents.", "Parental benefit: up to **61 weeks** in total when both parents are in paid work.", "Barnetrygd until **18** (same for all); kontantstøtte for **13–19 months** without a full-time barnehage place; nearly **80%** of grades 1–4 use SFO (part-time place free)."]], ["Marriage and divorce", ["Marry from **18**, freely, not already married, lawful residence. Same-sex marriage since **2009**.", "Separation first; divorce after **1 year** (at once if violence or forced marriage). One spouse can ask alone.", "After divorce both parents have duty and right of care. **Barnebidrag** = child support.", "Words: samboer, særbo, bonusbarn, svigerforeldre, aleneforsørger, særeie, testament."]], ["Children’s rights", ["From **7**: right to be heard. From **12**: great weight on their view. From **15**: choose education and religion.", "Parents must support children until **18**. Hitting children is always illegal.", "Childhood is for play and learning, not work."]], ["Barnevernet (child welfare)", ["Office in every municipality. Norway was **first in the world** (law of **1900**).", "Main task: **protect** children, preferably together with the family.", "Staff have **taushetsplikt**; schools and kindergartens have **meldeplikt**; anyone worried should report."]], ["Health services", ["Everyone has a **fastlege**; you can switch **twice a year**.", "Hospital stays are **free**. Co-payments up to a ceiling, then **frikort**.", "Children under **16** free at the GP; pregnancy check-ups free (**8–12** visits).", "Blue prescription for chronic illness. Interpreter at the doctor is **free**.", "From **16** you decide who sees your health information.", "Mild painkillers sold in grocery stores and petrol stations."]], ["Dental care", ["Free until **19**; young adults then pay **25%** (the public sector pays 75%); older adults pay full price.", "Braces: parents pay a share. Check-up once a year."]], ["Pregnancy and identity", ["Abortion on request until the end of **week 18** (since 2025); after that a committee decides.", "Gender expression and sexual orientation are part of identity; LGBT+ people are protected by law."]], ["Violence and social control", ["All violence is illegal, also in the family; witnessing violence harms children too.", "Forced marriage: up to **6 years** in prison; can be annulled within **5 years**.", "Female genital mutilation: up to **6 years**, **15** if serious; consent does not make it legal.", "Not trying to prevent FGM: fine or up to **1 year**.", "Negative social control limits personal freedom; partners do not decide over each other."]], ["Residence and introduction", ["Quota refugees come via **UNHCR**; first permits are temporary (renewed, usually yearly).", "Permanent residence after **3 or 5** years; citizenship after **6–8** years.", "Integration Act: introduction programme lasts **3 months to 3 years**: Norwegian, society knowledge, work or education.", "Family reunification needs enough income and housing."]], ["Culture and norms", ["Norms = unwritten rules; laws = written rules.", "**Integration** (take part, keep own culture), **assimilation** (become like the majority), **segregation** (live apart).", "**Jeg-kultur** (individualist) vs **vi-kultur** (collectivist); culture shock; cross-pressure.", "Religion is private; racism and discrimination can be reported to the police."]], ["Everyday life", ["Confirmation at about **15** (church or humanist); bunad; funeral within **10 working days**.", "Quiet on Sundays and holidays; be on time; shake hands when you meet.", "**Dugnad**: unpaid community work, national word in **2004**.", "Social arenas: sports clubs, bands, scouts, voluntary groups.", "Relative poverty is most common; 2.7–3 million homes, half detached; **82%** own."]]]}, {"id": "m3", "title": "Module 3: Norway then and now", "groups": [["Early history", ["First people about **12,000** years ago; farming from about **4,000** years ago.", "Stone Age (10,000–2000 BC) → Bronze Age (**1800–500 BC**) → Iron Age (500 BC–1050 AD) → **Viking Age (800–1050)**.", "**872** Harald Hårfagre; **1030** Stiklestad, Olav Haraldsson; Christianity in the **1000s**."]], ["Middle Ages and union", ["Population grew from **150,000** to **400,000** (1000–1300).", "Black Death in the **1300s**: about a third of Norway died.", "Union with Denmark from **1397** to **1814**. Reformation **1517** (Luther)."]], ["1814–1905", ["France lost, so Denmark gave Norway to Sweden. **112** men at Eidsvoll wrote the Constitution, **17 May 1814**.", "Union with Sweden from November 1814, but Norway kept the Constitution and the **Storting**.", "National Romanticism; **Ivar Aasen** collected dialects → **nynorsk**.", "Mid-1800s **70%** lived in the countryside. **800,000** emigrated to America (1850–1920).", "**7 June 1905** union ends; two referendums; **Haakon VII** king until 1957."]], ["1900s", ["Hydropower from waterfalls; resources stay publicly owned. Eight-hour day **1919**.", "Voting rights: men **1898**, women **1913**.", "WWI: neutral, but rationing. Interwar years: crisis and unemployment.", "WWII: invaded **9 April 1940**; Quisling; **50,000** fled to Sweden; **10,000** Norwegians died.", "Of about **2,100** Jews, **773** deported and only **38** survived.", "Oil found **1967** (Ekofisk **1969**); oil changed the economy."]], ["Democracy and government", ["Constitutional monarchy, parliamentary democracy. King has **symbolic** power.", "Storting **makes laws**, adopts the **state budget**, controls the government (legislative).", "Government **carries out** decisions (executive); courts **judge** (judicial).", "State: foreign policy, hospitals, laws, curricula. County: upper secondary, county roads. Municipality: grunnskole, barnehage, elderly care, water, refuse.", "Council of State (statsråd) with the King every **Friday**.", "Secret ballot; about **20** parties; coalition and majority governments."]], ["Rights and equality", ["UN Declaration of Human Rights **1948**. Freedom of speech, religion, assembly.", "Everyone accused has a right to a **defence lawyer**; no punishment without trial.", "**§ 185** of the Penal Code (“racism paragraph”) bans hateful speech.", "Women: almost **half** the workforce, but **2 of 3** leaders are men.", "Laws: Equality and Anti-Discrimination Act, Marriage Act, Inheritance Act.", "Threats to democracy: low turnout, low trust, fake news and hate speech, crises."]], ["Sámi and minorities", ["Sámi lived from hunting, trapping, fishing and reindeer herding; costume is the **kofte**.", "Norwegianisation from about **1850**; land law of **1902** lasted until **1965**.", "Sámi in schools again **1959**; **Sametinget** from **1989**, elections every 4 years; **6 February** Sámi National Day.", "National minorities: Jews, Kvens, Forest Finns, Roma, Romani/Tater (agreement **1999**)."]], ["Religion", ["State church until **2012**. Leaving it was banned before **1845**.", "About **70%** are Church of Norway members; Islam is the second-largest religion. Approved faith communities get the same support **per member**.", "From **15** you choose your own religion; no one may force you in or out."]], ["Geography", ["**385,178 km²**; borders Sweden, Finland, Russia; **Svalbard** belongs to Norway.", "**75%** live along the coast, **50%** in Eastern Norway.", "Official languages Norwegian and Sámi; written Norwegian: **bokmål** and **nynorsk**.", "South: **Lindesnes**. North: **Knivskjellodden** (Nordkapp).", "**Sognefjorden** 204 km; **Mjøsa** largest lake; **Glomma** longest river; **Jostedalsbreen** largest glacier.", "About **50%** mountains, **37%** forest, **3%** farmland. Gulf Stream keeps it warmer."]], ["Nature and environment", ["Resources: fish, forest, oil, hydropower; big export: **aluminium**.", "**Allemannsretten**: tent at least **150 m** from houses; no fires near forest **15 April–15 September**.", "UN goals by **2030**: end poverty, reduce inequality, stop climate change.", "Largest emission source: **oil and gas extraction**. Transport ≈ **30%** of emissions (half road traffic). **400,000 tonnes** of food thrown away a year.", "**400 kg+** rubbish per person a year; sort waste; reuse.", "Sustainable development: meet today’s needs without ruining it for future generations; **Brundtland Commission** (1983, report **1987**)."]], ["Norway in the world", ["UN **1945** (**193** members); NATO **1949**; not in the EU but in the **EEA** and **Schengen**.", "Conscription for men and women, **19–44**. Heimevernet and Sivilforsvaret."]], ["Holidays", ["1 January; Easter (Maundy Thursday, Good Friday, Easter Sunday and Monday).", "**1 May** Labour Day; **17 May** national day; **8 May** Liberation Day (flag day).", "Ascension Day (40 days after Easter); Whitsun (10 days later), Whit Monday is a day off.", "**24 Dec** julaften; **25–26 Dec** 1st and 2nd Christmas Day; **31 Dec** nyttårsaften.", "**6 February** Sámi National Day; **8 March** Women’s Day."]]]}], "no": [{"id": "key", "title": "Tall og årstall", "groups": [["Prøven", ["**38** flervalgsspørsmål, **60** minutter, **26** riktige for å bestå.", "Du kan ta prøven på norsk eller engelsk."]], ["Årstall i rekkefølge", ["**872** Harald Hårfagre blir konge over hele Norge.", "**1030** Slaget på Stiklestad; kristendommen tar over.", "**Midten av 1300-tallet** Svartedauden: omtrent **en tredel** av befolkningen dør.", "**1397** union med Danmark (og Sverige); Danmark-Norge varer til **1814**.", "**17. mai 1814** Grunnloven underskrives på Eidsvoll av **112** menn; union med Sverige fra november.", "**1898** alle menn over **25** år får stemmerett ved stortingsvalg; **1913** også kvinner over 25.", "**7. juni 1905** unionen med Sverige oppløses; **Haakon 7.** blir konge.", "**1919** åtte timers arbeidsdag.", "**9. april 1940** Tyskland angriper; **8. mai 1945** frigjøringen.", "**1947** Lånekassen. **1948** FNs menneskerettighetserklæring. **1949** NATO.", "**1959** samisk tillatt i skolen igjen. **1989** Sametinget åpner.", "**1967** første oljefunn i Nordsjøen; Ekofisk **1969**.", "**1972** og **1994** nei til EU; EØS-avtalen **1994**.", "**1978** abortloven; fra **2025** selvbestemt abort til utgangen av **uke 18**.", "**1999** avtale om nasjonale minoriteters rettigheter. **2004** dugnad kåret til nasjonalord.", "**2009** likekjønnet ekteskap. **2012** kirken skilles fra staten.", "**August 2026** Haakon 8. blir konge etter Harald 5."]], ["Tall", ["Omtrent **5,6 millioner** innbyggere; over **1 million** er innvandrere eller født i Norge av to innvandrerforeldre.", "**15** fylker og **357** kommuner.", "Stortinget: **169** representanter, valgt for **4** år. Valg hvert **2.** år (stortingsvalg og lokalvalg annenhver gang).", "Stemmerettsalder **18** år. Lokalvalg: bodd i Norge i **3** år. Stortingsvalg: bare statsborgere.", "Oslo har omtrent **725 000** innbyggere. Areal **385 178 km²**. Kystlinje **25 148 km**, rundt **50 000** øyer.", "Omtrent **halvparten** er med i en fagforening; omtrent **en tredel** jobber i offentlig sektor.", "**60–80 %** av jobbene får man gjennom nettverk. Gjennomsnittslønn like under **670 000 kr**.", "**82 %** eier boligen sin; du trenger **10 %** egenkapital for å kjøpe.", "Ferie minst **4 uker + 1 dag**; arbeidsuke **37,5** timer. Pensjonsalder **67** år."]], ["Aldersgrenser", ["**6** år: begynner på skolen. **7**: rett til å si sin mening. **12**: stor vekt på meningen.", "**15**: velger religion og utdanning selv, kriminell lavalder.", "**16**: bestemmer over egne helseopplysninger; seksuell lavalder.", "**18**: myndig – stemme, gifte seg, inngå avtaler, kjøpe tobakk, øl og vin.", "**20**: kjøpe brennevin. **19–44**: verneplikt for menn og kvinner.", "Gratis tannlege til **19** år; deretter **25 %** for unge voksne. Foreldre forsørger barna til **18** år."]], ["Telefonnumre", ["**110** brann. **112** politi. **113** ambulanse.", "**116 117** legevakt. **116 111** Alarmtelefonen for barn og unge."]]]}, {"id": "m1", "title": "Modul 1: Utdanning og arbeid", "groups": [["Barnehage", ["Styres av barnehageloven; bygger på **kristen og humanistisk** tradisjon og **menneskerettighetene**.", "Fremmer demokrati og likestilling og motarbeider diskriminering.", "Foreldremøter og individuelle samtaler; rett til **tolk**.", "Kommunen betaler mest; Stortinget har bestemt en **makspris**; rabatt for søsken og lav inntekt."]], ["Grunnskolen (1.–10. klasse)", ["Alle barn har rett til **13 års** opplæring; grunnskolen er **10 år**, gratis og obligatorisk.", "Begynner i **august** det året barnet fyller 6 år.", "Barneskolen **1.–7.**: ingen karakterer. Ungdomsskolen **8.–10.**: karakter **1–6** (6 er best) og orden og oppførsel.", "Fysisk avstraffelse er **forbudt**. Under **5 %** går på privatskole (foreldrene betaler egenandel).", "Samme læreplaner, bestemt av politikerne; gruppearbeid og prosjekter; ekstra hjelp ved behov."]], ["Hjem og skole", ["Foreldrene har **hovedansvaret** for barna.", "Utviklingssamtale minst **to ganger i året**."]], ["Videregående skole", ["Gratis; søk på nett før **1. mars**; karakterene fra 10. klasse avgjør skolen.", "Studieforberedende → **vitnemål**. Yrkesfag → **fagbrev** (2 år skole + 2 år lærling).", "Omtrent halvparten velger hver retning; nesten **80 %** fullfører."]], ["Høyere utdanning", ["Offentlige universiteter er gratis; søk gjennom **Samordna opptak** innen **15. april**.", "**Lånekassen** (opprettet **1947**) gir lån til å leve av; noe blir stipend hvis du består.", "Omtrent **60 %** av studentene er kvinner; omtrent **42 %** av voksne har høyere utdanning."]], ["Voksne og norskopplæring", ["Gratis forberedende opplæring hvis du mangler grunnskole (kommunen).", "Videregående for voksne fra **25** år (fylkeskommunen).", "Norskopplæring: gratis for noen, andre må betale; ferdig innen **3 år** (**18 måneder** med høyere utdanning).", "Nivåer A1–A2 (grunnleggende), B1–B2 (selvstendig)."]], ["Arbeidsliv", ["Omtrent **50 %** er med i en fagforening; fagforeninger forhandler lønn og rettigheter og kan streike.", "Alle arbeidsplasser må ha **HMS**-arbeid med **verneombud**.", "Arbeidsmiljøloven: ansettelse og kontrakt, arbeidstid, fravær, HMS. Alle har rett til **skriftlig arbeidsavtale**.", "Ferieloven: minst **4 uker + 1 dag**; mange har 5. Feriepenger regnes ut fra fjorårets lønn.", "Oppsigelsestid: minst **1 måned** (2 etter 5 år, 3 etter 10 år).", "Sykepenger = full lønn; arbeidsgiveren betaler de første **16 dagene**, så NAV.", "**Svart arbeid** er ulovlig, og du mister sykepenger, pensjon og forsikring."]], ["Skatt og velferd", ["Velferdsstaten bygger på **likeverd** og **tillit** og er avhengig av at mange jobber og betaler skatt.", "Skatter og avgifter betaler for sykepenger, dagpenger, gratis skole, gratis sykehus og barnetrygd.", "Skatten går til **kommunen, fylket og staten**; arbeidsgiveren trekker den hver måned.", "**Skatteetaten** lager skattekort; skattemelding hver vår.", "NAV har kontor i **alle kommuner**: sykepenger, pensjon, barnetrygd, kontantstøtte, sosialhjelp. NAV forvalter omtrent **en tredel** av statsbudsjettet; omtrent **en tredel** av de yrkesaktive jobber i det offentlige."]], ["Arbeidsmarkedet før og nå", ["For 150 år siden: jordbruk, skogbruk og fiske. Slutten av 1800-tallet: fabrikker, flytting til byene, mange reiste til USA.", "1950: over **20 %** i jordbruket; nå under **3 %**. De fleste jobber i dag i **serviceyrker**.", "Det mangler folk i helse- og omsorgsyrker."]], ["Søke jobb", ["Lav arbeidsledighet, men stor konkurranse.", "Skriftlig **søknad og CV**; bruk nettverk (**60–80 %** av jobbene lyses ikke ut), internett (nav.no, finn.no) og vikarbyrå."]], ["Kritisk tenkning", ["**Kildekritikk**: vurder hvem som har skrevet noe og hvorfor.", "**Etisk bevissthet**: balansere ulike hensyn; gir bedre dømmekraft.", "Personopplysninger er beskyttet; spør før du deler bilder av andre; hatefulle ytringer er ulovlige også på nett."]]]}, {"id": "m2", "title": "Modul 2: Familie, helse og hverdagsliv", "groups": [["Familie i tall", ["Omtrent **50 000** fødsler i året; **1,4** barn per kvinne; første barn ved rundt **30** år.", "**70 %** av parene er gift, **30 %** er samboere; rundt **20 000** gifter seg hvert år; rundt **40 %** blir skilt.", "Kjernefamilien er vanligst; **75 %** av barna bor med både mor og far.", "Foreldrepenger: inntil **61 uker** til sammen når begge foreldrene er i lønnet arbeid.", "Barnetrygd til **18** år (likt for alle); kontantstøtte for barn **13–19 måneder** uten fulltidsplass i barnehage; nesten **80 %** i 1.–4. klasse går på SFO (deltidsplass gratis)."]], ["Ekteskap og skilsmisse", ["Gifte seg fra **18** år, frivillig, ikke gift fra før, lovlig opphold. Likekjønnet ekteskap siden **2009**.", "Først separasjon; skilsmisse etter **1 år** (med en gang ved vold eller tvangsekteskap). Én ektefelle kan be om det alene.", "Etter skilsmisse har begge foreldrene plikt og rett til omsorg. **Barnebidrag** betales til den barnet bor hos.", "Ord: samboer, særbo, bonusbarn, svigerforeldre, aleneforsørger, særeie, testament."]], ["Barns rettigheter", ["Fra **7** år: rett til å si sin mening. Fra **12**: stor vekt på meningen. Fra **15**: velger utdanning og religion selv.", "Foreldre må forsørge barna til de er **18**. Det er alltid forbudt å slå barn.", "Barndommen er en tid for lek og læring, ikke arbeid."]], ["Barnevernet", ["Finnes i alle kommuner. Norge var **først i verden** (vergerådsloven fra **1900**).", "Viktigste oppgave: **beskytte** barn, helst i samarbeid med familien.", "Ansatte har **taushetsplikt**; skoler og barnehager har **meldeplikt**; alle som er bekymret, bør melde fra."]], ["Helsetjenester", ["Alle har **fastlege** og kan bytte **to ganger i året**.", "Det er **gratis** å ligge på sykehus. Egenandeler opp til et tak, så **frikort**.", "Barn under **16** år betaler ikke hos fastlegen; svangerskapskontroll er gratis (**8–12** kontroller).", "Blå resept ved kronisk sykdom. Tolk hos legen er **gratis**.", "Fra **16** år bestemmer du hvem som får se helseopplysningene dine.", "Milde smertestillende selges i matbutikker og på bensinstasjoner."]], ["Tannhelse", ["Gratis til **19** år; deretter betaler unge voksne **25 %** (det offentlige betaler 75 %); voksne utover dette betaler alt selv.", "Tannregulering: foreldrene betaler egenandel. Kontroll én gang i året."]], ["Svangerskap og identitet", ["Selvbestemt abort til utgangen av **uke 18** (fra 2025); etter det avgjør en nemnd.", "Kjønnsuttrykk og seksuell orientering er en del av identiteten; skeive er beskyttet av loven."]], ["Vold og sosial kontroll", ["All vold er ulovlig, også i familien; å se vold skader også barn.", "Tvangsekteskap: inntil **6 år** fengsel; kan annulleres innen **5 år**.", "Kjønnslemlestelse: inntil **6 år**, **15** ved grov kjønnslemlestelse; samtykke gjør det ikke lovlig.", "Brudd på avvergelsesplikten: bot eller inntil **1 år**.", "Negativ sosial kontroll tar fra folk friheten; kjærester og ektefeller bestemmer ikke over hverandre."]], ["Opphold og introduksjon", ["Overføringsflyktninger kommer via **UNHCR**; først midlertidig tillatelse (fornyes, vanligvis hvert år).", "Permanent opphold etter **3 eller 5** år; statsborgerskap etter **6–8** år.", "Integreringsloven: introduksjonsprogram fra **3 måneder til 3 år** – norsk, samfunnskunnskap, arbeid eller utdanning.", "Familiegjenforening krever nok inntekt og bolig."]], ["Kultur og normer", ["Normer = uskrevne regler; lover = skrevne regler.", "**Integrering** (delta, behold egen kultur), **assimilering** (bli lik majoriteten), **segregering** (leve adskilt).", "**Jeg-kultur** og **vi-kultur**; kultursjokk; krysspress.", "Religion er privat; rasisme og diskriminering kan anmeldes til politiet."]], ["Hverdagsliv", ["Konfirmasjon ved rundt **15** år (kirken eller humanistisk); bunad; begravelse innen **10 virkedager**.", "Stille på søndager og helligdager; kom presis; ta hverandre i hånda når dere møtes.", "**Dugnad**: ubetalt fellesarbeid, kåret til nasjonalord i **2004**.", "Sosiale arenaer: idrettslag, korps, speider, frivillige organisasjoner.", "Relativ fattigdom er vanligst; 2,7–3 millioner boliger, halvparten eneboliger; **82 %** eier."]]]}, {"id": "m3", "title": "Modul 3: Norge før og nå", "groups": [["Tidlig historie", ["De første menneskene kom for rundt **12 000** år siden; jordbruk for rundt **4000** år siden.", "Steinalder (10 000–2000 f.Kr.) → bronsealder (**1800–500 f.Kr.**) → jernalder (500 f.Kr.–1050 e.Kr.) → **vikingtid (800–1050)**.", "**872** Harald Hårfagre; **1030** Stiklestad, Olav Haraldsson; kristendommen på **1000-tallet**."]], ["Middelalder og unionstid", ["Folketallet steg fra **150 000** til **400 000** (1000–1300).", "Svartedauden på **1300-tallet**: omtrent en tredel av befolkningen døde.", "Union med Danmark fra **1397** til **1814**. Reformasjonen **1517** (Luther)."]], ["1814–1905", ["Frankrike tapte, og Danmark måtte gi Norge til Sverige. **112** menn på Eidsvoll skrev Grunnloven, **17. mai 1814**.", "Union med Sverige fra november 1814, men Norge beholdt Grunnloven og **Stortinget**.", "Nasjonalromantikken; **Ivar Aasen** samlet dialekter → **nynorsk**.", "Midt på 1800-tallet bodde **70 %** på landsbygda. **800 000** utvandret til Amerika (1850–1920).", "**7. juni 1905** unionen oppløses; to folkeavstemninger; **Haakon 7.** konge til 1957."]], ["1900-tallet", ["Vannkraft fra fossene; ressursene eies av det offentlige. Åtte timers arbeidsdag **1919**.", "Stemmerett: menn **1898**, kvinner **1913**.", "Første verdenskrig: nøytral, men rasjonering. Mellomkrigstiden: krise og arbeidsledighet.", "Andre verdenskrig: angrep **9. april 1940**; Quisling; **50 000** flyktet til Sverige; **10 000** nordmenn døde.", "Av rundt **2100** jøder ble **773** sendt til leirer, og bare **38** overlevde.", "Olje funnet **1967** (Ekofisk **1969**); oljen forandret økonomien."]], ["Demokrati og styresett", ["Konstitusjonelt monarki og parlamentarisk demokrati. Kongen har **symbolsk** makt.", "Stortinget **vedtar lover** og **statsbudsjettet** og kontrollerer regjeringen (lovgivende makt).", "Regjeringen **setter vedtak ut i livet** (utøvende); domstolene **dømmer** (dømmende).", "Staten: utenrikspolitikk, sykehus, lover, læreplaner. Fylket: videregående, fylkesveier. Kommunen: grunnskole, barnehage, eldreomsorg, vann, renovasjon.", "Statsråd med kongen hver **fredag**.", "Hemmelige valg; rundt **20** partier; koalisjons- og flertallsregjeringer."]], ["Rettigheter og likestilling", ["FNs menneskerettighetserklæring **1948**. Ytringsfrihet, religionsfrihet, forsamlingsfrihet.", "Alle tiltalte har rett til **forsvarer**; ingen straff uten dom.", "**§ 185** i straffeloven («rasismeparagrafen») forbyr hatefulle ytringer.", "Kvinner er nesten **halvparten** av de som jobber, men **2 av 3** ledere er menn.", "Lover: likestillings- og diskrimineringsloven, ekteskapsloven, arveloven.", "Trusler mot demokratiet: lav valgdeltakelse, svak tillit, falske nyheter og hatprat, kriser."]], ["Samer og minoriteter", ["Samene levde av jakt, fangst, fiske og reindrift; folkedrakten heter **kofte**.", "Fornorsking fra rundt **1850**; jordloven fra **1902** gjaldt til **1965**.", "Samisk i skolen igjen **1959**; **Sametinget** fra **1989**, valg hvert 4. år; **6. februar** samefolkets dag.", "Nasjonale minoriteter: jøder, kvener, skogfinner, rom, romani/tatere (avtale **1999**)."]], ["Religion", ["Statskirke til **2012**. Før **1845** var det forbudt å melde seg ut.", "Rundt **70 %** er medlemmer av Den norske kirke; islam er den nest største religionen. Godkjente trossamfunn får lik støtte **per medlem**.", "Fra **15** år velger du religion selv; ingen kan tvinge deg inn eller ut."]], ["Geografi", ["**385 178 km²**; grenser til Sverige, Finland og Russland; **Svalbard** hører til Norge.", "**75 %** bor langs kysten, **50 %** på Østlandet.", "Offisielle språk: norsk og samisk; skriftspråk: **bokmål** og **nynorsk**.", "Sørligst: **Lindesnes**. Nordligst: **Knivskjellodden** (Nordkapp).", "**Sognefjorden** 204 km; **Mjøsa** største innsjø; **Glomma** lengste elv; **Jostedalsbreen** største isbre.", "Omtrent **50 %** fjell, **37 %** skog, **3 %** dyrket mark. Golfstrømmen gir varmere klima."]], ["Natur og miljø", ["Naturressurser: fisk, skog, olje, vannkraft; stor eksportvare: **aluminium**.", "**Allemannsretten**: telt minst **150 m** fra hus; bålforbud nær skog **15. april–15. september**.", "FNs bærekraftsmål innen **2030**: utrydde fattigdom, mindre ulikhet, stoppe klimaendringene.", "Størst utslipp: **olje- og gassutvinning**. Transport ≈ **30 %** av utslippene (halvparten veitrafikk). **400 000 tonn** spiselig mat kastes hvert år.", "Over **400 kg** søppel per person i året; sortering; gjenbruk.", "Bærekraftig utvikling: dekke dagens behov uten å ødelegge for kommende generasjoner; **Brundtlandkommisjonen** (1983, rapport **1987**)."]], ["Norge i verden", ["FN **1945** (**193** medlemsland); NATO **1949**; ikke med i EU, men i **EØS** og **Schengen**.", "Verneplikt for menn og kvinner, **19–44** år. Heimevernet og Sivilforsvaret."]], ["Merke- og helligdager", ["1. januar; påske (skjærtorsdag, langfredag, 1. og 2. påskedag).", "**1. mai** arbeidernes dag; **17. mai** nasjonaldag; **8. mai** frigjøringsdagen (flaggdag).", "Kristi himmelfartsdag (40 dager etter påske); pinse (10 dager senere), 2. pinsedag er fridag.", "**24. des.** julaften; **25.–26. des.** 1. og 2. juledag; **31. des.** nyttårsaften.", "**6. februar** samefolkets dag; **8. mars** kvinnedagen."]]]}]};

/* ---------- state (per-browser, best effort) ---------- */
const STORE_KEY = 'know_norway_mobile_v1';
function loadState(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
const state = Object.assign({lang:'en', quiz:{}, mock:[], doc196Runs:[], doc196Missed:{en:[],no:[]}, tab:'home', module:'m1'}, loadState());
if(!state.doc196Missed || Array.isArray(state.doc196Missed)) state.doc196Missed = {en:[],no:[]};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const T = key => UI[state.lang][key];
const modules = () => state.lang==='no' ? CIVIC_MODULES_NO : CIVIC_MODULES;
const quizBank = () => state.lang==='no' ? QUIZ_BANK_NO : QUIZ_BANK;
const doc196 = () => state.lang==='no' ? DOC196_NO : DOC196_EN;
function moduleTitle(m){ return state.lang==='no' ? m.title : (MODULE_TITLE_EN[m.id]||m.title); }
function moduleById(id){ return modules().find(m=>m.id===id) || modules()[0]; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function daysBetween(a,b){ return Math.ceil((b - a) / 86400000); }
function today(){ return new Date().toLocaleDateString(state.lang==='no'?'nb-NO':'en-GB',{day:'numeric',month:'short'}); }

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang = state.lang==='no' ? 'nb' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('.lang-switch button').forEach(b=> b.setAttribute('aria-pressed', b.dataset.lang===state.lang));
  renderCountdown(); renderStudy(); renderSummary(); startMockExam(); startAll(); renderHome();
}
document.querySelectorAll('.lang-switch button').forEach(b=> b.onclick=()=>{
  if(state.lang===b.dataset.lang) return;
  state.lang = b.dataset.lang; saveState(); applyLang();
});

/* ---------- countdown ---------- */
function parseTestDate(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
function isoDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function renderCountdown(){
  const test = parseTestDate(state.testDate);
  let digits, status, mini;
  if(!test){ digits = ['–','–','–']; status = T('tapToSet'); mini = T('miniSet'); }
  else {
    const left = daysBetween(new Date(), test);
    if(left > 0){ digits = String(left).padStart(3,'0').split(''); status = T('daysUntil')(left); mini = T('miniDays')(left); }
    else if(left === 0){ digits = ['0','0','0']; status = T('testToday'); mini = T('miniOpen'); }
    else { digits = ['–','–','–']; status = T('testPassed'); mini = T('miniPassed'); }
  }
  $('boardDigits').innerHTML = digits.map(d=>'<span class="board-cell">'+d+'</span>').join('');
  $('boardStatus').textContent = status;
  $('boardWindow').textContent = test
    ? test.toLocaleDateString(state.lang==='no'?'nb-NO':'en-GB',{day:'numeric',month:'short',year:'numeric'}).toUpperCase()
    : T('noDate');
  $('miniCountdown').innerHTML = mini;
}

/* ---------- test date picker ---------- */
function openDateDialog(){
  const dlg = $('dateDialog'), input = $('dateInput');
  input.min = isoDate(new Date());
  input.value = state.testDate || '';
  if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
  input.focus();
}
function closeDateDialog(){ const dlg = $('dateDialog'); if(dlg.close) dlg.close(); else dlg.removeAttribute('open'); }
$('dateForm').onsubmit = e=>{
  e.preventDefault();
  if(!parseTestDate($('dateInput').value)){ $('dateInput').focus(); return; }
  state.testDate = $('dateInput').value; saveState(); renderCountdown(); closeDateDialog();
};
$('dateCancel').onclick = closeDateDialog;
$('miniCountdown').onclick = openDateDialog;
$('countdownBoard').onclick = openDateDialog;
$('countdownBoard').onkeydown = e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openDateDialog(); } };

/* ---------- navigation ---------- */
const TABS = ['home','study','sum','mock','all'];
function showTab(tab, keepScroll){
  if(!TABS.includes(tab)) tab = 'home';
  TABS.forEach(t=>{ $('p-'+t).hidden = t!==tab; });
  document.querySelectorAll('.tabbar button').forEach(b=>{
    if(b.dataset.tab===tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  state.tab = tab; saveState();
  if(tab==='home') renderHome();
  if(!keepScroll) window.scrollTo(0,0);
  try{ history.replaceState(null,'','#'+tab); }catch(e){}
}
document.querySelectorAll('.tabbar button').forEach(b=> b.onclick=()=>showTab(b.dataset.tab));
document.querySelectorAll('[data-go]').forEach(b=> b.onclick=()=>showTab(b.dataset.go));

/* ---------- home ---------- */
function renderHome(){
  const bestMock = state.mock.length ? Math.max(...state.mock.map(m=>m.score)) : 0;
  const best196 = state.doc196Runs.length ? Math.max(...state.doc196Runs.map(m=>m.score)) : 0;
  $('homeStats').innerHTML =
    
    '<div class="stat-tile"><div class="num">'+state.mock.length+'</div><div class="lbl">'+T('statMocks')+'</div></div>'+
    '<div class="stat-tile"><div class="num">'+bestMock+'/38</div><div class="lbl">'+T('statBestMock')+'</div></div>'+
    '<div class="stat-tile"><div class="num">'+state.doc196Runs.length+'</div><div class="lbl">'+T('fullRuns')+'</div></div>'+
    '<div class="stat-tile"><div class="num">'+best196+'/196</div><div class="lbl">'+T('statBest196')+'</div></div>';
  const rows=[];
  state.mock.slice(-3).forEach(r=>rows.push({t:r.t||0, date:r.date, label:T('mockLabel'), score:r.score, total:r.total, pass:r.score>=26}));
  state.doc196Runs.slice(-3).forEach(r=>rows.push({t:r.t||0, date:r.date, label:T('allLabel'), score:r.score, total:r.total}));
  rows.sort((a,b)=>b.t-a.t);
  $('homeHistory').innerHTML = rows.length ? rows.slice(0,6).map(r=>
    '<div class="hist-row"><span class="h-label">'+r.label+'</span><span class="h-date">'+r.date+'</span><span class="h-score" style="'+(r.pass===undefined?'':'color:var(--'+(r.pass?'good':'bad')+')')+'">'+r.score+'/'+r.total+'</span></div>'
  ).join('') : '<p class="empty">'+T('noAttempts')+'</p>';
}

/* ---------- study ---------- */
function moduleChips(wrap, activeId, onPick){
  wrap.innerHTML='';
  modules().forEach((m,i)=>{
    const chip = document.createElement('button');
    chip.className = 'chip'+(m.id===activeId?' active':'');
    chip.setAttribute('role','tab');
    chip.setAttribute('aria-selected', m.id===activeId);
    chip.innerHTML = '<span class="chip-no">'+(i+1)+'</span><span class="chip-t">'+moduleTitle(m)+'</span>';
    chip.onclick = ()=>onPick(m.id);
    wrap.appendChild(chip);
  });
}
function renderStudy(){
  moduleChips($('moduleChips'), state.module, id=>{ state.module=id; saveState(); renderStudy(); });
  const mod = moduleById(state.module);
  $('moduleIntro').innerHTML = (state.lang==='en' ? '<span class="no-name">'+T('norwegianName')+': '+mod.title+'</span>' : '')+
    T('topics')(mod.topics.length)+'. '+MODULE_INTRO[state.lang][mod.id];
  $('studyContent').innerHTML = mod.topics.map(([h,body],i)=>
    '<details class="topic"'+(i===0?' open':'')+'><summary><h3>'+h+'</h3><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></summary><p class="t-body">'+body+'</p></details>'
  ).join('');
}
$('expandAll').onclick = ()=> document.querySelectorAll('#studyContent details').forEach(d=>d.open=true);
$('collapseAll').onclick = ()=> document.querySelectorAll('#studyContent details').forEach(d=>d.open=false);

/* ---------- summary ---------- */
function renderSummary(){
  const secs = SUMMARY[state.lang];
  if(!secs.some(s=>s.id===state.sumSec)) state.sumSec = 'key';
  $('sumChips').innerHTML = secs.map(s=>'<button class="sum-chip" data-sec="'+s.id+'" aria-pressed="'+(s.id===state.sumSec)+'">'+s.title+'</button>').join('');
  $('sumChips').querySelectorAll('button').forEach(b=> b.onclick=()=>{ state.sumSec=b.dataset.sec; saveState(); renderSummary(); });
  const sec = secs.find(s=>s.id===state.sumSec);
  const fmt = t => t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  $('sumContent').innerHTML = sec.groups.map(([h,items])=>
    '<section class="sum-group"><h3>'+h+'</h3><ul>'+items.map(i=>'<li>'+fmt(i)+'</li>').join('')+'</ul></section>'
  ).join('');
}

/* ---------- quiz engine ---------- */
function buildQuiz(container, questions, opts){
  opts = opts||{};
  let qi = 0, score = 0, timer = null, quitArmed = false;
  const missed = [];
  const startedAt = Date.now();
  const items = questions.map(q=>{
    const order = shuffle([0,1,2]);
    return {q:q[0], opts:order.map(k=>q[1][k]), correct:order.indexOf(q[2]), answer:q[1][q[2]], explain:q[3]};
  });
  function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }
  function tick(){
    const el = container.querySelector('.quiz-timer');
    if(!el){ if(!container.isConnected || !container.querySelector('.opts')) stopTimer(); return; }
    const left = opts.minutes*60 - Math.floor((Date.now()-startedAt)/1000);
    const a = Math.abs(left);
    el.textContent = (left<0?'+':'')+Math.floor(a/60)+':'+String(a%60).padStart(2,'0')+(left<0?T('over'):T('left'));
    el.classList.toggle('over', left<0);
  }
  if(opts.minutes){ timer = setInterval(tick, 1000); }
  render();

  function render(){
    if(qi >= items.length) return renderResult();
    const q = items[qi];
    container.innerHTML =
      '<div class="quiz-top"><span class="quiz-progress">'+T('question')(qi+1,items.length)+' · '+T('correctSoFar')(score)+(opts.passLine?' · '+T('passAt')(opts.passLine):'')+'</span>'+
        (opts.minutes?'<span class="quiz-timer"></span>':'')+
        '<button class="quit-btn" id="qQuit">'+T('end')+'</button></div>'+
      '<div class="bar"><span style="width:'+(qi/items.length*100)+'%"></span></div>'+
      '<div class="quiz-q">'+q.q+'</div><div class="opts" id="qOpts"></div><div id="qExplain"></div>'+
      '<div class="next-bar" id="qNextBar" hidden><button class="btn btn-primary btn-block" id="qNext">'+(qi+1===items.length?T('seeResult'):T('next'))+'</button></div>';
    if(opts.minutes) tick();
    const optsWrap = container.querySelector('#qOpts');
    q.opts.forEach((text,i)=>{
      const b = document.createElement('button');
      b.className='opt';
      b.innerHTML = '<span class="letter">'+'ABC'[i]+'</span><span>'+text+'</span>';
      b.onclick = ()=>{
        const ok = i===q.correct;
        if(ok) score++; else missed.push(q);
        [...optsWrap.children].forEach((o,oi)=>{ o.disabled=true; if(oi===q.correct) o.classList.add('correct'); else if(oi===i) o.classList.add('wrong'); });
        container.querySelector('#qExplain').innerHTML = '<div class="explain '+(ok?'good':'bad')+'"><b>'+(ok?T('correct'):T('notQuite'))+'</b>'+q.explain+'</div>';
        container.querySelector('#qNextBar').hidden = false;
        container.querySelector('#qExplain').scrollIntoView({behavior:'smooth', block:'nearest'});
      };
      optsWrap.appendChild(b);
    });
    container.querySelector('#qNext').onclick = ()=>{ qi++; render(); window.scrollTo(0,0); };
    const quit = container.querySelector('#qQuit');
    quit.onclick = ()=>{
      if(!quitArmed){ quitArmed=true; quit.classList.add('armed'); quit.textContent=T('tapQuit'); setTimeout(()=>{ quitArmed=false; if(quit.isConnected){ quit.classList.remove('armed'); quit.textContent=T('end'); } }, 3000); return; }
      stopTimer(); opts.onQuit();
    };
  }
  function renderResult(){
    stopTimer();
    const pass = opts.passLine ? score >= opts.passLine : null;
    const mins = Math.round((Date.now()-startedAt)/60000);
    container.innerHTML =
      '<div class="card result"><div class="result-score">'+score+' / '+items.length+'</div>'+
      (opts.passLine ? '<div class="result-pass '+(pass?'good':'bad')+'">'+(pass?T('passResult'):T('failResult'))(opts.passLine,items.length)+'</div>' : '')+
      (opts.minutes ? '<div class="quiz-progress" style="flex:none">'+T('finishedIn')(mins,opts.minutes)+'</div>' : '')+
      '<button class="btn btn-primary btn-block" id="qRestart">'+T('tryAgain')+'</button></div>'+
      (missed.length ? '<div class="miss-list"><h3>'+T('reviewMissed')(missed.length)+'</h3>'+
        missed.map(m=>'<div class="miss-item"><b>'+m.q+'</b><span class="ans">✓ '+m.answer+'</span>'+m.explain+'</div>').join('')+'</div>'
        : '<p style="color:var(--good);text-align:center;margin:0;font-weight:600;">'+T('perfect')+'</p>');
    container.querySelector('#qRestart').onclick = opts.onRestart;
    if(opts.onFinish) opts.onFinish(score, items.length, missed.map(m=>m.q));
    window.scrollTo(0,0);
  }
  return {stop:stopTimer};
}
function record(list, score, total){ list.push({date:today(), t:Date.now(), score, total}); }


let mockRun = null;
function startMockExam(){
  if(mockRun){ mockRun.stop(); mockRun = null; }
  const area = $('mockArea');
  const best = state.mock.length ? Math.max(...state.mock.map(m=>m.score)) : null;
  area.innerHTML = '<div class="card"><h3>'+T('mockCardT')+'</h3><p>'+T('mockCardP')+'</p></div>'+
    '<div class="stat-row"><div class="stat-tile"><div class="num">'+state.mock.length+'</div><div class="lbl">'+T('statMocks')+'</div></div><div class="stat-tile"><div class="num">'+(best===null?'–':best+'/38')+'</div><div class="lbl">'+T('bestScore')+'</div></div></div>'+
    '<button class="btn btn-primary btn-block" id="startMockBtn">'+T('startMock')+'</button>';
  $('startMockBtn').onclick = ()=>{
    const b = quizBank();
    mockRun = buildQuiz(area, shuffle([...b.m1, ...b.m2, ...b.m3]).slice(0,38), {
      passLine:26, minutes:60,
      onRestart: startMockExam, onQuit: startMockExam,
      onFinish: (score,total)=>{ record(state.mock,score,total); saveState(); }
    });
  };
}

/* ---------- all 196 ---------- */
function startAll(){
  const area = $('allArea');
  const runs = state.doc196Runs, missed = state.doc196Missed[state.lang] || [];
  const best = runs.length ? Math.max(...runs.map(r=>r.score)) : null;
  area.innerHTML = '<div class="card"><h3>'+T('allCardT')+'</h3><p>'+T('allCardP')+'</p></div>'+
    '<div class="stat-row"><div class="stat-tile"><div class="num">'+runs.length+'</div><div class="lbl">'+T('fullRuns')+'</div></div><div class="stat-tile"><div class="num">'+(best===null?'–':best+'/196')+'</div><div class="lbl">'+T('bestScore')+'</div></div></div>'+
    '<div class="btn-row">'+
      (missed.length ? '<button class="btn btn-primary btn-block" id="allMissedBtn">'+T('drillMissed')(missed.length)+'</button>' : '')+
      '<button class="btn btn-block'+(missed.length?'':' btn-primary')+'" id="allFullBtn">'+T('startFull')+'</button>'+
    '</div>'+
    (runs.length ? '' : '<p class="empty">'+T('allNote')+'</p>');
  const lang = state.lang;
  $('allFullBtn').onclick = ()=> buildQuiz(area, shuffle(doc196()), {
    onRestart: startAll, onQuit: startAll,
    onFinish: (score,total,missedTexts)=>{ record(state.doc196Runs,score,total); state.doc196Missed[lang] = missedTexts; saveState(); }
  });
  const mb = $('allMissedBtn');
  if(mb) mb.onclick = ()=> buildQuiz(area, shuffle(doc196().filter(q=>missed.includes(q[0]))), {
    onRestart: startAll, onQuit: startAll,
    onFinish: (score,total,missedTexts)=>{ state.doc196Missed[lang] = missedTexts; saveState(); }
  });
}

/* ---------- init ---------- */
$('noScript').hidden = true;
applyLang();
const hashTab = (location.hash||'').slice(1);
showTab(TABS.includes(hashTab) ? hashTab : 'home', true);
setInterval(renderCountdown, 60000);
if(!state.testDate) openDateDialog();
</script>
