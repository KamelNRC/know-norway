  ['Å komme til Norge: opphold og statsborgerskap','En innvandrer er en person født i utlandet som bor i Norge. EU/EØS-borgere kan jobbe uten oppholdstillatelse, men må registrere seg hos politiet på nett. Flyktninger kommer enten som overføringsflyktninger (kvoteflyktninger, gjennom FNs UNHCR) eller som asylsøkere, som kan få beskyttelse på grunn av forfølgelse eller sterke menneskelige hensyn. Familiemedlemmer til en person med oppholdstillatelse kan søke om familiegjenforening. Tillatelser gjelder som regel i tre eller fem år og fornyes årlig i starten; etter seks til åtte år kan du søke om norsk statsborgerskap, og UDI (udi.no) behandler søknader og gir veiledning.'],
  ['Introduksjonsprogrammet i detalj','Introduksjonsprogrammet varer normalt fra tre måneder opptil tre år, avhengig av deltakerens bakgrunn, og gir introduksjonsstønad hele veien. Det drives av kommunene, hovedsakelig for flyktninger – ikke alle innvandrere har rett til det. Foreldre til barn under 18 år (eller som venter barn) må også fullføre obligatorisk foreldreveiledning: 8–12 gruppesamlinger på minst én time hver, i tillegg til 5–8 individuelle samtaler på minst 45 minutter hver.'],
  ['Ekteskap, samboerskap og skilsmisse','Rundt 70 prosent av parene i Norge er gift, og 30 prosent er samboere; om lag 20 000 par gifter seg hvert år, og rundt 40 prosent av ekteskapene forventes å ende i skilsmisse, noe som normalt krever ett års separasjon først (umiddelbart hvis ekteskapet innebar tvang eller vold). Siden 2009 kan to personer av samme kjønn gifte seg. For barn født fra og med 1. januar 2020 har begge foreldrene felles foreldreansvar, uansett om de er gift, samboere eller lever hver for seg – og i motsetning til ektefeller får ikke samboere automatisk delte økonomiske eller juridiske rettigheter, så mange inngår egne avtaler.'],
  ['Barns økende medbestemmelse','Etter barneloven har barn rett til å bli hørt før avgjørelser som gjelder dem, fra rundt sju års alder, og deres mening skal tillegges stor vekt fra tolv år. Fra 15 år kan unge selv bestemme over egen utdanning og om de vil melde seg inn i eller ut av organisasjoner. Foreldrene beholder det overordnede foreldreansvaret til barnet fyller 18 år, men må gi barnet stadig mer medbestemmelse etter hvert som det blir eldre.'],
  ['Barnevernstjenesten','Norge var det første landet i verden som opprettet en offentlig barnevernstjeneste, gjennom vergerådsloven fra 1900. Barnevernet finnes i alle kommuner, kan tilby støtte som veiledning eller avlastning ved behov, og kan gripe inn for å beskytte et barn – helst i samarbeid med familien, eller gjennom alternativ omsorg om nødvendig. De ansatte har taushetsplikt, men fagpersoner som jobber med barn har plikt til å melde fra ved mistanke om vold eller overgrep, og alle som er bekymret for et barn kan kontakte barnevernet; hjelpetelefonen for barn og unge er 116 111.'],
  ['Helsetjenester og pasientrettigheter','Alle som bor i Norge har en fastlege og kan bytte fastlege inntil to ganger i året via helsenorge.no. Et vanlig legebesøk koster typisk 150–300 kroner, men besøk for barn under 16 år og svangerskapskontroller er gratis; når egenandelene dine for året passerer en grense, får du et frikort, og videre offentlig helsehjelp er da gratis ut året. Ring legevakten på 116 117 ved akutt, men ikke livstruende, behov når fastlegen er stengt, og 113 ved medisinsk nødsituasjon. Sykehusbehandling, mat og opphold er gratis når du er innlagt, helsepersonell og tolker har taushetsplikt, og pasienter kan se sin egen journal – fra 16 år bestemmer den unge selv hvem andre, inkludert foreldre, som kan få tilgang til helseopplysningene.'],
  ['Tannhelse','Offentlige tannlegekontroller er gratis for barn og unge opp til 19 år, selv om foreldre betaler en egenandel for tannregulering. Fra 19 år betaler unge voksne 25 prosent av kostnaden ved offentlig tannbehandling (staten dekker resten); som voksen betaler man full pris og ordner tannlege selv, helst med årlig kontroll. Alle bør pusse tenner to ganger daglig, og søt eller syrlig mat og drikke (godteri, brus, juice) skader tennene – dårlige melketenner øker også risikoen for dårlige voksentenner, så foreldre har ansvar for barns tannhelse fra før den første tannen kommer.'],
  ['Svangerskap, vaksinasjon og helsekontroller for barn','Prevensjonsmetoder inkluderer p-piller og p-stav (hormoner som hindrer eggløsning), spiral (settes inn av lege) og kondom – den eneste metoden som også beskytter mot seksuelt overførbare infeksjoner. Gravide får gratis, frivillig svangerskapsomsorg (vanligvis 8–12 kontroller) og gratis fødsel på sykehus. Helsestasjonen følger opp barn i alderen 0–5 år (vekst, syn, hørsel, språk, vaksinasjon), og skolehelsetjenesten viderefører dette gjennom skolegangen; vaksinasjon er gratis og sterkt anbefalt, men krever samtykke fra foreldrene. Etter abortloven kan en kvinne avslutte et svangerskap på egen forespørsel fram til uke 18; etter det kreves godkjenning.'],
  ['De tre fasene ved å flytte til et nytt land','Å flytte til utlandet blir ofte beskrevet i tre faser: en innledende «hvetebrødsdager»-fase preget av begeistring over nye muligheter; en vanskeligere fase, noen ganger etter uker eller måneder, preget av usikkerhet, slitenhet over forskjellene og hjemlengsel; og en tilpasningsfase, der språk og forståelse av norske systemer bedres, og gamle og nye verdier begynner å falle på plass sammen. Familiemedlemmer går ofte gjennom disse fasene på ulike tidspunkter og i ulikt tempo, noe som kan skape spenninger hjemme.'],
  ['Å leve i to kulturer','Kulturer blir noen ganger beskrevet som individualistiske (verdsetter uavhengighet, likeverd og likestilling) eller kollektivistiske (verdsetter lydighet, respekt og gode relasjoner innad i gruppen). Barn som vokser opp mellom kulturer, kan møte motstridende forventninger fra foreldre og fra det norske samfunnet om hva som regnes som høflig eller riktig oppførsel.'],
  ['Fritid, dugnad og samfunnsengasjement','Fritid er den delen av døgnet som ikke går med til arbeid, mat eller søvn. Dugnad – ubetalt, frivillig fellesarbeid, som vårrengjøring i et borettslag eller å hjelpe til i en barnehage – ble kåret til Norges nasjonalord i 2004; det er formelt sett frivillig, men å utebli kan få sosiale konsekvenser. Vanlige sosiale arenaer for å bygge nettverk er idrettslag, korps, speider og frivillige organisasjoner som Røde Kors. Politisk engasjement kan være formelt (partimedlemskap, valgkamp) eller uformelt (underskriftskampanjer, demonstrasjoner, sosiale medier), og valgdeltakelsen blant de yngste velgerne har økt siden 2011.'],
  ['Tvangsekteskap og kjønnslemlestelse — de juridiske detaljene','Å tvinge noen til å gifte seg ved bruk av vold, frihetsberøvelse, press eller trusler kan straffes med fengsel i inntil 6 år, og et tvangsekteskap har ingen juridisk gyldighet – den som ble tvunget kan søke om oppheving innen fem år. Kjønnslemlestelse kan straffes med fengsel i inntil 6 år, eller inntil 15 år i grove tilfeller, og samtykke gjør det ikke lovlig; å unnlate å forsøke å forhindre det kan i seg selv føre til inntil ett års fengsel. Skoler kan ha minoritetsrådgivere, og hjelp er også tilgjengelig fra kompetanseteamet mot tvangsekteskap og kjønnslemlestelse (tlf. 478 09 050) og Røde Kors-telefonen (tlf. 815 55 201).'],
  ['Begreper innen personlig økonomi','Inntekt dekker alt som blir satt inn på kontoen din – lønn, NAV-ytelser, barnetrygd, kontantstøtte – mens utgifter dekker det du bruker penger på, fra husleie til mat til fritid. Lønn oppgis som bruttolønn (før skatt) eller nettolønn (etter skatt). Å åpne en bankkonto krever norsk fødselsnummer eller D-nummer, og hverdagsbank foregår gjennom BankID; et lån betales tilbake gjennom avdrag pluss rente, så et budsjett bør også sette av penger til sparing eller uforutsette utgifter.']
]},
{id:'m3', title:'Norge før og nå', topics:[
  ['Grunnloven av 1814','Norges grunnlov ble undertegnet på Eidsvoll 17. mai 1814. Denne datoen, Grunnlovsdagen, er Norges nasjonaldag – den feires med barnetog i stedet for militærparader.'],
  ['1905 – unionsoppløsningen','Fra 1814 var Norge i union med Sverige. Unionen ble oppløst fredelig i 1905, da Norge ble fullt selvstendig og valgte sin egen konge, Haakon VII.'],
  ['Okkupasjonen og tiden etter','Norge var okkupert av Nazi-Tyskland fra 1940 til 1945. I 1969 ble det funnet olje på Ekofisk-feltet, og rikdommen dette har gitt, blir i stor grad spart i utlandet gjennom Statens pensjonsfond utland ("Oljefondet") i stedet for å brukes med en gang.'],
  ['Norge, EU og naboland','Norge er ikke medlem av EU, men deltar i EUs indre marked gjennom EØS-avtalen og er en del av Schengen-samarbeidet med åpne grenser.'],
  ['Hvordan det norske demokratiet fungerer','Norge er et konstitusjonelt monarki og et parlamentarisk demokrati, der makten er delt mellom Stortinget (nasjonalforsamlingen, 169 representanter valgt hvert fjerde år), regjeringen (ledet av statsministeren) og uavhengige domstoler. Kong Haakon VIII ble statsoverhode i august 2026, etter at hans far, kong Harald V, døde; rollen er i hovedsak seremoniell. Jonas Gahr Støre (Arbeiderpartiet) fortsatte som statsminister etter valget i september 2025. Stemmerettsalderen er 18 år.'],
  ['Mangfold og det samiske folket','Norge anerkjenner mange familieformer (gift, samboende, aleneforsørgere, familier med to av samme kjønn) og har nasjonale minoriteter som blant annet jøder, kvener, rom og romanifolket/tatere. Samene er et urfolk med sitt eget parlament, Sametinget, som ligger i Karasjok, og har egne språklige og kulturelle rettigheter, særlig i Nord-Norge.'],
  ['Natur, miljø og allemannsretten','Friluftsliv står sentralt i norsk kultur, og støttes av allemannsretten – alles rett til fri ferdsel og opphold i utmark. Norge er sterkt avhengig av fornybar vannkraft og har en av de høyeste andelene elbiler i verden.'],
  ['Likestilling','Norge blir jevnlig rangert blant de mest likestilte landene i verden. Kvinner har hatt stemmerett siden 1913, og foreldrepermisjonen inkluderer en fedrekvote som er forbeholdt fedre.'],
  ['Menneskerettigheter og ytringsfrihet','Grunnloven og internasjonale konvensjoner Norge har ratifisert, beskytter grunnleggende rettigheter, blant annet ytringsfrihet, og likestillings- og diskrimineringsloven forbyr diskriminering på grunnlag av kjønn, etnisitet, religion, funksjonsnedsettelse og seksuell orientering.'],
  ['Religion i Norge','Den norske kirke, som historisk var statskirke, ble formelt skilt fra staten i 2012. Religionsfriheten er grunnlovfestet, og det norske samfunnet er i dag religiøst mangfoldig og i stor grad sekulært i hverdagen.'],
  ['Geografi og befolkning','Norge dekker 385 178 kvadratkilometer, grenser til Sverige, Finland og Russland, og omfatter øygruppen Svalbard. Landet er delt inn i 15 fylker og 357 kommuner. Befolkningen passerte 5,6 millioner i 2025 (opp fra under 3,9 millioner i 1970), i hovedsak drevet av innvandring, og veksten er ventet å nå rundt 6 millioner innen 2040. Om lag tre firedeler av nordmenn bor langs kysten, og halvparten bor på Østlandet. De fire største byene er Oslo (hovedstaden, med rundt 725 000 innbyggere), Bergen, Trondheim og Stavanger. Kystlinjen strekker seg 25 148 km – lenger enn avstanden fra Nordpolen til Sørpolen – med rundt 50 000 øyer. Fjell og vidder dekker om lag halvparten av landet, skog 37 %, og bare 3 % er dyrket mark.'],
  ['Offentlige høytider og tradisjoner','I tillegg til 17. mai omfatter den norske kalenderen offentlige fridager som første nyttårsdag (1. januar), påskedagene (skjærtorsdag til andre påskedag), Kristi himmelfartsdag (en torsdag 40 dager etter påske) og andre pinsedag (10 dager senere), arbeidernes dag (1. mai, markert med politiske tog) og jul (julaften, første og andre juledag). Enkelte flaggdager markeres, men er ikke fridager: samefolkets dag (6. februar) og kvinnedagen (8. mars, feiret i Norge siden 1972). Nyttårsaften (31. desember) er en familiefeiring, men ikke en offentlig fridag. I tillegg til kalenderen er livsfasehendelser som bursdager, bryllup, dåp, konfirmasjon og begravelser viktige merkedager i norsk liv.'],
  ['Samisk historie og selvstyre','Samene er urfolket ikke bare i Norge, men også i Sverige, Finland og Russland, og regnes som den eldste befolkningsgruppen i landet. Samiske språk er ikke beslektet med norsk, selv om nesten alle norske samer i dag også snakker norsk. Tradisjonelle samiske levebrød omfattet jakt, fangst, fiske og reindrift, som mange samer fortsatt driver med ved siden av moderne yrker. Fra rundt 1850-tallet førte norske myndigheter en fornorskingspolitikk: samiske barn måtte gå på norskspråklige skoler og fikk ikke lære samisk, og en lov fra 1902 forbød personer som ikke snakket norsk, å kjøpe jord i samiske områder – en regel som ikke ble opphevet før i 1965. Sametinget åpnet i 1989, med representanter valgt hvert fjerde år for å ivareta samisk kultur, språk og opplæring. Den samiske nasjonaldrakten, kofta, brukes ved spesielle anledninger som bryllup, og det samiske flagget heises over hele Norge på samefolkets dag, 6. februar.'],
  ['Nasjonale minoriteter og innvandring','I tillegg til samene anerkjenner Norge fem andre grupper som nasjonale minoriteter med århundrelang tilknytning til landet: jøder, kvener, skogfinner, rom og romanifolket/tatere. Norge ratifiserte i 1999 en europeisk avtale som beskytter nasjonale minoriteters rettigheter, og forpliktet seg dermed til å bidra til å bevare deres språk, religion, tradisjoner og kultur. Når det gjelder innvandring, er over én million av dem som bor i Norge i dag, enten født i utlandet eller født i Norge av to utenlandsfødte foreldre; de største gruppene kommer fra Polen, Litauen, Ukraina, Sverige og Syria, og de fleste innvandrere bor i byer heller enn på landsbygda. Mellom 1820 og 1930 var derimot Norge et utvandringsland: over 800 000 nordmenn dro til Amerika i denne perioden.'],
  ['Norge i forhistorien – fra steinalder til vikingtid','De første menneskene kom til Norge for rundt 12 000 år siden, etter at innlandsisen trakk seg tilbake, og levde av fisk, vilt, bær og sopp i steinalderen; jordbruk startet for rundt 4 000 år siden. I bronsealderen skaffet velstående bønder seg redskaper og smykker av bronse og begynte å bruke hest i jordbruket. I jernalderen lærte folk å utvinne jern av myrmalm, noe som ga bedre redskaper og økt matproduksjon og folketall. I vikingtiden (om lag 800–1050 e.Kr.) ledet mektige høvdinger tokt, handel og bosetting i utlandet; Harald Hårfagre ble den første kongen av et samlet Norge rundt 872. Det avgjørende vendepunktet for kristendommen kom i slaget på Stiklestad i 1030, der den kristne kongen Olav Haraldsson ble drept i kamp mot hedenske høvdinger – Olav ble senere erklært helgen, og kristendommen erstattet gradvis den norrøne religionen.'],
  ['Middelalderen, Svartedauden og unionen med Danmark','Norges befolkning vokste fra rundt 150 000 til 400 000 mellom år 1000 og 1300, men barnedødeligheten var høy og mange kvinner døde i barsel. Svartedauden, en pestpandemi som nådde Norge på midten av 1300-tallet, tok livet av om lag en tredel av befolkningen – et av de mest alvorlige demografiske sjokkene i norsk historie. Gjennom middelalderen betalte bøndene i økende grad skatt til kirke, konge og adel i stedet for å eie sin egen jord, og Norges første byer – Bergen, Trondheim (Nidaros), Oslo, Stavanger og Tønsberg – ble grunnlagt i denne perioden. Fra 1397 gikk Norge inn i en union med Danmark og Sverige; etter at Sverige trådte ut, varte unionen med Danmark helt til 1814, med København som politisk og kulturelt sentrum og dansk som skriftspråk. I 1517 splittet Martin Luthers reformasjon den europeiske kristenheten; protestantismen ble kort tid etter Norges statsreligion og forble det til statskirkeordningen opphørte i 2012.'],
  ['Nasjonalromantikken og nynorsk','På midten av 1800-tallet oppmuntret en europeisk nasjonalromantisk bevegelse landene til å dyrke sin egenart; i Norge innebar dette å løfte fram dramatisk natur og folkelige bondetradisjoner gjennom litteratur, maleri og musikk. Fordi det norske skriftspråket i århundrer hadde vært basert på dansk, reiste språkforskeren Ivar Aasen rundt i landet og samlet inn dialektprøver for å bygge en alternativ skriftnorm forankret i norsk talemål – dette ble nynorsk, som fortsatt er en av Norges to offisielle skriftlige målformer ved siden av bokmål (samisk er også et offisielt språk).'],
  ['Industrialisering, utvandring og arbeiderbevegelsen','På midten av 1800-tallet levde om lag 70 % av nordmennene på landsbygda av jordbruk og fiske; etter hvert som befolkningen vokste raskere enn tilgangen på jord og arbeid, flyttet folk til byene for å arbeide i fabrikker – byandelen økte fra om lag 15 % før 1850 til 35 % innen 1900, ofte til lange arbeidsdager og trange boforhold, med utbredt barnearbeid. Rundt 800 000 nordmenn utvandret til Amerika mellom 1850 og 1920 i håp om bedre muligheter. Den norske arbeiderbevegelsen organiserte seg fra 1880-årene og fikk reell innflytelse fra tidlig på 1900-tallet, og vant fram med kortere arbeidstid (arbeidsdagen ble kuttet til åtte timer i 1919), regler for sikkerhet på arbeidsplassen og sykepenger; om lag halvparten av norske arbeidstakere er fortsatt fagorganisert i dag.'],
  ['Kvinners stemmerett og kvinnebevegelsen','Norske menn fikk allmenn stemmerett i 1898; kvinner fikk den samme retten i 1913, blant de tidligste i verden. Den organiserte kvinnebevegelsen, aktiv fra 1880-årene, fikk ny kraft på 1970-tallet og vant fram med rettigheter som tilgang til skilsmisse, prevensjon og selvbestemmelse over egen kropp – abortloven av 1976 ga kvinner rett til selv å velge abort, en rett som ble oppdatert i 2025 til å tillate inngrepet fram til uke 19 av svangerskapet. Menn og kvinner har i dag formelt like rettigheter til utdanning, arbeid, eiendom, arv og helsetjenester, men det finnes fortsatt forskjeller: kvinner utgjør nesten halvparten av arbeidsstyrken, men innehar bare rundt en tredel av lederstillingene og jobber langt oftere deltid enn menn.'],
  ['Første verdenskrig og mellomkrigstiden','Norge holdt seg nøytralt under første verdenskrig (1914–1918), men krigen førte likevel til mangel på varer som korn, kaffe og sukker, og dermed rasjonering. Mellomkrigstiden, tiden mellom de to verdenskrigene, var preget av finanskrise og utbredt arbeidsledighet i Norge.'],
  ['Andre verdenskrig i Norge','Tyskland gikk til angrep på Norge 9. april 1940; etter noen ukers kamper kapitulerte Norge, og kongen og regjeringen flyktet til England, mens Vidkun Quisling ledet en ikke-valgt, tyskvennlig regjering – navnet hans ble et internasjonalt begrep for en kollaboratør/landssviker. Motstandsarbeidet omfattet sabotasje og illegale aviser, og rundt 50 000 nordmenn flyktet til det nøytrale Sverige under krigen. På Hitlers ordre brente tyske styrker under retretten ned det meste av Finnmark og Nord-Troms i 1944–45. Mer enn 10 000 nordmenn døde som følge av krigen. Av de om lag 2 100 jødene som bodde i Norge før krigen, ble 773 deportert til konsentrasjonsleirer, og bare 38 overlevde og vendte tilbake.'],
  ['Olje, internasjonalt samarbeid og velferdsstaten','Olje ble første gang funnet i Nordsjøen på slutten av 1960-tallet og gjorde Norge til en velstående "oljenasjon", selv om selve ressursen fortsatt er offentlig eiendom mens selskapene kjøper tidsbegrensede rettigheter til å lete etter og utvinne olje – et system som fortsatt debatteres på grunn av miljøkonsekvensene. Det moderne Norge deltar i internasjonalt samarbeid gjennom FN, NATO og EØS (men ikke EU selv), og landets rikdom og velferdssystem hviler på naturressurser – fisk, skog, olje, vannkraft og vind – sammen med prinsippet om at staten garanterer utdanning, helsetjenester og økonomisk støtte til alle som trenger det.'],
  ['Forvaltningsstruktur og maktfordeling','Norges 15 fylker og 357 kommuner er hver et folkevalgt nivå av selvstyre som opererer innenfor nasjonale rammer. Staten fastsetter utenrikspolitikken, driver sykehus, vedtar lover og fastsetter læreplaner for skolen; fylkene driver videregående skoler og fylkesveier; kommunene driver grunnskoler, barnehager, eldreomsorg, renovasjon og vann/avløp, samt lokale veier. Makten er også delt i tre på nasjonalt nivå: Stortinget vedtar lover (lovgivende makt), regjeringen foreslår og iverksetter dem (utøvende makt), og uavhengige domstoler dømmer i saker etter disse lovene (dømmende makt) – en maktfordeling som skal hindre at én statsmakt får for mye makt.'],
  ['Valg og politiske partier','Norge holder valg hvert annet år, vekslende mellom stortingsvalg og lokalvalg til fylkes- og kommunestyrer, hver for en fireårsperiode. Rundt tjue politiske partier stiller til valg, fra sosialistiske til konservative, og hvert parti utgir et partiprogram som fastsetter dets prioriteringer før et valg. Som ved alle norske valg foregår stemmegivningen hemmelig, så ingen er forpliktet til å avsløre hvilket parti de stemte på.'],
  ['Menneskerettigheter – det internasjonale rammeverket','Menneskerettigheter er universelle – rettigheter alle har rett og slett fordi de er mennesker, uansett hvor de bor eller hvilken religion eller etnisitet de tilhører. FNs verdenserklæring om menneskerettigheter ble vedtatt i 1948 og er siden blitt sluttet opp om av alle FNs medlemsland, og mye av den er skrevet inn i norsk lov. Blant kjerneprinsippene: alle er født frie og med samme menneskeverd og rettigheter; alle har de samme rettighetene uansett kjønn, religion, rase, politisk oppfatning eller nasjonalitet; tortur er forbudt i alle former; alle har rett til en rettferdig rettergang; og innbyggere har rett til å stemme i frie valg med hemmelig stemmegivning.'],
  ['Demokratiske rettigheter og plikter','Demokratiet i Norge bygger på rettigheter som følges av plikter. Ytringsfriheten lar folk diskutere og publisere meninger om politikk og religion uten å bli straffet, men rasistiske eller hatefulle ytringer er forbudt ved lov. Fra fylte 15 år kan man fritt melde seg inn i eller ut av et tros- eller livssynssamfunn. Folk kan melde seg inn i politiske partier, fagforeninger og andre organisasjoner, og holde lovlige demonstrasjoner, uten frykt for forfølgelse; fagforeninger kan også streike under visse omstendigheter. Ingen kan fengsles uten en rettssak for en uavhengig dommer, og enhver tiltalt har rett til et forsvar. Til gjengjeld forventes det at innbyggerne følger demokratisk vedtatte lover og søker endring gjennom demokratiske midler – det norske samfunnet bygger i stor grad på gjensidig tillit mellom innbyggere og myndigheter. Trusler mot dette systemet omfatter lav valgdeltakelse, fallende politisk tillit, og desinformasjon og hatefulle ytringer som kveler den åpne debatten.'],
  ['Likestillings- og diskrimineringsloven','Likestilling i Norge betyr prinsippet om at alle har samme verdi uavhengig av kjønn, alder, funksjonsnedsettelse, kulturell bakgrunn, etnisitet eller seksuell orientering. Siden kvinnekampen på 1970-tallet har kvinners yrkesdeltakelse økt kraftig, selv om det fortsatt er forskjeller i lederstillinger og studievalg. Sentrale lover som beskytter likestilling er likestillings- og diskrimineringsloven, ekteskapsloven og arveloven, i tillegg til straffeloven § 185 – som noen ganger kalles "rasismeparagrafen" – som forbyr diskriminerende eller hatefulle ytringer basert på etnisitet, hudfarge, religion, seksuell orientering, kjønnsidentitet eller funksjonsnedsettelse.'],
  ['Natur og naturressurser','Mye av Norges rikdom det siste hundreåret kommer fra naturressurser: fisk, skog, olje, vannkraft fra elver og fossefall, og i økende grad vindkraft. Aluminium, som produseres ved hjelp av store mengder billig vannkraft, er en viktig eksportvare, sammen med fisk og tømmer (som bearbeides til papir og byggematerialer, eller eksporteres rått).'],
  ['Allemannsretten – reglene i detalj','Allemannsretten lar alle gå eller gå på ski fritt over utmark – strender, skog, myr og fjell – og hvile hvor som helst underveis. Å telte på samme sted i mer enn to netter krever grunneierens tillatelse, og teltet må settes opp minst 150 meter fra hus eller hytter. Brukere må unngå å skade dyr, ødelegge naturen eller etterlate søppel, og det er forbudt å tenne bål i eller nær skog fra 15. april til 15. september (engangsgriller er tillatt med forsiktighet). Det er fritt å plukke bær, sopp og viltvoksende blomster; fiske og jakt er også tillatt, men krever vanligvis lisens.'],
  ['Bærekraftig utvikling og FNs bærekraftsmål','FNs bærekraftsmål er en felles global plan som innen 2030 tar sikte på å utrydde fattigdom, redusere ulikhet og stanse klimaendringene. Klima er gjennomsnittsværet målt over lang tid, og skiller seg fra vær fra dag til dag, og den internasjonale vitenskapelige konsensusen er at menneskeskapte CO2-utslipp – ikke naturlige variasjoner – er hoveddrivkraften bak stigende temperaturer, smeltende is, hav som stiger og blir surere, og mer ekstremvær. Ressurser er enten fornybare – som dyr, planter, vind, regn og sollys, som fornyer seg dersom de brukes bærekraftig – eller ikke-fornybare, som olje, gass og kull, som ikke gjør det. Å spise lokalprodusert mat reduserer transportrelaterte utslipp og gjør det lettere å ha oversikt over hvordan maten dyrkes, blant annet bruk av sprøytemidler og antibiotika og dyrevelferd.'],
  ['Kildesortering, avfall og utslipp','Naturvern og miljøvern betyr å begrense skaden på økosystemer og reparere skaden mennesker forårsaker, slik at dyr, planter og mennesker også i framtiden har gode levekår. Nordmenn bruker i økende grad ting om igjen fra bruktmarkedet – bruktsalg av klær og møbler har vokst raskt – og resirkulerer materialer til nye produkter, mens kommunale kildesorteringsordninger sorterer husholdningsavfall og egne gjenbruksstasjoner tar imot møbler, hvitevarer og maling. Hver nordmann produserer flere hundre kilo avfall i året, og Norge kaster årlig rundt 400 000 tonn spiselig mat – en del av den globale tredelen av all mat som produseres, som går til spille. Norges viktigste kilder til klimagassutslipp er olje- og gassproduksjon, industri, bergverk og veitrafikk, selv om 2024 var det første året elbiler var flere enn rene bensinbiler blant nybilregistreringene.']

const STORE_KEY = 'know_norway_mobile_v1';
function loadState(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
const state = Object.assign({lang:'en', quiz:{}, mock:[], doc196Runs:[], doc196Missed:{en:[],no:[]}, tab:'home', module:'m1'}, loadState());

/* ---------- helpers ---------- */

const T = key => UI[state.lang][key];
const modules = () => state.lang==='no' ? CIVIC_MODULES_NO : CIVIC_MODULES;
const quizBank = () => state.lang==='no' ? QUIZ_BANK_NO : QUIZ_BANK;
const doc196 = () => state.lang==='no' ? DOC196_NO : DOC196_EN;
function moduleTitle(m){ return state.lang==='no' ? m.title : (MODULE_TITLE_EN[m.id]||m.title); }
function moduleById(id){ return modules().find(m=>m.id===id) || modules()[0]; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function daysBetween(a,b){ return Math.ceil((b - a) / 86400000); }
function today(){ return new Date().toLocaleDateString(state.lang==='no'?'nb-NO':'en-GB',{day:'numeric',month:'short'}); }

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang = state.lang==='no' ? 'nb' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('.lang-switch button').forEach(b=> b.setAttribute('aria-pressed', b.dataset.lang===state.lang));
  renderCountdown(); renderStudy(); startMockExam(); startAll(); renderHome();
}
document.querySelectorAll('.lang-switch button').forEach(b=> b.onclick=()=>{
  if(state.lang===b.dataset.lang) return;
  state.lang = b.dataset.lang; saveState(); applyLang();
});

/* ---------- countdown ---------- */
function parseTestDate(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
function isoDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function renderCountdown(){
  const test = parseTestDate(state.testDate);
  let digits, status, mini;
  if(!test){ digits = ['–','–','–']; status = T('tapToSet'); mini = T('miniSet'); }
  else {
    const left = daysBetween(new Date(), test);
    if(left > 0){ digits = String(left).padStart(3,'0').split(''); status = T('daysUntil')(left); mini = T('miniDays')(left); }
    else if(left === 0){ digits = ['0','0','0']; status = T('testToday'); mini = T('miniOpen'); }
    else { digits = ['–','–','–']; status = T('testPassed'); mini = T('miniPassed'); }
  }
  $('boardDigits').innerHTML = digits.map(d=>'<span class="board-cell">'+d+'</span>').join('');
  $('boardStatus').textContent = status;
  $('boardWindow').textContent = test
    ? test.toLocaleDateString(state.lang==='no'?'nb-NO':'en-GB',{day:'numeric',month:'short',year:'numeric'}).toUpperCase()
    : T('noDate');
  $('miniCountdown').innerHTML = mini;
}

/* ---------- test date picker ---------- */
function openDateDialog(){
  const dlg = $('dateDialog'), input = $('dateInput');
  input.min = isoDate(new Date());
  input.value = state.testDate || '';
  if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
  input.focus();
}
function closeDateDialog(){ const dlg = $('dateDialog'); if(dlg.close) dlg.close(); else dlg.removeAttribute('open'); }
$('dateForm').onsubmit = e=>{
  e.preventDefault();
  if(!parseTestDate($('dateInput').value)){ $('dateInput').focus(); return; }
  state.testDate = $('dateInput').value; saveState(); renderCountdown(); closeDateDialog();
};
$('dateCancel').onclick = closeDateDialog;
$('miniCountdown').onclick = openDateDialog;
$('countdownBoard').onclick = openDateDialog;
$('countdownBoard').onkeydown = e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openDateDialog(); } };

/* ---------- navigation ---------- */
const TABS = ['home','study','mock','all'];
function showTab(tab, keepScroll){
  if(!TABS.includes(tab)) tab = 'home';
  TABS.forEach(t=>{ $('p-'+t).hidden = t!==tab; });
  document.querySelectorAll('.tabbar button').forEach(b=>{
    if(b.dataset.tab===tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  state.tab = tab; saveState();
  if(tab==='home') renderHome();
  if(!keepScroll) window.scrollTo(0,0);
  try{ history.replaceState(null,'','#'+tab); }catch(e){}
}
document.querySelectorAll('.tabbar button').forEach(b=> b.onclick=()=>showTab(b.dataset.tab));
document.querySelectorAll('[data-go]').forEach(b=> b.onclick=()=>showTab(b.dataset.go));

/* ---------- home ---------- */
function renderHome(){
  const bestMock = state.mock.length ? Math.max(...state.mock.map(m=>m.score)) : 0;
  const best196 = state.doc196Runs.length ? Math.max(...state.doc196Runs.map(m=>m.score)) : 0;
  $('homeStats').innerHTML =
    
    '<div class="stat-tile"><div class="num">'+state.mock.length+'</div><div class="lbl">'+T('statMocks')+'</div></div>'+
    '<div class="stat-tile"><div class="num">'+bestMock+'/38</div><div class="lbl">'+T('statBestMock')+'</div></div>'+
    '<div class="stat-tile"><div class="num">'+state.doc196Runs.length+'</div><div class="lbl">'+T('fullRuns')+'</div></div>'+
    '<div class="stat-tile"><div class="num">'+best196+'/196</div><div class="lbl">'+T('statBest196')+'</div></div>';
  const rows=[];
  state.mock.slice(-3).forEach(r=>rows.push({t:r.t||0, date:r.date, label:T('mockLabel'), score:r.score, total:r.total, pass:r.score>=26}));
  state.doc196Runs.slice(-3).forEach(r=>rows.push({t:r.t||0, date:r.date, label:T('allLabel'), score:r.score, total:r.total}));
  rows.sort((a,b)=>b.t-a.t);
  $('homeHistory').innerHTML = rows.length ? rows.slice(0,6).map(r=>
    '<div class="hist-row"><span class="h-label">'+r.label+'</span><span class="h-date">'+r.date+'</span><span class="h-score" style="'+(r.pass===undefined?'':'color:var(--'+(r.pass?'good':'bad')+')')+'">'+r.score+'/'+r.total+'</span></div>'
  ).join('') : '<p class="empty">'+T('noAttempts')+'</p>';
}

/* ---------- study ---------- */
function moduleChips(wrap, activeId, onPick){
  wrap.innerHTML='';
  modules().forEach((m,i)=>{
    const chip = document.createElement('button');
    chip.className = 'chip'+(m.id===activeId?' active':'');
    chip.setAttribute('role','tab');
    chip.setAttribute('aria-selected', m.id===activeId);
    chip.innerHTML = '<span class="chip-no">'+(i+1)+'</span><span class="chip-t">'+moduleTitle(m)+'</span>';
    chip.onclick = ()=>onPick(m.id);
    wrap.appendChild(chip);
  });
}
function renderStudy(){
  moduleChips($('moduleChips'), state.module, id=>{ state.module=id; saveState(); renderStudy(); });
  const mod = moduleById(state.module);
  $('moduleIntro').innerHTML = (state.lang==='en' ? '<span class="no-name">'+T('norwegianName')+': '+mod.title+'</span>' : '')+
    T('topics')(mod.topics.length)+'. '+MODULE_INTRO[state.lang][mod.id];
  $('studyContent').innerHTML = mod.topics.map(([h,body],i)=>
    '<details class="topic"'+(i===0?' open':'')+'><summary><h3>'+h+'</h3><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></summary><p class="t-body">'+body+'</p></details>'
  ).join('');
}
$('expandAll').onclick = ()=> document.querySelectorAll('#studyContent details').forEach(d=>d.open=true);
$('collapseAll').onclick = ()=> document.querySelectorAll('#studyContent details').forEach(d=>d.open=false);

/* ---------- quiz engine ---------- */
function buildQuiz(container, questions, opts){
  opts = opts||{};
  let qi = 0, score = 0, timer = null, quitArmed = false;
  const missed = [];
  const startedAt = Date.now();
  const items = questions.map(q=>{
    const order = shuffle([0,1,2]);
    return {q:q[0], opts:order.map(k=>q[1][k]), correct:order.indexOf(q[2]), answer:q[1][q[2]], explain:q[3]};
  });
  function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }
  function tick(){
    const el = container.querySelector('.quiz-timer');
    if(!el){ if(!container.isConnected || !container.querySelector('.opts')) stopTimer(); return; }
    const left = opts.minutes*60 - Math.floor((Date.now()-startedAt)/1000);
    const a = Math.abs(left);
    el.textContent = (left<0?'+':'')+Math.floor(a/60)+':'+String(a%60).padStart(2,'0')+(left<0?T('over'):T('left'));
    el.classList.toggle('over', left<0);
  }
  if(opts.minutes){ timer = setInterval(tick, 1000); }
  render();

  function render(){
    if(qi >= items.length) return renderResult();
    const q = items[qi];
    container.innerHTML =
      '<div class="quiz-top"><span class="quiz-progress">'+T('question')(qi+1,items.length)+' · '+T('correctSoFar')(score)+(opts.passLine?' · '+T('passAt')(opts.passLine):'')+'</span>'+
        (opts.minutes?'<span class="quiz-timer"></span>':'')+
        '<button class="quit-btn" id="qQuit">'+T('end')+'</button></div>'+
      '<div class="bar"><span style="width:'+(qi/items.length*100)+'%"></span></div>'+
      '<div class="quiz-q">'+q.q+'</div><div class="opts" id="qOpts"></div><div id="qExplain"></div>'+
      '<div class="next-bar" id="qNextBar" hidden><button class="btn btn-primary btn-block" id="qNext">'+(qi+1===items.length?T('seeResult'):T('next'))+'</button></div>';
    if(opts.minutes) tick();
    const optsWrap = container.querySelector('#qOpts');
    q.opts.forEach((text,i)=>{
      const b = document.createElement('button');
      b.className='opt';
      b.innerHTML = '<span class="letter">'+'ABC'[i]+'</span><span>'+text+'</span>';
      b.onclick = ()=>{
        const ok = i===q.correct;
        if(ok) score++; else missed.push(q);
        [...optsWrap.children].forEach((o,oi)=>{ o.disabled=true; if(oi===q.correct) o.classList.add('correct'); else if(oi===i) o.classList.add('wrong'); });
        container.querySelector('#qExplain').innerHTML = '<div class="explain '+(ok?'good':'bad')+'"><b>'+(ok?T('correct'):T('notQuite'))+'</b>'+q.explain+'</div>';
        container.querySelector('#qNextBar').hidden = false;
        container.querySelector('#qExplain').scrollIntoView({behavior:'smooth', block:'nearest'});
      };
      optsWrap.appendChild(b);
    });
    container.querySelector('#qNext').onclick = ()=>{ qi++; render(); window.scrollTo(0,0); };
    const quit = container.querySelector('#qQuit');
    quit.onclick = ()=>{
      if(!quitArmed){ quitArmed=true; quit.classList.add('armed'); quit.textContent=T('tapQuit'); setTimeout(()=>{ quitArmed=false; if(quit.isConnected){ quit.classList.remove('armed'); quit.textContent=T('end'); } }, 3000); return; }
      stopTimer(); opts.onQuit();
    };
  }
  function renderResult(){
    stopTimer();
    const pass = opts.passLine ? score >= opts.passLine : null;
    const mins = Math.round((Date.now()-startedAt)/60000);
    container.innerHTML =
      '<div class="card result"><div class="result-score">'+score+' / '+items.length+'</div>'+
      (opts.passLine ? '<div class="result-pass '+(pass?'good':'bad')+'">'+(pass?T('passResult'):T('failResult'))(opts.passLine,items.length)+'</div>' : '')+
      (opts.minutes ? '<div class="quiz-progress" style="flex:none">'+T('finishedIn')(mins,opts.minutes)+'</div>' : '')+
      '<button class="btn btn-primary btn-block" id="qRestart">'+T('tryAgain')+'</button></div>'+
      (missed.length ? '<div class="miss-list"><h3>'+T('reviewMissed')(missed.length)+'</h3>'+
        missed.map(m=>'<div class="miss-item"><b>'+m.q+'</b><span class="ans">✓ '+m.answer+'</span>'+m.explain+'</div>').join('')+'</div>'
        : '<p style="color:var(--good);text-align:center;margin:0;font-weight:600;">'+T('perfect')+'</p>');
    container.querySelector('#qRestart').onclick = opts.onRestart;
    if(opts.onFinish) opts.onFinish(score, items.length, missed.map(m=>m.q));
    window.scrollTo(0,0);
  }
  return {stop:stopTimer};
}
function record(list, score, total){ list.push({date:today(), t:Date.now(), score, total}); }


let mockRun = null;
function startMockExam(){
  if(mockRun){ mockRun.stop(); mockRun = null; }
  const area = $('mockArea');
  const best = state.mock.length ? Math.max(...state.mock.map(m=>m.score)) : null;
  area.innerHTML = '<div class="card"><h3>'+T('mockCardT')+'</h3><p>'+T('mockCardP')+'</p></div>'+
    '<div class="stat-row"><div class="stat-tile"><div class="num">'+state.mock.length+'</div><div class="lbl">'+T('statMocks')+'</div></div><div class="stat-tile"><div class="num">'+(best===null?'–':best+'/38')+'</div><div class="lbl">'+T('bestScore')+'</div></div></div>'+
    '<button class="btn btn-primary btn-block" id="startMockBtn">'+T('startMock')+'</button>';
  $('startMockBtn').onclick = ()=>{
    const b = quizBank();
    mockRun = buildQuiz(area, shuffle([...b.m1, ...b.m2, ...b.m3]).slice(0,38), {
      passLine:26, minutes:60,
      onRestart: startMockExam, onQuit: startMockExam,
      onFinish: (score,total)=>{ record(state.mock,score,total); saveState(); }
    });
  };
}

/* ---------- all 196 ---------- */
function startAll(){
  const area = $('allArea');
  const runs = state.doc196Runs, missed = state.doc196Missed[state.lang] || [];
  const best = runs.length ? Math.max(...runs.map(r=>r.score)) : null;
  area.innerHTML = '<div class="card"><h3>'+T('allCardT')+'</h3><p>'+T('allCardP')+'</p></div>'+
    '<div class="stat-row"><div class="stat-tile"><div class="num">'+runs.length+'</div><div class="lbl">'+T('fullRuns')+'</div></div><div class="stat-tile"><div class="num">'+(best===null?'–':best+'/196')+'</div><div class="lbl">'+T('bestScore')+'</div></div></div>'+
    '<div class="btn-row">'+
      (missed.length ? '<button class="btn btn-primary btn-block" id="allMissedBtn">'+T('drillMissed')(missed.length)+'</button>' : '')+
      '<button class="btn btn-block'+(missed.length?'':' btn-primary')+'" id="allFullBtn">'+T('startFull')+'</button>'+
    '</div>'+
    (runs.length ? '' : '<p class="empty">'+T('allNote')+'</p>');
  const lang = state.lang;
  $('allFullBtn').onclick = ()=> buildQuiz(area, shuffle(doc196()), {
    onRestart: startAll, onQuit: startAll,
    onFinish: (score,total,missedTexts)=>{ record(state.doc196Runs,score,total); state.doc196Missed[lang] = missedTexts; saveState(); }
  });
  const mb = $('allMissedBtn');
  if(mb) mb.onclick = ()=> buildQuiz(area, shuffle(doc196().filter(q=>missed.includes(q[0]))), {
    onRestart: startAll, onQuit: startAll,
    onFinish: (score,total,missedTexts)=>{ state.doc196Missed[lang] = missedTexts; saveState(); }
  });
}

/* ---------- init ---------- */
$('noScript').hidden = true;
applyLang();
const hashTab = (location.hash||'').slice(1);
showTab(TABS.includes(hashTab) ? hashTab : 'home', true);
setInterval(renderCountdown, 60000);
if(!state.testDate) openDateDialog();
</script>
