  ['Flere årstall i historien','Før 1845 var det forbudt for nordmenn å melde seg ut av statskirken. Dissenterloven av 1845 ga andre kristne trossamfunn lov til å organisere seg, og fra 1851 fikk jøder komme til landet. På slutten av 1800-tallet begynte man å lage elektrisitet fra fossene. En egen lov sørget for at private kunne bygge ut vannkraften, mens selve vannkraftressursen fortsatt ble eid av det offentlige. Fra 1959 ble det igjen tillatt å bruke samisk i skolen. Frigjøringsdagen 8. mai markerer slutten på den tyske okkupasjonen i 1945 og er en flaggdag. I 1967 ble det første gang funnet olje i Nordsjøen, og det store Ekofisk-feltet ble funnet i 1969. Arbeiderbevegelsen i Norge har røtter tilbake til 1600-tallet, men ble mer organisert fra 1880-årene.'],
  ['Norge i verden og forsvaret','Norge var med på å grunnlegge De forente nasjoner (FN) i 1945. FN har i dag 193 medlemsland og jobber for fred, menneskerettigheter, mat, utdanning og helse. UNICEF er FNs barnefond, og UNHCR er FNs høykommissær for flyktninger. Norge var også med på å grunnlegge NATO (1949), en militær allianse der landene lover å hjelpe hverandre hvis ett av dem blir angrepet. Nordmenn stemte nei til EU-medlemskap i 1972 og 1994, men Norge handler i EUs indre marked gjennom EØS-avtalen og er med i Schengen-avtalen, som gjør at man kan reise mellom medlemslandene uten passkontroll. Norge har verneplikt for norske statsborgere av begge kjønn (kvinner født i 1997 eller senere er med), vanligvis fra 19 til 44 år. Heimevernet forsvarer lokalområder i en krise, og Sivilforsvaret beskytter sivilbefolkningen og hjelper nødetatene i krig og ved katastrofer.'],
  ['Lov, domstoler og rullebladet','Rettssikkerhet betyr at ingen kan straffes uten en rettferdig rettssak, at alle er like for loven, og at myndighetene også må følge loven. Alle som er tiltalt for en forbrytelse, har rett til en forsvarer, og i straffesaker betaler staten forsvareren. Den kriminelle lavalderen er 15 år. I stedet for fengsel kan en domstol gi samfunnsstraff, som er ubetalt arbeid for samfunnet. Dommer blir registrert i strafferegisteret (ofte kalt rullebladet), og noen jobber, for eksempel arbeid med barn, krever politiattest som viser ren vandel. Voldtekt til samleie har en minstestraff på tre års fengsel. Taushetsplikt betyr at leger, politi, lærere og andre offentlig ansatte ikke kan fortelle andre om private forhold om deg. Meldeplikt betyr at ansatte i barnehager, skoler og helsetjenester må kontakte barnevernet hvis de tror at et barn blir utsatt for omsorgssvikt eller overgrep.'],
  ['Regjeringsdannelse og kongens rolle','Etter et stortingsvalg blir den som kan få støtte fra et flertall på Stortinget, vanligvis en partileder, statsminister. Det er ikke alltid lederen av det største partiet. En koalisjonsregjering består av flere partier. En flertallsregjering har støtte fra mer enn halvparten av de 169 representantene, mens en mindretallsregjering må finne støtte fra sak til sak. Hver fredag har regjeringen et møte med kongen på slottet som kalles statsråd. Der informerer statsrådene kongen, og formelle vedtak blir gjort. Kongen har bare symbolsk makt og er politisk nøytral, men han signerer alle regjeringens offisielle beslutninger og lovene Stortinget vedtar. Tittelen går i arv og velges ikke: Kong Haakon 8. er gift med dronning Mette-Marit, og kronprinsesse Ingrid Alexandra (født 2004) skal arve tronen. Broren hennes er prins Sverre Magnus (født 2005). Regjeringen består av statsministeren og statsrådene – en statsråd er den politiske lederen for et departement – og den foreslår nye lover og lager forslag til statsbudsjett hvert år. Stortinget er den øverste statsmakten: det vedtar lover og statsbudsjettet, kontrollerer regjeringen og drøfter store politiske saker. Alle kan være til stede i Stortinget og høre debattene (men ikke snakke), og mange saker sendes ut på høring.'],
  ['Religion og livssyn i tall','Rundt sytti prosent av befolkningen i Norge er medlemmer av Den norske kirke. Godkjente tros- og livssynssamfunn får like mye støtte fra staten og kommunen per medlem som Den norske kirke. Kristendommen er fortsatt den største religionen, og islam er den nest største. Mange er medlemmer av andre tros- eller livssynssamfunn. Human-Etisk Forbund er det største livssynssamfunnet som ikke er religiøst, og stadig flere hører ikke til noe samfunn. Nordmenn ser gjerne på religion som noe privat, og mange som ikke er religiøse, bruker likevel kirken til dåp, konfirmasjon, bryllup og begravelse.'],
  ['Utslipp og avfall i tall','Transport samlet står for rundt 30 prosent av klimagassutslippene i Norge, og omtrent halvparten av dette kommer fra veitrafikk. Sjøfart og fiske er også store utslippskilder. Men de største utslippene kommer fra olje- og gassutvinning, industri og bergverk og veitrafikk, og utslippene av klimagasser i Norge går jevnt nedover. Målet i Norge var at alle nye biler som selges fra 2025, skal være nullutslippsbiler, og at all økning i persontransporten i de store byene skal skje med kollektivtransport, sykkel eller gange. Hver innbygger i Norge kaster mer enn 400 kilo søppel i året, i mange kommuner sorterer innbyggerne sitt eget avfall, og gjenbruk har blitt veldig populært de siste årene.'],
  ['Bærekraftig utvikling og Brundtlandkommisjonen','Bærekraftig utvikling er en samfunnsutvikling som dekker menneskenes behov i dag, uten at vi ødelegger mulighetene for de generasjonene som kommer etter oss. Begrepet kom inn i verdens språk på slutten av 1980-årene gjennom FNs verdenskommisjon for miljø og utvikling, som ble opprettet i 1983 og ledet av tidligere statsminister Gro Harlem Brundtland (Brundtlandkommisjonen). Kommisjonen la fram rapporten sin i 1987. Naturen er også i seg selv en ressurs: turister kommer for å se fjordene og midnattssola, og alle i Norge har kort vei til naturen. Gjenbruk betyr at ting brukes på nytt av andre mennesker; gjenvinning betyr at ting plukkes fra hverandre eller smeltes om til råvarer for nye produkter. Matsvinn er spiselig mat som kastes – maten som kastes globalt hvert år, ville vært nok til å fø alle sultne mennesker i verden.']
]}
];

 ['Parents who do not speak Norwegian are going to a parents\' meeting at the kindergarten. Do they have the right to bring an interpreter?',['Yes, they have the right to bring an interpreter','No, they do not have the right to an interpreter','Only if the child is over 5 years old'],0,'Parents who do not speak Norwegian have the right to an interpreter at parents\' meetings.'],
 ['In lower secondary school, pupils get grades for orderliness and conduct. Which grades can they get?',['Good, fairly good and not very good','From 0 to 100 percent','From 1 to 6, where 6 is the best grade'],0,'For orderliness and conduct, pupils get the grades good, fairly good or not very good.'],
 ['Which statement about compulsory school (grunnskole) is correct?',['Compulsory school is mandatory and free','Compulsory school lasts 13 years','Primary level is from grade 1 to grade 6'],0,'Compulsory school is free and mandatory for all children.'],
 ['Where is physical punishment of children forbidden in Norway?',['Both at school and at home','Only at school','Only at public schools'],0,'Physical punishment is forbidden in Norway, both at school and at home.'],
 ['Which statement about compulsory school in Norway is correct?',['Children get a fairly similar education regardless of which municipality they live in','At school, pupils seldom work in groups, and they do not do project work','Each school makes its own curricula'],0,'All schools follow the same national curricula, so education is fairly similar across the country.'],
 ['What is correct about pupils in compulsory school?',['No distinction shall be made between pupils because of where they live, family background or gender','Boys have the right to more education than girls','Children from well-off families have the right to better education'],0,'All children in compulsory school have an equal right to education, regardless of where they live, family background or gender.'],
 ['Sometimes cooperation between home and school does not work. What can be a problem?',['The parents do not want the children to take part in PE, swimming or school camp','The parents read all written information from the school','The parents contact the teacher when they wonder about something'],0,'Teachers say it is a problem when pupils are not allowed to take part in PE, swimming or teaching outside school.'],
 ['Who has the main responsibility for children?',['The parents','The school','The municipality'],0,'Parents have the main responsibility for their children.'],
 ['Which statement about information from the school is correct?',['It is important that parents read and familiarise themselves with all written information from the school','Information from the school comes on Facebook','It is fine not to keep up with written information from the school'],0,'It is important that parents read and familiarise themselves with all written information from the school.'],
 ['Who is responsible for the child\'s education?',['The school shares the responsibility with the parents','The child must make sure on its own that it learns what it needs','Only the school; the parents have no responsibility'],0,'The school and the parents share responsibility for the child\'s education.'],
 ['Are there private upper secondary schools in Norway?',['There are some private upper secondary schools. There you have to pay a fee','Schools in Norway are public. There are no schools where you have to pay a fee','There are private upper secondary schools, and they are free'],0,'There are some private upper secondary schools, and there you have to pay a fee.'],
 ['Which statement about upper secondary school is correct?',['The vast majority choose to attend upper secondary school','You must pay a fee at public upper secondary schools','The vocational programme is a theoretical education'],0,'The vast majority of young people in Norway choose to attend upper secondary school.'],
 ['Which statement about higher education is correct?',['Norwegian-born people with immigrant parents have a higher share in higher education than the rest of the population','About 30 percent of today\'s students are women','Lånekassen was established in 1974'],0,'A larger share of Norwegian-born people with immigrant parents take higher education than the rest of the population.'],
 ['A student has received a loan from Lånekassen. What is correct?',['The loan must be paid back when you have finished studying','The loan never has to be paid back','The loan must be paid back before you start studying'],0,'Loans from Lånekassen must be repaid after your studies, while grants do not have to be repaid.'],
 ['Who is responsible for offering primary and lower secondary education, also for adults?',['The municipality','The state','The county authority'],0,'The municipality is responsible for primary and lower secondary education, also for adults.'],
 ['Which statement about education for adults is correct?',['Many adults receive grants and/or loans from Lånekassen while they are at school','It is unusual to get an education as an adult','Adults who have not completed compulsory school have no rights'],0,'Many adults who take education receive grants and/or loans from Lånekassen.'],
 ['Where can health personnel with education from another country apply for authorisation?',['The Norwegian Directorate of Health (Helsedirektoratet)','Nav','The Tax Administration (Skatteetaten)'],0,'Health personnel apply for authorisation from the Norwegian Directorate of Health.'],
 ['What is it called that we keep learning all our lives?',['Lifelong learning','Prior learning (realkompetanse)','Primary and lower secondary education'],0,'Continuing to learn throughout life is called lifelong learning.'],
 ['In Norwegian language training, the goal is in principle set according to the participant\'s educational background on arrival in Norway. What does that mean?',['The higher the education you have, the higher the goal set for your Norwegian level','A person who has completed upper secondary school gets a higher goal than someone with higher education','Everyone gets the same goal in language training, regardless of education'],0,'The goal for the Norwegian level is set higher the more education the participant has.'],
 ['Which statement about Norwegian language training is correct?',['Norwegian training ends with a Norwegian test to document the level','Everyone who settles in Norway gets the same offer of Norwegian training','All Norwegian training must be finished within four years'],0,'Norwegian training ends with a Norwegian test that documents the level.'],
 ['Why is it a goal that everyone who lives in Norway should master Norwegian?',['A common language helps create a community and makes integration easier','It is forbidden to speak languages other than Norwegian in Norway','There is only one way to learn Norwegian'],0,'A common language creates community and makes integration easier.'],
 ['What can employees do if employers and employees do not reach agreement in negotiations?',['Go on strike','Report the employer to the police','Fine the employer'],0,'If the parties do not agree, employees may have the right to go on strike.'],
 ['Which statement about working life is correct?',['Employers and employees are obliged to follow the agreements made during negotiations','It is not the employer\'s job to ensure health, environment and safety (HSE) at the workplace','Employees are not allowed to go on strike in Norway'],0,'Both employers and employees must follow the agreements the parties reach in negotiations.'],
 ['Norwegian working life is arranged for co-determination. What does that mean?',['Each employee shall be heard and take part in arranging their own work situation','The employer decides everything alone','The safety representative is the employer\'s representative'],0,'Co-determination means that employees are heard and can influence their own work situation.'],
 ['What does the Holiday Act (ferieloven) say something about, among other things?',['Holiday pay and how much holiday you are entitled to','Working hours, employment and contracts','How much tax you must pay'],0,'The Holiday Act covers, among other things, holiday pay and how much holiday you are entitled to.'],
 ['Who has the main responsibility for the working environment at the workplace?',['The employer','The trade union','Nav'],0,'The employer has the main responsibility for the working environment.'],
 ['Which statement about employees is correct?',['The employee has a duty to help create a good working environment','Employees have no duties','A law and an agreement are the same thing'],0,'Employees also have duties, including contributing to a good working environment.'],
 ['How do employers and employees reach agreements?',['Through their organisations','Through Nav','Through the municipality'],0,'Employers and employees negotiate agreements through their organisations.'],
 ['Who has the main responsibility for providing welfare benefits to the population in Norway?',['The state and the municipality','The county authority and the state','The extended family and the county authority'],0,'The state and the municipality have the main responsibility for welfare benefits in Norway.'],
 ['What are examples of welfare schemes in Norway?',['Free school and free hospital stays','Free swimming pools and gyms','Free public transport'],0,'Free school and free hospital stays are examples of welfare schemes.'],
 ['Which statement about Nav is correct?',['Nav is responsible for all social security schemes in Norway','There are only three Nav offices in Norway: in Oslo, Trondheim and Bergen','Nav negotiates with employers about pay and holidays'],0,'Nav is responsible for all social security schemes in Norway.'],
 ['What does a welfare state depend on?',['That as many people as possible work and pay tax','That people pay for school and hospitals themselves','That the family takes care of everyone who needs help'],0,'The welfare state is funded by taxes, so it needs as many people as possible to work and pay tax.'],
 ['What is the use of welfare benefits in Norway largely based on?',['Trust','Weekly checks','Personal connections'],0,'Use of welfare benefits is largely based on trust between the state and its inhabitants.'],
 ['Who decides which welfare schemes we should have in Norway?',['The politicians','The Nav office in each municipality','The trade unions'],0,'It is the politicians who decide which welfare schemes we should have.'],
 ['Which statement about the welfare state is correct?',['The welfare state can give financial help to those who need it','In a welfare state, all inhabitants get free housing and food','Welfare schemes cannot be changed without changing the Constitution'],0,'The welfare state can give financial help to those who need it.'],
 ['What is gross pay (bruttolønn)?',['Pay before tax','Pay after tax','Pay for overtime'],0,'Gross pay is the pay before tax has been deducted.'],
 ['Who has the right to a written employment contract?',['Everyone who is employed somewhere','Only those with a permanent position','Only those who are members of a trade union'],0,'Everyone who is employed has the right to a written employment contract.'],
 ['Which statement about pay and tax is correct?',['Everyone who earns more than a minimum amount per year must pay tax','Net pay is pay before tax','You usually get paid twice a year'],0,'Everyone who earns more than a certain minimum amount per year must pay tax.'],
 ['Who earns the most on average in Norway?',['Men','Women','Women and men earn exactly the same'],0,'Women earn less than men on average in Norway.'],
 ['Which statement about tax is correct?',['An employee who does not pay tax does not contribute to the community','Paying tax is voluntary, but most people choose to do it','It is the Tax Administration\'s responsibility to have correct information about you'],0,'Tax funds the community, so someone who does not pay tax does not contribute.'],
 ['Which industries were the most important in Norway 150 years ago?',['Agriculture, forestry and fishing','Transport and road work','Health care, schools and kindergartens'],0,'150 years ago, agriculture, forestry and fishing were the most important industries in Norway.'],
 ['How many people work in agriculture in Norway today?',['Under 3%','About 15%','About 30%'],0,'Today, under 3% work in agriculture.'],
 ['Which statement about Norwegian working life then and now is correct?',['Many Norwegians moved to America during the first half of the 1900s','At the end of the 1500s factories were built, and many moved to the cities','Less food is produced in Norway now than before'],0,'During the first half of the 1900s, many Norwegians went to the USA and settled there.'],
 ['Why is there a focus on the transition to "green" jobs in Norway?',['Because of the climate challenges','Because there are too many jobs in service occupations','Because agriculture has become the largest industry again'],0,'The climate challenges are why there is a focus on green jobs.'],
 ['What is a job application?',['A letter to the employer where you tell a bit about yourself and your background','A letter to the employee describing the job and the pay level','A letter to the municipality saying that you have got a job'],0,'In a job application you tell the employer about yourself and your background.'],
 ['Who can ask questions at a job interview?',['Both the job seeker and the employer','Only the employer, to find out who the job seeker is','Only the job seeker, to find out more about the workplace'],0,'At a job interview, both the employer and the job seeker can ask questions.'],
 ['Which statement about job seeking in Norway is correct?',['It is common to go to one or more job interviews before you are hired','There is not much competition for jobs in Norway','In Norway the employer only looks at what education you have'],0,'It is common to attend one or more interviews before getting a job.'],
 ['What does an employer look for, among other things, when hiring a new employee?',['Education, experience and manner','Only what education the applicant has','That the application is written in the mother tongue of the applicant'],0,'Employers look at education, experience and manner, among other things.'],
 ['Which statement about applying for jobs is correct?',['It is important that your CV and application are written in correct Norwegian','There is high unemployment in Norway','It does not matter what clothes you wear to a job interview'],0,'Your CV and application should be written in correct Norwegian.'],
 ['What is a reference?',['When former bosses or colleagues tell how the job seeker has performed at work','When friends tell what kind of person you are and what you like to do in your free time','When your family tells what you are good at'],0,'A reference is a former boss or colleague who tells how you have performed at work.'],
 ['What is a network?',['All the people we know, meet and are in contact with','All the people in our neighbourhood and their family and friends','All the people in the city we live in'],0,'Our network is all the people we know, meet and are in contact with.'],
 ['Which websites is it common to visit if you are looking for a job?',['nav.no and finn.no','finn.no and regjeringen.no','stortinget.no and nav.no'],0,'Job vacancies can be found on nav.no and finn.no, among others.'],
 ['What is ethical awareness?',['Balancing different considerations so that you can make better decisions and assess choices','Always agreeing with the majority','Disagreeing with what you read'],0,'Ethical awareness means balancing different considerations to make better decisions.'],
 ['Which statement about critical thinking is correct?',['For new knowledge to develop, you must question and discuss what is established','Only authorised persons can post information on the internet','In Norway the goal is for everyone to agree'],0,'New knowledge develops when we question and discuss what is established.'],
 ['What are you not allowed to write on the internet?',['Racist and discriminatory statements','Negative reviews of Norwegian society and the royal family','Statements critical of religion and criticism of public figures'],0,'Racist and discriminatory statements are not allowed, including on the internet.'],
 ['Which statement about social media and the internet is correct?',['Private pictures can be stolen by people who misuse them','The digital traces we leave behind are not stored','Freedom of expression in Norway is absolute and has no limits'],0,'Pictures you share can be stolen and misused by others.'],
],
m2:[
 ['Who can you contact if you or someone in your family becomes ill or injured when your GP’s office is closed?',['Legevakt','Sametinget','NAV'],0,'If you become ill or injured when the GP’s office is closed, contact legevakt on 116 117; if someone is seriously ill or injured and needs immediate help, call 113.'],
 ['What is a "fastlege"?',['A hospital','Your assigned regular GP','An ambulance service'],1,'Everyone registered in Norway is assigned a fastlege.'],

 ['Is physical punishment of children by parents legal in Norway?',['Yes','No, it is illegal','Only mild forms'],1,'All physical punishment of children is illegal, including by parents.'],
 ['A "helsestasjon" mainly provides…',['Free check-ups and vaccinations for babies and children','Legal advice','Job placement'],0,'Helsestasjon offers free preventive child health services.'],
 ['Forced marriage in Norway is…',['Accepted if both families agree','Illegal, regardless of culture or religion','Only illegal for minors'],1,'Forced marriage is a criminal offence in Norway for people of any age.'],

 ['Good personal economy habits include…',['Avoiding budgeting entirely','Making a budget and avoiding unnecessary consumer debt','Never using a bank account'],1,'Budgeting and avoiding debt are core to sound personal finances.'],

 ['Migration-related stress is…',['Not recognised in Norway','A recognised challenge, with support available through health services','Only treated privately'],1,'It’s a recognised issue addressed through the public health system.'],

 ['In a borettslag (housing cooperative), what do residents own?',['A share in the cooperative, giving the right to live there','Nothing — they only rent','The whole building outright'],0,'Borettslag members own a share and pay monthly felleskostnader, rather than owning the flat outright.'],
 ['After how many years of residence can you normally apply for Norwegian citizenship?',['Two to three years','Six to eight years','Fifteen years'],1,'Most people can apply for citizenship after six to eight years of legal residence.'],
 ['Who handles residence permit applications and guidance in Norway?',['NAV','UDI','Barnevernet'],1,'UDI (the Directorate of Immigration) processes residence permit applications.'],
 ['How long does introduksjonsprogrammet typically last?',['Always exactly one year','Between three months and three years, depending on background','A fixed five years for everyone'],1,'Its length varies from three months to three years depending on the participant’s background.'],
 ['Parents in the introduction programme with children under 18 must also…',['Pay extra tax','Complete mandatory parent guidance (foreldreveiledning)','Give up introduksjonsstøtte'],1,'Foreldreveiledning is a mandatory part of the programme for parents with children under 18.'],
 ['Roughly what share of couples in Norway live together without being married (samboer)?',['About 10 per cent','About 30 per cent','About 60 per cent'],1,'About 30 per cent of couples cohabit as samboer, and about 70 per cent are married.'],
 ['For children born from 1 January 2020, who has joint parental responsibility?',['Only married parents','Both parents, whether married, cohabiting or living apart','Only the mother, unless a court rules otherwise'],1,'Since 2020 both parents share parental responsibility regardless of their relationship status.'],
 ['From what age must a child’s opinion be given significant weight in decisions about them?',['Age 7','Age 12','Age 16'],1,'From age 12, a child’s opinion carries significant weight under barneloven.'],
 ['From age 15, a young person in Norway can decide for themselves about…',['Whether to pay tax','Their own education and organisation membership','Their parents’ divorce'],1,'From age 15, young people can decide their own education and whether to join or leave organisations.'],

 ['What is the emergency helpline number for children and young people in Norway?',['112','113','116 111'],2,'116 111 is the dedicated helpline for children and young people, including evenings and nights.'],
 ['What number do you call for urgent but non-emergency care when your GP is closed?',['110','113','116 117'],2,'116 117 connects you to the legevakt (accident and emergency clinic) for urgent, non-life-threatening care.'],
 ['What is a "frikort" in the Norwegian health system?',['A discount card for public transport','An exemption card that makes further healthcare free once you reach the yearly payment threshold','A dental insurance card'],1,'Once your patient charges reach the annual cap, you receive a frikort and further public healthcare is free that year.'],
 ['Up to what age are public dental check-ups free in Norway?',['16','19','25'],1,'Public dental check-ups are free for children and young people up to age 19.'],
 ['From age 19, young adults pay what share of the cost of public dental treatment?',['0 per cent','25 per cent','100 per cent'],1,'Young adults pay 25 per cent, with the state covering the remaining 75 per cent.'],

 ['Which contraceptive method also protects against sexually transmitted infections?',['The pill','The coil','The condom'],2,'The condom is the only common contraceptive that also protects against STIs.'],
 ['The "three phases" model of moving to a new country describes an initial excitement phase, then…',['Immediate full adaptation','A harder phase of insecurity and homesickness, followed by adaptation','A phase of no change at all'],1,'After the initial optimism, people often go through a harder phase before adapting.'],

 ['What is "dugnad"?',['A paid job','Unpaid voluntary community work','A type of tax'],1,'Dugnad is unpaid voluntary work done together for the community, such as spring cleaning.'],
 ['In 2004, "dugnad" was voted…',['Norway’s national word','Norway’s national dish','Norway’s national anthem'],0,'Dugnad was chosen as Norway’s national word in 2004.'],

 ['Aggravated female genital mutilation can carry a prison sentence of up to…',['1 year','6 years','15 years'],2,'Aggravated cases of FGM carry sentences of up to 15 years.'],

 ['How old must you be to marry in Norway?',['16','18','20'],1,'The marriage age is 18, with no exceptions since 2018.'],
 ['How old must you be to buy spirits (22 per cent alcohol or more)?',['18','20','21'],1,'The age limit is 18 for beer and wine and 20 for spirits.'],
 ['From what age can you be punished for a crime in Norway?',['15','16','18'],0,'The age of criminal responsibility is 15.'],
 ['What is a særbo?',['A couple who live in separate homes','A divorced couple','A married couple with separate property'],0,'Særboere are in a relationship but each lives in their own home.'],
 ['Do both spouses have to agree to get a divorce?',['Yes, always','No, one spouse can ask for separation and then divorce','Only if they have children'],1,'One spouse alone can ask for separation, and after one year for divorce.'],

 ['How many weeks of parental benefit are parents who both work together entitled to in connection with a birth?',['26 weeks','46 weeks','61 weeks'],2,'Parents who are both in paid work are together entitled to up to 61 weeks of parental benefit in connection with a birth.'],

 ['On average, how old are Norwegian women when they have their first child?',['19','25','30'],2,'Norwegian women are on average around 30 when they have their first child.'],

 ['Which statement is true?',['It is common to borrow money from the bank to buy a home and a car.','Few students in Norway have a job alongside their studies.','Parents only get child benefit for children aged 0 to 10.'],0,'Many people in Norway take out bank loans to buy a home and a car.'],
 ['How is compulsory school (grunnskolen) in Norway divided?',['Into primary level (grades 1–7) and lower secondary level (grades 8–10)','Into primary level (grades 1–5) and lower secondary level (grades 6–10)','Into primary level (grades 1–7) and lower secondary level (grades 8–12)'],0,'Grunnskolen has a primary level from grade 1 to 7 and a lower secondary level from grade 8 to 10.'],
 ['What does the word \'innvandrer\' (immigrant) mean?',['Someone who was born outside Norway but lives in Norway.','Someone who has two parents born outside Norway.','Someone who has one parent born outside Norway.'],0,'An immigrant is a person born abroad who has moved to Norway.'],
 ['Can citizens of EU/EEA countries work in Norway without applying for a residence permit?',['No, everyone must apply for a residence permit to work in Norway.','Yes, but they must register with the police.','Only if they are from Scandinavia.'],1,'EU/EEA citizens do not need a residence permit, but they must register with the police.'],
 ['What can family members of people with a residence permit in Norway apply for?',['family support','family reunification','family insurance'],1,'Family members can apply for family reunification to live with their family in Norway.'],

 ['Roughly how many of those who marry today will probably divorce later?',['about 10 percent','about 40 percent','about 75 percent'],1,'About 4 in 10 of those who marry today will probably divorce later.'],
 ['Roughly how many couples marry in Norway each year?',['about 2,000','about 20,000','about 200,000'],1,'About 20,000 couples marry in Norway each year.'],
 ['Who is the Children Act about?',['children and young people under 16','children and young people under 15','children and young people under 18'],2,'The Children Act applies to children and young people under 18.'],
 ['Who is responsible for making sure that children attend compulsory school?',['the parents','the school','the children'],0,'The parents are responsible for making sure the children go to school.'],

 ['In the past, children were seen as \'little adults\'. What did children have to do before that they do not have to do now?',['Organise weddings and baptisms.','Work to contribute money to the family.','Pay bills.'],1,'In the past, many children had to work to earn money for the family.'],
 ['Having children is a great joy, and most parents feel ...',['that it is easy to raise a child.','that raising children can be difficult at times.','that raising children is only the school\'s responsibility.'],1,'Most parents find that raising children can be difficult at times.'],
 ['What can you do if you find it difficult to be a parent?',['Seek advice from someone who knows a lot about it.','Hope it will soon pass.','Keep it secret from everyone.'],0,'You can seek advice from professionals, read books or talk to other parents.'],
 ['Which statement about childhood and upbringing is true?',['Today childhood is a time for play and learning, and children are not expected to meet demands in the same way as before.','Children always do what their parents say.','Child-rearing changes little across different cultures.'],0,'Today we see childhood as a time for play and learning.'],
 ['Who and what do children learn from?',['the family','the family and the society around them','the society around them'],1,'Children learn both from their family and from the society around them.'],
 ['To make cultural differences easier to understand, we can divide cultures into two main groups. What do we call the two groups?',['solidarity cultures and single-person cultures','can-cultures and will-cultures','I-cultures and we-cultures'],2,'We often divide cultures into I-cultures and we-cultures.'],
 ['What characterises we-cultures?',['they are society-oriented','they are group-oriented','they are individual-oriented'],1,'In a we-culture, the group matters most.'],
 ['Which statement about cultures is true?',['In we-cultures, respect is important.','I-cultures are group-oriented cultures.','Most cultures have the same attitudes, values and opinions.'],0,'Respect is an important value in we-cultures.'],
 ['What are typical tasks at a dugnad (voluntary work day) in a kindergarten?',['Making timetables for the staff and paying bills.','Washing toys and fixing up outdoor areas.','Taking the children to a museum.'],1,'At a kindergarten dugnad, parents often wash toys and fix up the outdoor area.'],
 ['Who usually organises a dugnad?',['housing cooperatives','companies','banks'],0,'Housing cooperatives, sports clubs and children\'s leisure activities often organise dugnad.'],
 ['Is dugnad unique to Norway?',['Yes, dugnad was invented in Norway, and only Norway has dugnad.','No, many farming societies have a similar tradition.','No, but only Scandinavian countries have dugnad.'],1,'Many farming societies around the world have traditions similar to dugnad.'],
 ['Which statement about dugnad is true?',['Many children\'s leisure activities are run by parents through dugnad.','You get an hourly wage for taking part in a dugnad.','Dugnad is common in companies and paid workplaces.'],0,'Parents do a lot of unpaid dugnad work in children\'s leisure activities.'],
 ['What are social arenas?',['Places where people meet to be together.','For example Twitter, Facebook and Instagram.','Places people go to be alone.'],0,'A social arena is a place where people meet and spend time together.'],
 ['What is voluntary work?',['Work that is poorly paid.','Work you do not get paid for.','Work you get paid for without paying tax.'],1,'Voluntary work is work you do without being paid.'],
 ['What is a common way to greet someone you meet for the first time in Norway?',['to kiss on the cheek','to shake hands','to avoid physical contact'],1,'In Norway it is common to shake hands when meeting someone for the first time.'],
 ['What can be an advantage of doing voluntary work?',['You get to know new people.','You can get paid.','You can work full time as a volunteer.'],0,'As a volunteer you get to know new people and can feel you belong in the local community.'],
 ['Which statement is true?',['An unwritten rule is a rule that everyone knows but that is not written down.','Norwegians often visit friends without arranging it in advance.','Few people in Scandinavia do voluntary work.'],0,'Unwritten rules are rules everyone knows even though they are not written down anywhere.'],
 ['What is true about children\'s leisure time in Norway?',['Many children take part in organised leisure activities.','Very few children in Norway have organised leisure activities.','Organised leisure activities are only for adults.'],0,'Many Norwegian children take part in organised leisure activities, such as sports and music.'],
 ['It is important that the citizens in a democracy ...',['agree with each other.','are active and keep up with what is happening.','stay out of politics in the country they live in.'],1,'A democracy works best when citizens are active and keep themselves informed.'],
 ['Young Norwegians are ...',['as politically active as before.','less politically active than before.','more politically active than before.'],2,'Young Norwegians are more politically active than before; turnout among the youngest voters has risen.'],
 ['What is an example of informal political participation?',['promoting issues in a political party','petitions (signature campaigns)','taking part in an election campaign'],1,'Petitions, demonstrations and discussions on social media are informal political participation.'],
 ['What do you usually learn about through membership in political organisations?',['elections','physical activity','Norwegian art'],0,'Through political organisations you learn about elections, debates and votes.'],
 ['What is the standard of living in Norway today?',['low','high','average'],1,'Norway has a high standard of living today.'],
 ['We have a better chance of staying healthy longer if we ...',['eat often and relax when we can.','eat healthily and are physically active.','eat rarely and are physically active.'],1,'A healthy diet and physical activity give better health.'],
 ['What is true about physical and mental health?',['Physical health is more important than mental health because we live longer if our physical health is good.','Physical health and mental health are equally important.','Mental health is most important because it is about how we feel.'],1,'Physical and mental health are equally important for us.'],
 ['Which statement about health is true?',['Smoking increases the risk of cancer and cardiovascular disease.','Tuberculosis is among the most common causes of death in Norway today.','Children are offered vaccines, but they cost money.'],0,'Smoking increases the risk of cancer and cardiovascular disease.'],
 ['How has public health in Norway developed over the last 100 years?',['It has become much better.','It has become worse.','It has not changed.'],0,'Public health in Norway has become much better over the last 100 years.'],
 ['What are the most common causes of death in Norway?',['cancer and cardiovascular disease','tuberculosis and other infections','traffic accidents'],0,'Cancer and cardiovascular disease are the most common causes of death in Norway.'],
 ['What does outpatient treatment (poliklinisk behandling) mean?',['That you are treated at a hospital but are not admitted there.','That you are admitted to hospital for several weeks.','That your GP treats you at home.'],0,'Outpatient treatment means treatment at a hospital without being admitted.'],
 ['Which statement about health services is true?',['Interpreters have a duty of confidentiality.','There are no private health services in Norway.','Mild painkillers can only be bought at a pharmacy.'],0,'Interpreters have a duty of confidentiality, just like health personnel.'],
 ['A child is in hospital. What is common in Norway?',['That one of the parents stays at the hospital with the child.','That the parents are not allowed to visit the child.','That the child must be alone at the hospital at night.'],0,'It is common for one of the parents to stay at the hospital with the child.'],
 ['How often should you brush your teeth?',['twice a day, morning and evening','after every meal','before breakfast, lunch and dinner'],0,'You should brush your teeth morning and evening.'],
 ['Which statement about dental health is true?',['Parents must pay a co-payment if their child needs orthodontic treatment (braces).','It is common to go to the dentist for a check-up once a month.','Baby teeth do not last a lifetime, so healthy baby teeth are not that important.'],0,'Orthodontic treatment for children is not completely free; parents pay a co-payment.'],
 ['On average, how many children do Norwegian women give birth to?',['1 child','1.4 children','3 children'],1,'Norwegian women give birth to about 1.4 children on average.'],
 ['What does family planning mean?',['That you can plan when you want children and how many children you will have.','That you can plan who cooks dinner and who tidies up.','That you can plan where the family will live.'],0,'Family planning is about when and how many children you want, and about avoiding unwanted pregnancy.'],
 ['How many times is it recommended to go for a prenatal check-up during pregnancy?',['2–4 times','8–12 times','20–25 times'],1,'Between 8 and 12 prenatal check-ups are recommended during pregnancy.'],
 ['Which statement about contraception is true?',['An IUD (coil) is inserted into the woman\'s uterus by a doctor.','Birth control pills are a small plastic rod placed under the skin.','Condoms do not protect against sexually transmitted diseases.'],0,'The IUD is inserted into the uterus by a doctor.'],
 ['What is true about vaccines for children in Norway?',['It is voluntary, but strongly recommended.','It is compulsory for all children.','It is voluntary, and the health service does not recommend it.'],0,'The vaccines are free and voluntary, but it is strongly recommended to take them.'],
 ['Are prenatal check-ups compulsory in Norway?',['Yes, for all pregnant women','No, but they are recommended','Only for the first child'],1,'Prenatal check-ups are not compulsory, but they are recommended.'],
 ['Who can children talk to in the school health service if they are wondering about something?',['the public health nurse','the head teacher','the dentist'],0,'The public health nurse in the school health service is there for pupils who are wondering about something.'],
 ['What do most people in Norway think about mental illness?',['That people with mental illness must get treatment and help on an equal footing with the physically ill.','That people with mental illness should not get help until everyone who is physically ill has been helped.','That mental illness is a private matter you should not get help for.'],0,'Most people think that the mentally ill should get help on an equal footing with the physically ill.'],
 ['Who gets mental health problems?',['Anyone can get mental health problems, and there are many causes.','Only people between 18 and 30, because they are genetically predisposed.','Only people who are stressed, because they are going through something difficult.'],0,'Anyone can get mental health problems, and there can be many causes.'],
 ['What can your GP do if you need someone to talk to?',['Ask their friends what you should do.','Refer you to a psychologist.','Tell you to fix your problems yourself.'],1,'Your GP can refer you to a psychologist.'],
 ['How can poor mental health affect us?',['It can affect us physically, for example with sleep problems or stomach ache.','It only affects our mood and how we see life.','It does not affect us at all.'],0,'Poor mental health can also cause physical problems, such as sleep problems and stomach ache.'],
 ['Which statement about mental health problems is true?',['Stress can be a triggering factor for mental health problems.','Only people who are genetically predisposed can get mental health problems.','It is not possible to recover from mental illness.'],0,'Stress can trigger mental health problems.'],
 ['Our identity is shaped by our qualities and ...',['self-image.','personality traits.','our social circle.'],1,'Our identity is shaped by our qualities and personality traits.'],
 ['Who you fall in love with and are sexually attracted to says something about your ...',['gender identity.','sexual identity.','relational identity.'],1,'Who you fall in love with is about sexual identity.'],
 ['The way you dress or otherwise emphasise gender is called ...',['gender expression.','gender role pattern.','gender identity.'],0,'The way you show gender, for example through clothes, is called gender expression.'],
 ['What may have reinforced our physiological sex?',['The absence of gender role patterns.','Clear gender role patterns.','Unclear gender role patterns.'],1,'Clear gender role patterns have reinforced physiological sex.'],
 ['Which statement about gender and identity is true?',['Today there is more openness to the fact that not everyone identifies with the sex they were born with.','Everyone in Norway defines themselves as heterosexual.','Gender role patterns have had no influence on how we perceive gender.'],0,'There is now more openness about the fact that not everyone identifies with the sex they were born with.'],
 ['How long do the different phases of the psychological migration process last?',['Phase one lasts one to two months, phase two 1–2 years and phase three for life.','It differs from person to person.','Phase one lasts one month, phase two two months and phase three three months.'],1,'How long the phases last varies from person to person.'],
 ['Which statement about moving to a new country is true?',['It is common to feel that moving to a new country is difficult.','Most people find moving to a new country completely unproblematic.','Everyone who moves to a new country goes through the three phases in the same way.'],0,'Many people find it difficult to move to a new country, and that is completely normal.'],
 ['What is income?',['Money that comes into your account.','Money that goes out of your account.','Money we have saved up and put in the bank.'],0,'Income is money you receive, for example wages.'],
 ['What is a budget?',['What you pay off on a loan.','A document that shows income and expenses for a certain period.','The price of borrowing money from the bank.'],1,'A budget shows income and expenses for a period.'],
 ['Which statement about the economy in Norway is true?',['In most Norwegian families both parents have paid work outside the home.','It is cheap to live in Norway.','It is not common to use online banking in Norway.'],0,'In most families both parents have paid work.'],
 ['What do you pay the bank when you borrow money?',['both instalments and interest','only interest','only instalments'],0,'When you have a loan, you pay both instalments (repayment) and interest.'],
 ['What is interest?',['the price of borrowing money','money you have saved up yourself','wages before tax'],0,'Interest is the price of borrowing money, calculated as a percentage of the debt.'],
 ['What do you need to log in to online banking?',['BankID or a code device','only your passport','your tax card'],0,'To log in to online banking you use BankID or a code device.'],
 ['How many homes are there in Norway?',['fewer than two million','more than two and a half million','more than three and a half million'],1,'There are more than two and a half million homes in Norway.'],
 ['How much of the purchase price must we have ourselves when buying a home, and how much can we borrow from the bank?',['We must have saved 10 percent and can borrow 90 percent from the bank.','We must have saved 50 percent and can borrow 50 percent from the bank.','We must have saved 90 percent and can borrow 10 percent from the bank.'],0,'The main rule is that you need 10 percent equity and can borrow 90 percent.'],
 ['What characterises a privately owned home (selveierbolig)?',['You can renovate and rent it out without asking anyone.','You own a share in the housing cooperative.','You pay rent every month.'],0,'In a privately owned home you decide yourself and pay all the costs of the home.'],
 ['What is equity (egenkapital)?',['money we have saved up ourselves','money we borrow from the bank','interest we pay to the bank'],0,'Equity is money you have saved up yourself.'],
 ['What is true about violence?',['Violence can be physical, psychological, sexual and material.','Violence is only physical.','Only physical and sexual violence count as violence.'],0,'Violence can be physical, psychological, sexual and material.'],
 ['Violence in close relationships ...',['is a private matter.','is not a private matter.','is legal under certain circumstances.'],1,'Society does not accept violence, not even in the family, and it is not a private matter.'],
 ['What is true about children and violence?',['It is at least as harmful for children to witness violence as to be exposed to violence themselves.','It is only harmful for children if they are hit themselves.','Children are not affected by violence between adults.'],0,'Witnessing violence is at least as harmful for children as being exposed to it themselves.'],
 ['What kind of marriage is characterised by the family playing an important role in finding a spouse for their children?',['forced marriage','love marriage','arranged marriage'],2,'In an arranged marriage the parents or family play an important role in finding a spouse for their children, and the children accept their parents’ choice.'],
 ['What is a love marriage?',['When two people find each other and decide to get married.','When parents and family find a spouse for their children.','When someone is forced to marry.'],0,'In a love marriage two people find each other and decide themselves to marry.'],
 ['What is true about marriage in Norway?',['Women and men have the same right to choose their spouse freely.','You can marry again even if you are already married.','You do not need legal residence in Norway to marry here.'],0,'Both women and men have the right to choose their spouse freely.'],
 ['What is female genital mutilation?',['Procedures that damage or remove the external genitals without it being medically necessary.','Procedures that damage or remove the external genitals when it is medically necessary.','A normal health check-up at the gynaecologist.'],0,'Genital mutilation is a procedure on the external genitals without a medical reason.'],
 ['What is the penalty for breaking the duty to prevent (the duty to try to stop genital mutilation)?',['one year','two years','three years'],0,'Breaking the duty to prevent can be punished with up to one year in prison.'],
 ['If the girl or woman agrees to genital mutilation, it is ...',['still forbidden.','not punishable.','legal.'],0,'Genital mutilation is forbidden even if the girl or woman herself consents.'],
 ['What is true about female genital mutilation?',['It is forbidden to restore or renew a previous genital mutilation.','Genital mutilation is allowed in Norway in some cases.','It is legal to take a girl out of Norway to have her genitals cut abroad.'],0,'Restoring or renewing a previous genital mutilation is also forbidden.'],
 ['What is social control?',['The limits on behaviour and way of life that are set around each individual.','A financial support scheme you can apply for at NAV.','Rules and laws everyone in Norway must follow.'],0,'Social control is the limits on behaviour and way of life set around each individual.'],
 ['What is negative social control?',['When someone feels that the rules set by their closest family are too loose.','When someone feels that the rules set by their closest family are too strict.','When someone feels that the rules set by their closest family are too mean.'],1,'Social control becomes negative when the rules are felt to be too strict and unreasonable.'],
 ['Negative social control can ...',['help children and young people become integrated in Norwegian society.','have no effect on whether children and young people become integrated in Norwegian society.','prevent children and young people from becoming integrated in Norwegian society.'],2,'Negative social control can make it harder for children and young people to become integrated.'],
 ['Which statement about social control is true?',['The limits parents set can clash with the limits set by society.','It is easier to become integrated in Norway if you are exposed to negative social control.','Negative social control gives the individual more freedom.'],0,'The limits set by parents and by society can sometimes conflict.'],
],
m3:[
 ['Norway’s constitution was signed in 1814 at…',['Eidsvoll','Bergen','Trondheim'],0,'The constitution was signed at Eidsvoll on 17 May 1814.'],
 ['Norway’s national day, 17 May, celebrates…',['Independence from Denmark in 1905','The signing of the Constitution in 1814','The end of WWII'],1,'17 May is Grunnlovsdag, marking the 1814 constitution.'],
 ['How is Norway’s national day traditionally celebrated?',['With military parades','With children’s parades (barnetog) and celebrations','As a day of silence'],1,'Barnetog (children’s parades) are the defining tradition of 17 May.'],
 ['The union between Norway and Sweden ended in…',['1814','1905, peacefully','1945'],1,'The union dissolved peacefully in 1905.'],
 ['Who became Norway’s king after the union ended in 1905?',['Haakon VII','Harald V','Olav V'],0,'Haakon VII was chosen as Norway’s king in 1905.'],
 ['Norway was occupied by Germany during…',['World War I (1914–1918)','World War II (1940–1945)','The Cold War'],1,'Nazi Germany occupied Norway from 1940 to 1945.'],
 ['Norway’s oil wealth is largely saved in…',['The Government Pension Fund Global ("Oljefondet")','Private bank accounts','Gold reserves only'],0,'Oil revenues are invested abroad through the sovereign wealth fund.'],
 ['Is Norway a member of the European Union?',['Yes, a full member','No, but it is part of the EEA and Schengen','No, and it has no ties to the EU'],1,'Norway is outside the EU but linked via the EEA agreement and Schengen.'],
 ['Norway’s parliament is called…',['Sametinget','Stortinget','Kommunestyret'],1,'Stortinget is the national parliament.'],
 ['How many representatives does the Storting have, and how often are they elected?',['169, elected every 4 years','100, elected every 2 years','300, elected every 6 years'],0,'Stortinget has 169 members, elected every four years.'],
 ['Who is Norway’s head of state as of late 2026?',['King Harald V','King Haakon VIII','Queen Sonja'],1,'King Harald V died in August 2026; his son Haakon became King Haakon VIII.'],
 ['Who is Norway’s Prime Minister following the September 2025 election?',['Erna Solberg','Jonas Gahr Støre','Jens Stoltenberg'],1,'Jonas Gahr Støre’s Labour-led government continued after the 2025 election.'],
 ['The Sámi people are…',['Recent immigrants to Norway','An indigenous people with their own parliament, Sametinget','A religious minority only'],1,'The Sámi are indigenous to northern Scandinavia, with their own parliament.'],
 ['Where is Sametinget (the Sami Parliament) located?',['Oslo','Karasjok','Bergen'],1,'Sametinget is based in Karasjok, in northern Norway.'],
 ['"Allemannsretten" gives everyone the right to…',['Free healthcare','Roam and access uncultivated nature, within certain rules','Vote from age 16'],1,'Allemannsretten is the right to roam in nature.'],
 ['Women in Norway have had the right to vote since…',['1913','1945','1972'],0,'Universal women’s suffrage was introduced in Norway in 1913.'],
 ['Norway’s constitution protects…',['Only the rights of Norwegian-born citizens','Fundamental rights such as freedom of expression for everyone','Only religious freedom'],1,'Constitutional rights like ytringsfrihet apply broadly, not only to citizens.'],
 ['The Church of Norway was formally separated from the state in…',['1814','1905','2012'],2,'The formal disestablishment took place in 2012.'],
 ['Norway today is best described, religiously, as…',['A country with one mandatory state religion','A secular state guaranteeing freedom of religion, with growing diversity','A country where only Christianity is legally allowed'],1,'Norway guarantees freedom of religion and is increasingly diverse and secular.'],
 ['The "fedrekvote" (father’s quota) relates to…',['Tax deductions for fathers','Parental leave reserved for the father','A men’s voting bonus'],1,'Fedrekvote reserves part of paid parental leave specifically for fathers.'],
 ['What is Norway’s approximate population as of the mid-2020s?',['5.6 million','3.9 million','10 million'],0,'Norway’s population passed 5.6 million by 2025.'],
 ['How many municipalities (kommuner) does Norway have (as of 2025)?',['15','100','357'],2,'Norway has 357 municipalities and 15 counties.'],
 ['How many days after Easter is Ascension Day (Kristi himmelfartsdag)?',['10','40','100'],1,'Ascension Day falls on a Thursday 40 days after Easter.'],
 ['Since which year has International Women’s Day been marked in Norway?',['1913','1972','2005'],1,'It has been celebrated in Norway every year since 1972.'],
 ['What was the Norwegian policy from around the 1850s that restricted Sámi language and land rights called?',['Fornorsking (Norwegianisation)','Grunnloven','Fedrekvote'],0,'Fornorsking aimed to assimilate the Sámi into Norwegian language and culture.'],
 ['When did Sametinget, the Sámi Parliament, open?',['1905','1965','1989'],2,'Sametinget opened in 1989 to safeguard Sámi rights.'],
 ['Besides the Sámi, which of these is an officially recognised national minority in Norway?',['Kvens','Poles','Syrians'],0,'Kvens are one of Norway’s six recognised national minorities.'],
 ['Roughly how many Norwegians emigrated to America between 1820 and 1930?',['80,000','800,000','8 million'],1,'More than 800,000 Norwegians emigrated to America in that period.'],
 ['Around what year did Harald Fairhair become the first king of a united Norway?',['872','1030','1397'],0,'Harald Fairhair (Hårfagre) united Norway under one king around 872.'],
 ['What decisive battle in 1030 helped Christianity replace the old Norse religion?',['The Battle of Stiklestad','The Battle of Hafrsfjord','The Battle of Svolder'],0,'Olav Haraldsson was killed at Stiklestad but Christianity spread afterward.'],
 ['What was the Black Death, which killed roughly a third of Norway’s population?',['A plague pandemic in the mid-1300s','A war with Sweden','A famine in the 1700s'],0,'The Black Death was a plague pandemic that reached Norway in the mid-14th century.'],
 ['Norway was in a political union with which country from 1397 to 1814?',['Denmark','Sweden','Russia'],0,'Norway was united with Denmark (and briefly Sweden) from 1397 until 1814.'],
 ['Who created Nynorsk by collecting Norwegian dialect samples in the 19th century?',['Ivar Aasen','Henrik Ibsen','Edvard Grieg'],0,'Linguist Ivar Aasen built Nynorsk from Norwegian dialects.'],
 ['In what year was the standard working day reduced to eight hours in Norway?',['1898','1919','1945'],1,'The eight-hour working day was introduced in 1919.'],
 ['Roughly how many Norwegians emigrated to America between 1850 and 1920?',['80,000','800,000','8,000,000'],1,'Around 800,000 Norwegians emigrated to America in that period.'],
 ['Since June 2025, a woman in Norway can decide on an abortion herself up to the end of which week of pregnancy?',['12','18','24'],1,'The 1976 Abortion Act gave the right to self-determined abortion (up to week 12); the 2025 abortion law gives the right to abortion before week 19. After that, an abortion committee decides.'],
 ['Was Norway a participant in World War I?',['No, it remained neutral','Yes, allied with Germany','Yes, allied with Britain'],0,'Norway stayed neutral during World War I, though it still felt economic effects.'],
 ['On what date did Germany invade Norway?',['9 April 1940','1 September 1939','8 May 1945'],0,'Germany invaded Norway on 9 April 1940.'],
 ['Whose name became synonymous with "traitor/collaborator" after he led Norway’s pro-German wartime government?',['Vidkun Quisling','Haakon VII','Ivar Aasen'],0,'Vidkun Quisling headed the non-elected pro-German regime during the occupation.'],
 ['Of the roughly 2,100 Jews in Norway before WWII, how many survived deportation to concentration camps?',['All of them','773','38'],2,'773 were deported; only 38 survived and returned to Norway.'],
 ['Which three international organisations does Norway belong to, according to its official civic curriculum?',['UN, NATO and the EEA','The EU, NATO and the UN','The EU only'],0,'Norway is a member of the UN and NATO and takes part in the EU single market via the EEA, but is not an EU member.'],
 ['Which level of government in Norway is responsible for kindergartens and primary schools?',['The central government','The county','The municipality'],2,'Municipalities run kindergartens and primary/lower-secondary schools.'],
 ['What are the three separated branches of power in Norwegian democracy?',['Legislative, executive and judicial','Royal, religious and military','Local, regional and national'],0,'Power is split between the law-making Storting, the executing government, and independent courts.'],
 ['How often are elections held in Norway (alternating between parliamentary and local)?',['Every year','Every two years','Every five years'],1,'Norway holds an election every two years, alternating parliamentary and local elections.'],
 ['Roughly how many political parties compete in Norwegian elections?',['About five','About twenty','About a hundred'],1,'Around twenty parties typically compete, from socialist to conservative.'],
 ['In what year was the UN Universal Declaration of Human Rights adopted?',['1945','1948','1969'],1,'The UN adopted the Declaration in 1948.'],
 ['From what age can a person in Norway freely choose to join or leave a religious or life-stance community?',['12','15','18'],1,'From age 15, individuals can independently join or leave such communities.'],
 ['Which of these is described as a threat to democracy in Norway’s civic curriculum?',['High voter turnout','Misinformation and hateful speech','Strong independent courts'],1,'Misinformation and hateful speech are named as threats that limit open democratic debate.'],
 ['What is Section 185 of the Norwegian Penal Code sometimes called?',['The \'racism paragraph\'','The \'equality clause\'','The \'free speech article\''],0,'It bans discriminatory or hateful statements and is nicknamed the "racism paragraph".'],
 ['What form of energy production allows Norway to produce aluminium competitively?',['Hydropower','Coal power','Solar power'],0,'Cheap hydropower makes Norway’s aluminium industry competitive.'],
 ['Under allemannsretten, how far from a house or cabin must a tent be pitched?',['15 metres','150 metres','1,500 metres'],1,'Tents must be pitched at least 150 metres from houses or cabins.'],
 ['Between which dates is lighting a fire in or near a Norwegian forest banned?',['1 May – 1 September','15 April – 15 September','1 June – 31 August'],1,'Open fires in or near forest are banned from 15 April to 15 September.'],
 ['By what year do the UN Sustainable Development Goals aim to end poverty and stop climate change?',['2025','2030','2050'],1,'The SDGs target 2030 for their core goals.'],
 ['Which of these is a non-renewable resource?',['Wind','Oil','Sunshine'],1,'Oil does not regenerate the way wind, water and sunshine do.'],
 ['Roughly how many tonnes of edible food does Norway throw away each year?',['4,000','40,000','400,000'],2,'Norway discards around 400,000 tonnes of edible food annually.'],
 ['What milestone did Norway reach in 2024?',['For the first time there were more electric cars than petrol cars registered in Norway','All new cars became electric','Petrol cars were banned'],0,'In 2024, for the first time, there were more electric cars than petrol cars registered in Norway.'],
 ['How many men met at Eidsvoll in 1814 to write the Constitution?',['12','112','169'],1,'112 men gathered at Eidsvoll; 169 is the number of Storting representatives today.'],
 ['Who became Norway’s king in 1905?',['Haakon VII (Prince Carl of Denmark)','Olav V','Karl Johan'],0,'Danish Prince Carl was chosen and became Haakon VII, king until 1957.'],
 ['What is the longest fjord in Norway?',['Hardangerfjorden','Sognefjorden','Oslofjorden'],1,'Sognefjorden is 204 km long and up to 1,308 m deep.'],
 ['What is Norway’s largest lake?',['Mjøsa','Femunden','Tyrifjorden'],0,'Mjøsa is the largest of Norway’s roughly 450,000 lakes.'],
 ['Who has conscription (verneplikt) in Norway today?',['Only men','Both men and women','Only volunteers'],1,'Conscription covers Norwegian citizens of both sexes; women born in 1997 or later are included.'],
 ['What is marked on 8 May?',['Liberation Day, the end of the German occupation in 1945','Constitution Day','Sámi National Day'],0,'8 May is Liberation Day (frigjøringsdagen), a flag day.'],
 ['What is a coalition government?',['Several parties governing together','A government with no support in the Storting','A government appointed by the King alone'],0,'A koalisjonsregjering is formed by two or more parties.'],
