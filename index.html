    ['Elections and political parties','Norway holds elections every two years, alternating between parliamentary (Storting) elections and local elections for county and municipal councils, each for a four-year term. Around twenty political parties compete, placed on a scale from “socialist” (sosialistisk) to “non-socialist” (borgerlig), and each adopts a party programme (partiprogram) at its national congress (landsmøte) setting out what it wants to work on in the next four-year term. Voting age is 18; to vote in a Storting election you must be a Norwegian citizen, and to vote in county and municipal elections you must have lived in Norway for the last three years before the election. As with all Norwegian elections, voting is by secret ballot, so nobody is obliged to reveal which party they supported.'],
    ['Human rights — international framework','Human rights are universal — rights everyone holds simply by being human, regardless of where they live or what religion or ethnicity they belong to. The UN’s Universal Declaration of Human Rights was adopted in 1948 and has since been endorsed by all UN member states, with much of it written into Norwegian law. Among its core provisions: everyone is born free and equal in dignity and rights; everyone has the same rights regardless of gender, religion, race, political opinion or nationality; torture is prohibited in all forms; everyone is entitled to due process; and citizens have the right to vote in free elections by secret ballot.'],
    ['Democratic rights and duties','Democracy in Norway rests on rights paired with duties. Freedom of speech lets people discuss and publish opinions on politics and religion without punishment, but racist or hateful statements are against the law. From age 15, people can freely join or leave a religious or life-stance community. People can join political parties, unions and other associations, and hold lawful demonstrations, without fear of persecution; trade unions may also strike in certain circumstances. No one can be imprisoned without a trial before an independent judge, and every defendant has the right to a defence. In return, citizens are expected to follow democratically made laws and seek change through democratic means — Norwegian society runs substantially on mutual trust between citizens and authorities. Threats to this system include low election turnout, falling trust in politicians, fake news and hate speech that shut down open debate, major national crises that lead to democratic processes being bypassed, and rules shared by several countries taking precedence over a country’s democratically adopted laws. Democracy means ‘rule by the people’ (from Greek): the majority decides, but it should take the minority’s views into account. Freedom of expression applies both to private individuals and to radio, TV and newspapers.'],
    ['Equality and anti-discrimination law','Equality (likestilling) in Norway means the principle that everyone has the same worth regardless of gender, age, disability, cultural background, ethnicity or sexual orientation. Since the women’s rights push of the 1970s, women’s workforce participation has risen sharply, though gaps remain in leadership roles and study choices. Key laws protecting equality include the Equality and Anti-Discrimination Act, the Marriage Act and the Inheritance Act, plus Section 185 of the Penal Code — sometimes called the "racism paragraph" — which bans discriminatory or hateful statements based on ethnicity, skin colour, religion, sexual orientation, gender identity or disability.'],
    ['Nature and natural resources','Much of Norway’s wealth over the past century comes from natural resources: fish, forests, oil, hydropower from rivers and waterfalls, and increasingly wind power. Aluminium, produced using large amounts of cheap hydropower, is a major export, alongside fish and timber (processed into paper and building materials, or exported raw).'],
    ['Right to roam — the rules in detail','Allemannsretten lets everyone walk or ski freely across uncultivated land — beaches, forests, marshland and mountains — and rest anywhere along the way. Camping in the same spot for more than two nights needs the landowner’s permission, and a tent must be pitched at least 150 metres from houses or cabins. Users must avoid harming animals, damaging nature or leaving litter, and lighting fires in or near forest is banned from 15 April to 15 September (disposable barbecues are allowed with care). Picking berries, mushrooms and wild flowers is free; fishing and hunting are also allowed but usually require a licence.'],
    ['Sustainable development and the UN goals','The UN Sustainable Development Goals (SDGs, bærekraftsmålene) are a shared global plan aiming, by 2030, to end poverty, reduce inequality and stop climate change. Climate is the average weather measured over a long period, distinct from day-to-day weather, and the international scientific consensus is that human CO2 emissions — not natural variation — are the main driver of rising temperatures, melting ice, rising and more acidic oceans, and more extreme weather. Resources are either renewable — like animals, plants, wind, rain and sunshine, which regenerate if used sustainably — or non-renewable, like oil, gas and coal, which do not. Eating locally produced food cuts transport-related emissions and makes it easier to oversee how food is grown, including pesticide and antibiotic use and animal welfare.'],
    ['Recycling, waste and emissions','Nature conservation and environmental protection (naturvern) means limiting damage to ecosystems and repairing the harm people cause, so animals, plants and people keep good living conditions in future. Norwegians increasingly reuse items secondhand — clothing and furniture resale has grown fast — and recycle materials into new products, while municipal source-separation schemes sort household waste and dedicated recycling stations (gjenbruksstasjoner) take furniture, appliances and paint. Each Norwegian produces several hundred kilos of waste a year, and Norway throws out around 400,000 tonnes of edible food annually — part of a global one-third of all food produced that goes to waste. Norway’s main greenhouse gas sources are oil and gas production, industry, mining and road traffic, though in 2024, for the first time, there were more electric cars than petrol cars registered in Norway.'],
    ['Geography facts to memorise','Norway’s southernmost point is Lindesnes, and its northernmost point is Knivskjellodden near Nordkapp (the North Cape). The longest fjord is Sognefjorden, 204 km long and up to 1,308 m deep. There are about 450,000 lakes (the largest is Mjøsa) and around 20,000 rivers (the longest is Glomma, over 600 km); waterfalls are important for producing hydropower. The largest glacier is Jostedalsbreen, about 487 km², and Norway’s glaciers are melting a little more every year. The Gulf Stream brings warm water from the southern Atlantic up along the coast, so Norway is warmer than its latitude would suggest. Norway has four seasons, and temperatures have ranged from +35.6 °C (Nesbyen, 1970) to −51.4 °C (Karasjok, 1886). Winters in Northern Norway are long, cold and dark, with the midnight sun in summer; Western Norway gets more rain than Eastern Norway. After Oslo, the largest cities are Bergen, Trondheim and Stavanger.'],
    ['From 1814 to 1905 — the details','Denmark–Norway was on France’s side in the Napoleonic Wars, and when France lost, Denmark had to give Norway to Sweden in 1814. In spring 1814, 112 men met at Eidsvoll and wrote Norway’s Constitution, signed on 17 May. Norway was still forced into a union with Sweden in November 1814, but this union was looser than the one with Denmark: Norway kept its Constitution (with some changes), its own parliament, the Storting (founded in 1814), and internal self-government, while foreign policy was run from Sweden and the king was Swedish. King Karl Johan, after whom Oslo’s main street Karl Johans gate is named, was one of the kings during the union. On 7 June 1905 the Storting declared that the Swedish king was no longer Norway’s king; reactions in Sweden were fierce and war nearly broke out, but two referendums that year confirmed the break with Sweden and chose a monarchy, and the Swedish king accepted the result. The Danish Prince Carl became King Haakon VII (1905–1957). He was followed by Olav V (1957–1991), Harald V (1991–2026) and Haakon VIII, who became king in August 2026.'],
    ['More history dates','Before 1845 Norwegians were not allowed to leave the state church; the Dissenter Act of 1845 allowed other Christian communities to organise, and from 1851 Jews were allowed into the country. In the late 1800s Norway started producing electricity from its waterfalls; a special law let private companies build hydropower plants while the water resources stayed publicly owned. The Sámi language was allowed in schools again from 1959. Liberation Day on 8 May marks the end of the German occupation in 1945 and is a flag day. Oil was first found in the North Sea in 1967, and the large Ekofisk field was found in 1969. The Norwegian labour movement has roots back to the 1600s but became organised from the 1880s.'],
    ['Norway in the world and defence','Norway was a founding member of the United Nations (FN) in 1945. The UN now has 193 member states and works for peace, human rights, food, education and health; UNICEF is the UN’s children’s fund and UNHCR its refugee agency. Norway is also a founding member of NATO (1949), a military alliance whose members promise to help each other if one of them is attacked. Norwegians voted against EU membership in 1972 and 1994, but Norway trades in the EU’s single market through the EEA agreement (EØS) and is part of the Schengen agreement, which lets people travel between member countries without passport checks. Norway has conscription (verneplikt) for Norwegian citizens of both sexes (women born in 1997 or later are included), normally from age 19 to 44. The Home Guard (Heimevernet) defends local areas in a crisis, and the Civil Defence (Sivilforsvaret) protects civilians and helps the emergency services in war and disasters.'],
    ['Law, courts and your record','Rettssikkerhet (the rule of law) means that nobody can be punished without a fair trial, everyone is equal before the law, and the authorities must also follow the law. Everyone accused of a crime has the right to a defence lawyer, paid for by the state in criminal cases. The age of criminal responsibility is 15. Instead of prison, a court can give community service (samfunnsstraff), unpaid work for the community. Convictions are recorded in the criminal record (often called rulleblad), and some jobs, such as working with children, require a police certificate (politiattest) showing a clean record (ren vandel). Rape involving intercourse carries a minimum sentence of three years in prison. Taushetsplikt (duty of confidentiality) means doctors, police, teachers and other public employees may not share private information about you, while meldeplikt (duty to report) means staff in kindergartens, schools and health services must contact the child welfare service if they believe a child is neglected or abused.'],
    ['Forming a government and the King’s role','After a Storting election, the person who can win the support of a majority in the Storting, usually a party leader, becomes prime minister; this is not always the leader of the largest party. A coalition government (koalisjonsregjering) is made up of several parties. A majority government (flertallsregjering) has the support of more than half of the 169 representatives, while a minority government has to find support case by case. Every Friday the government meets the King at the palace in the Council of State (statsråd), where the ministers inform the King and formal decisions are made. The King’s power is symbolic, and he stays politically neutral, but he signs all the government’s official decisions and the laws passed by the Storting. The title is inherited, not elected: King Haakon VIII is married to Queen Mette-Marit, and Crown Princess Ingrid Alexandra (born 2004) will inherit the throne; her brother is Prince Sverre Magnus (born 2005). The government consists of the prime minister and the ministers (statsråder) — each minister is the political head of a ministry (departement) — and it proposes new laws and the state budget every year. The Storting is the highest state authority: it passes laws, adopts the state budget, controls the government and debates major political issues. Anyone may attend and listen to Storting debates (but not speak), and many proposals are sent out for public consultation (høring).'],
    ['Religion and life stances in numbers','About seven in ten people in Norway (around 70 per cent) are members of the Church of Norway. Approved religious and life-stance communities receive the same state and municipal support per member as the Church of Norway. Christianity is still the largest religion, and Islam is the second largest. Many people belong to other religious or life-stance communities; the Norwegian Humanist Association (Human-Etisk Forbund) is the largest non-religious one, and a growing share belong to none. Norwegians tend to see religion as a private matter, and many who are not religious still use the church for christenings, confirmations, weddings and funerals.'],
    ['Emissions and waste in numbers','Transport as a whole accounts for around 30 per cent of Norway’s greenhouse gas emissions, and about half of that comes from road traffic; shipping and fishing are also big sources. But the largest emissions come from oil and gas extraction, industry and mining, and road traffic, and Norway’s greenhouse gas emissions are falling steadily. Norway’s goal was that all new cars sold from 2025 should be zero-emission cars, and all growth in passenger transport in the big cities should be by public transport, cycling or walking. Each person in Norway throws away more than 400 kg of rubbish a year, many municipalities ask residents to sort their own waste, and reuse (gjenbruk) has become very popular in recent years.'],
    ['Sustainable development and the Brundtland Commission','Sustainable development (bærekraftig utvikling) means meeting people’s needs today without destroying the possibilities of the generations that come after us. The term spread worldwide at the end of the 1980s through the UN World Commission on Environment and Development, set up in 1983 and led by former Norwegian prime minister Gro Harlem Brundtland (the Brundtland Commission), which delivered its report in 1987. Nature itself is also a resource: tourists come to see the fjords and the midnight sun, and everyone in Norway has a short way to nature. Reuse (gjenbruk) means things are used again by other people; recycling (gjenvinning) means they are taken apart or melted into raw materials for new products. Food waste (matsvinn) is edible food that is thrown away — the food wasted globally each year would be enough to feed all the hungry people in the world.']
  ]}
];

const CIVIC_MODULES_NO = [
{id:'m1', title:'Utdanning, kompetanse og arbeidsliv', topics:[
  ['Rett til utdanning','Barn har både rett og plikt til å gå på grunnskolen fra de er 6 til 16 år, og skolegangen er gratis. Alle som har fullført grunnskolen har rett til videregående opplæring, som er gratis i offentlige skoler, og voksne har også rett til videre opplæring, blant annet norskopplæring.'],
  ['Arbeidsliv og fagforeninger','De fleste arbeidstakere kan melde seg inn i en fagforening. Tariffavtaler fastsetter lønn og arbeidsvilkår i mange bransjer, og omtrent halvparten (ca. 50 %) av arbeidstakerne er organisert i en fagforening. Arbeidsmiljøloven verner om arbeidstid, helse og sikkerhet, og beskytter mot urettmessig oppsigelse.'],
  ['Skattefinansiert velferd','Skoler, helsetjenester og NAV-ytelser (dagpenger, sykepenger, pensjon) finansieres hovedsakelig gjennom skatter. Norge bruker et progressivt inntektsskattesystem som ryggraden i velferdsstaten.'],
  ['Personopplysninger og opphavsrett','Personopplysninger er beskyttet ved lov — du trenger vanligvis et rettslig grunnlag eller samtykke fra personen for å samle inn eller dele opplysninger om dem, også bilder. Åndsverk er automatisk beskyttet av opphavsrett, og det er ikke tillatt å kopiere dem uten tillatelse.'],
  ['Digital kompetanse og kildekritikk','Kildekritikk, altså å vurdere informasjonskilder kritisk, er viktig for å avsløre feilinformasjon på nettet. Mange norske offentlige tjenester er først og fremst digitale, og BankID brukes mye for sikker innlogging.'],
  ['Skolens verdier og samarbeid','Norske skoler legger vekt på samarbeid og likeverd mellom elevene, og fysisk avstraffelse av elever er forbudt. Foreldresamarbeid, som foreldremøter og utviklingssamtaler, er en naturlig del av skolehverdagen. Skolens formålsparagraf skal bygge på grunnleggende verdier i kristen og humanistisk arv og tradisjon, slik som respekt for menneskeverdet og naturen, og på åndsfrihet, nestekjærlighet, tilgivelse, likeverd og solidaritet. Alle elever har lik rett til opplæring, og det skal ikke gjøres forskjell på elever på grunn av bosted, familiebakgrunn eller kjønn. Elever som trenger ekstra hjelp, skal få det; det finnes få spesialskoler i Norge, og de fleste barn får den hjelpen de trenger, på skolen i nærmiljøet sitt.'],
  ['Hvor man kan lære norsk','I tillegg til formelle kurs er arbeidsplasser, bibliotek og hverdagslige møter med andre alle verdifulle arenaer for å lære språket. Takker man ja til språkpraksis på en arbeidsplass, får man en unik mulighet til å lære språket i et naturlig miljø.'],
  ['Barnehager','Alt som skjer i en barnehage styres av barnehageloven og skal bygge på kristne og humanistiske verdier, menneskerettigheter og respekt for naturen. Det er dyrt å drive barnehage — kommunen dekker det meste av kostnaden, og Stortinget fastsetter en makspris for det foreldre betaler, med søskenmoderasjon og redusert betaling eller gratis kjernetid for familier med lav inntekt. Foreldre som ikke snakker norsk har rett til tolk på foreldremøter. De fleste barn mellom 1 og 5 år går i barnehage. Barnehagen er et pedagogisk tilbud, ikke bare barnepass: den forbereder barna til skolen og skal fremme demokrati og likestilling og motarbeide alle former for diskriminering.'],
  ['Fakta om grunnskolen','Alle barn har rett til 13 års skolegang totalt; de ti årene i grunnskolen (1.–10. trinn) er obligatoriske og gratis. Barn begynner på skolen i august det året de fyller seks år, går automatisk videre til neste trinn uten å gå om igjen et år, og det er ingen skoleuniform. Elever får muntlig og skriftlig tilbakemelding, men ingen karakterer på barnetrinnet (1.–7. trinn); fra ungdomstrinnet (8.–10. trinn) får de karakterer på en skala fra 1 til 6 (6 er best), i tillegg til egne karakterer i orden og oppførsel (god/nokså god/lite god). Fysisk avstraffelse er forbudt både på skolen og hjemme. Færre enn 5 % av elevene går på private skoler med skolepenger; resten går på gratis offentlige skoler som følger den samme nasjonale læreplanen fastsatt av Stortinget.'],
  ['Skolefag og undervisningsmetoder','Elever på barne- og ungdomstrinnet har fag som matematikk, norsk, engelsk, fremmedspråk, naturfag, samfunnsfag, kroppsøving, KRLE (kristendom, religion, livssyn og etikk), kunst og håndverk, musikk, mat og helse, samt valgfag. Undervisningen foregår ofte også utenfor klasserommet — turer, leirskole, svømmeopplæring, museumsbesøk — og elevene jobber mye i grupper og med prosjekter, noe som skal bygge samarbeidsevner og forberede dem på å delta i et demokrati.'],
  ['Samarbeid mellom hjem og skole','Foreldrene har hovedansvaret for barna sine, men skole og hjem deler ansvaret for barnets oppdragelse og læring. Elev, foreldre og lærer skal ha en utviklingssamtale om barnets faglige og sosiale utvikling minst to ganger i året, og foreldre forventes å lese og følge opp skriftlig informasjon fra skolen. Det kan oppstå reelle spenninger — for eksempel at foreldre holder barn borte fra gym- eller svømmetimer, forlenger sommerferien inn i skoletiden, eller melder barna av leirskoleaktiviteter — og skolene peker på dette som utfordringer for samarbeidet.'],
  ['Videregående skole og de to studieretningene','Alle som har fullført grunnskolen har rett til videregående opplæring fram til de oppnår studiekompetanse eller yrkeskompetanse; offentlig videregående skole er gratis, selv om det finnes noen private skoler med skolepenger. Søknad sendes inn digitalt innen 1. mars, og karakterene fra 10. trinn avgjør hvilken skole eleven kan komme inn på. Elevene velger mellom yrkesfag, som ender med et fagbrev innen yrker som tømrer, frisør, helsefagarbeider eller bilmekaniker, eller studiespesialisering, en teoretisk retning som gir opptak til universitet og høyskole.'],
  ['Høyere utdanning og Lånekassen','Rundt 42 % av den voksne befolkningen i Norge har høyere utdanning, kvinner utgjør omtrent 60 % av studentene og har litt høyere utdanningsnivå enn menn, og norskfødte med innvandrerforeldre tar høyere utdanning i større grad enn gjennomsnittet. Opptak til de gratis offentlige universitetene og høyskolene (studentene betaler bare for bøker) samordnes sentralt gjennom Samordna opptak, og søknadsfristen er 15. april. Fordi studiene er gratis, men det koster å leve, låner de fleste studenter penger fra Lånekassen, opprettet i 1947 for at alle skal kunne studere uavhengig av bakgrunn; en del av lånet kan gjøres om til stipend dersom studenten består eksamenene, mens lånet ellers betales tilbake i avdrag etter fullført utdanning.'],
  ['Voksenopplæring og godkjenning av realkompetanse','Voksne som ikke har fullført grunnskolen har rett til gratis forberedende opplæring for voksne (FOV), og kommunen har ansvaret for å tilby den. De som er 25 år eller eldre og har fullført grunnskole (i Norge eller i et annet land), men ikke videregående, har rett til gratis videregående opplæring gjennom fylkeskommunen, i tillegg til private tilbud mot betaling, og mange kan få stipend og/eller lån fra Lånekassen mens de går på skole. Utenlandske utdanninger kan godkjennes gjennom Direktoratet for høyere utdanning og kompetanse (HK-dir), mens helsepersonell søker autorisasjon separat hos Helsedirektoratet. Kompetanse man har fått utenfor det formelle utdanningssystemet kan også vurderes som realkompetanse, noe som kan forkorte et studieløp, gi opptak, eller føre til ny jobb eller høyere lønn — tanken bak er livslang læring.'],
  ['Norsknivåer og rettigheter','Norskferdigheter for introduksjonsprogrammet måles etter den felles europeiske referanserammen: A1 og A2 (grunnleggende bruker), B1 og B2 (selvstendig/kompetent bruker). Om norskopplæringen din er gratis og obligatorisk, eller noe du selv må betale for, avhenger av oppholdstillatelsen din. Opplæringen skal avsluttes innen tre år (18 måneder for deltakere som allerede har videregående eller høyere utdanning), og avsluttes med en norskprøve som dokumenterer nivået som er oppnådd; måloppnåelsen settes ut fra utdanningsnivået ditt ved ankomst og kan justeres etter hvert som du gjør framgang.'],
  ['Fagforeninger og medbestemmelse på arbeidsplassen','Omtrent halvparten av norske arbeidstakere er medlem av en fagforening. Fagforeningene forhandler lønn og arbeidsvilkår med arbeidsgiverne; dersom forhandlingene ikke fører fram, har arbeidstakerne rett til å streike. Norsk arbeidsliv er bygget rundt medbestemmelse — den enkelte arbeidstaker har rett til å bli hørt om sin egen arbeidssituasjon, og hver arbeidsplass må organisere helse-, miljø- og sikkerhetsarbeid (HMS) gjennom en ansattrepresentant, et eget verneombud og en representant fra ledelsen.'],
  ['Arbeidsmiljøloven og ferieloven','Arbeidsmiljøloven regulerer ansettelse og kontrakter, arbeidstid, fravær og HMS, og gir arbeidsgiveren det overordnede ansvaret for arbeidsmiljøet, samtidig som arbeidstakerne plikter å bidra til å opprettholde det. Ferieloven gir alle arbeidstakere minst fire uker og én dag betalt ferie i året (mange får fem uker gjennom tariffavtalen); det er feriepenger, ikke vanlig lønn, som utbetales i ferien, og de beregnes ut fra det du tjente året før.'],
  ['Lover, avtaler og lønn','Lovene i arbeidslivet vedtas av Stortinget og gjelder for alle arbeidsgivere og arbeidstakere, mens avtaler blir forhandlet fram mellom organisasjonene til arbeidsgiverne og arbeidstakerne og bare gjelder for de bransjene som har laget dem. Etter arbeidsmiljøloven har også arbeidstakerne plikter: å være med på å skape et godt arbeidsmiljø, å være med på og gjennomføre tiltakene som settes i verk for å bedre arbeidsmiljøet, og å delta i det organiserte verne- og miljøarbeidet. Lønn er en forhandlingssak, enten direkte mellom arbeidsgiver og arbeidstaker eller mellom representanter for dem, ofte fagforeningen. Lønnen betales vanligvis inn på en bankkonto på en fast dato én gang i måneden, og du får en lønnsslipp som viser lønn og skattetrekk. Bruttolønn er lønn før skatt, og nettolønn er lønn etter skatt. Alle som tjener over et minimumsbeløp i året, må betale skatt, og det er ditt eget ansvar at Skatteetaten har riktige opplysninger om deg.'],
  ['NAV og velferdsstaten i praksis','NAV (Arbeids- og velferdsforvaltningen) har et kontor i hver kommune og forvalter omtrent en tredjedel av statsbudsjettet med rundt 22 000 ansatte, og dekker sykepenger, dagpenger, introduksjonsstønad, pensjon, barnetrygd, kontantstøtte, sosialhjelp og mer, og hjelper også folk med å kvalifisere seg for arbeid. Staten og kommunene har hovedansvaret for å tilby velferdsgoder. Velferdsstaten bygger på tanken om likeverd, og politikerne bestemmer hvilke ordninger vi skal ha, så ordningene kan endres etter hvem som har makten, og etter økonomien i samfunnet. Systemet bygger på gjensidig tillit — staten stoler på at folk ikke misbruker ytelsene, og folk stoler på at staten hjelper dem når de trenger det — og det er avhengig av at flest mulig jobber og betaler skatt. Rundt en tredjedel av alle sysselsatte i Norge jobber i offentlig sektor, i yrker som lærer, helsepersonell og saksbehandler i NAV.'],
  ['Lønn, skattekort og skattemelding','Gjennomsnittlig brutto årslønn i Norge var like under 670 000 kroner før skatt i 2023, og kvinner tjener i gjennomsnitt mindre enn menn, blant annet fordi flere kvinner jobber deltid. De fleste arbeidstakere betaler 30–40 % av lønnen i skatt; Skatteetaten beregner dette ut fra skattekortet ditt (frikort, prosentkort eller tabellkort), som arbeidsgiveren laster ned digitalt. Hvert år i mars/april får du en digital skattemelding som oppsummerer inntekt, fradrag, formue og gjeld fra året før — sjekk den, så får du penger tilbake hvis du har betalt for mye skatt, eller restskatt hvis du har betalt for lite.'],
  ['Arbeidskontrakt og svart arbeid','Alle som tar en jobb har rett til en skriftlig arbeidskontrakt som angir stilling, lønn og arbeidstid, signert av både arbeidsgiver og arbeidstaker — uten en slik kontrakt kan du ikke kreve dagpenger fra NAV, selv om du har betalt skatt. Svart arbeid — å jobbe uten kontrakt og uten å betale skatt — er ulovlig og regnes som økonomisk kriminalitet for både arbeidsgiver og arbeidstaker, og det fratar arbeidstakeren sykepenger, feriepenger, pensjonspoeng, dagpenger, yrkesskadeforsikring, lånemuligheter og dokumentert arbeidserfaring.'],
  ['Hvordan det norske arbeidsmarkedet har endret seg','For 150 år siden dominerte jordbruk, skogbruk og fiske; i 1950 jobbet over 20 % i jordbruket, mot under 3 % i dag, selv om Norge nå produserer mer mat takket være mekanisering. Industrialiseringen trakk folk til byene på slutten av 1800-tallet, og etter at det ble funnet olje i Nordsjøen på slutten av 1960-tallet, ble olje og gass en sentral del av økonomien. De siste 30 årene har industriarbeidsplasser gått ytterligere ned, og de fleste jobbene finnes nå i tjenesteytende yrker — butikker, helsevesen, skoler, barnehager, transport og IT — mens klimaendringene driver fram en omstilling mot «grønne» jobber.'],
  ['Å søke jobb: CV, søknad og intervju','En norsk jobbsøknad er et kort brev om deg selv og din bakgrunn; CV-en lister kort opp arbeidserfaring og utdanning — begge deler bør være korrekte og skrevet på godt norsk. Arbeidsgivere vektlegger erfaring, referanser, personlig egnethet og skikkethet, ikke bare formelle kvalifikasjoner, og inviterer som regel kandidater til ett eller flere intervjuer. God intervjuskikk innebærer å møte presis, kle seg passende, gi et fast håndtrykk og øyekontakt, og være positiv og skape god kontakt.'],
  ['Å finne jobb gjennom nettverket sitt','Mellom 60 og 80 % av jobbene i Norge fylles gjennom personlige nettverk, ikke gjennom åpne utlysninger, så i tillegg til å sjekke nav.no og finn.no er det viktig å bygge nettverk — familie, venner, tidligere kolleger, naboer, lærere, saksbehandlere — for å finne arbeid. Nyankomne som mangler referanser eller nettverk starter ofte med bemanningsbyråer, praksisplasser eller korte og midlertidige jobber for å bygge opp begge deler.'],
  ['Kildekritikk og etisk bevissthet','Kildekritikk innebærer å spørre hvem som har skrevet en tekst, om vedkommende har en agenda, hva de ønsker å oppnå, om informasjonen er korrekt, og om den utelater viktige fakta. Norske skoler trener elevene aktivt i å stille spørsmål ved og utfordre etablerte sannheter i stedet for bare å gjenta det de blir fortalt, samtidig som de erkjenner at egen kunnskap kan være ufullstendig. Etisk bevissthet handler om å veie ulike hensyn mot hverandre slik at man kan ta bedre valg for samfunnet, menneskene rundt seg og seg selv; hvis du gjenbruker andres tekst, bilder eller musikk, må du oppgi hvem som har opphavsretten.'],
  ['Personvern, BankID og digital dømmekraft','Personvern er retten til privatliv og til å ha kontroll over egne personopplysninger — navn, adresse, telefonnummer, fødselsnummer og etnisitet er alle personopplysninger, og denne retten er beskyttet av Den europeiske menneskerettskonvensjonen. Nordmenn logger inn i nettbank, offentlige tjenester og nettbutikker med BankID, passord, fingeravtrykk eller ansiktsgjenkjenning, og dette etterlater digitale spor som lagres og kan misbrukes hvis de kommer på avveie. Ytringsfriheten gjelder også på nett, men den er ikke ubegrenset — rasistiske eller diskriminerende uttalelser er ulovlige — og god digital dømmekraft betyr at man bare bør poste det man ville sagt til noen ansikt til ansikt, og alltid spørre om lov før man deler bilder av andre.'],
  ['Oppsigelsestid, sykepenger og ferie – reglene','Lovens minste oppsigelsestid er én måned. Den øker til to måneder etter fem års ansettelse hos samme arbeidsgiver og tre måneder etter ti år (lenger for eldre arbeidstakere med lang ansettelsestid), hvis ikke arbeidsavtalen eller tariffavtalen gir mer. En vanlig arbeidsuke i full stilling er 37,5 timer. Hvis du blir syk, er sykepengene vanligvis like store som full lønn opp til seks ganger grunnbeløpet i folketrygden (6G): arbeidsgiveren betaler de første 16 dagene, og NAV betaler etter det. Ferieloven sier også når ferien kan tas, hva som skjer hvis du blir syk i ferien (du kan be om å ta dagene senere) og hva som gjelder for ferie i oppsigelsestiden. Feriepengene beregnes ut fra det du tjente året før.'],
  ['Hvem som krever inn skatt, og hva den betaler for','Inntektsskatten deles mellom kommunen du bor i, fylket og staten, og arbeidsgiverne betaler i tillegg arbeidsgiveravgift på toppen av lønna. Arbeidsgiveren trekker skatt av lønna di hver måned og overfører pengene til det offentlige. Skatteetaten skriver ut skattekort og beregner skatten ut fra opplysningene etaten har. Skatter og avgifter er den viktigste finansieringen av velferdsgodene, som skole, sykehus, veier, pensjon og ytelser fra NAV, mens det meste av oljeinntektene spares i Statens pensjonsfond utland. Å jobbe uten å betale skatt (svart arbeid) er ulovlig.'],
  ['Yrkesfag, lærlinger og hvilke jobber som krever høyere utdanning','De fleste yrkesfaglige utdanningsprogrammene i videregående skole følger 2+2-modellen: to år på skole og deretter to år som lærling i en bedrift med lønn, som avsluttes med fagbrev eller svennebrev. Studieforberedende utdanningsprogram avsluttes med vitnemål som gir rett til å søke høyere utdanning. Omtrent halvparten av elevene velger hver retning, og nesten 80 prosent fullfører videregående opplæring. Yrker som rørlegger, elektriker, tømrer og helsefagarbeider lærer man på videregående skole, mens yrker som sykepleier, lærer, ingeniør, lege og tannlege krever høyere utdanning. Du søker studieplass ved universiteter og høgskoler gjennom Samordna opptak (samordnaopptak.no), og studielån og stipend gjennom Lånekassen.']
]},
{id:'m2', title:'Familie, helse og hverdagsliv', topics:[
  ['Barns rettigheter','Barneloven gir barn rett til å bli hørt og rett til å bli beskyttet mot vold. Fysisk avstraffelse av barn fra foreldre er ulovlig i Norge. Loven gjelder barn og unge under 18 år: Når et barn blir født, sendes det melding til Folkeregisteret, foreldrene har hovedansvaret og må sørge for mat, klær og det barnet trenger for å ha et godt liv til det har fylt 18 år, de skal passe på at barnet deltar i den obligatoriske grunnskoleopplæringen, og barnet har rett til samvær med begge foreldrene, også om de bor hver for seg. Barnehage, skole og fritidsaktiviteter påvirker også barna, men foreldrene har hovedansvaret for oppdragelsen; tidligere ble barn sett på som «små voksne» som måtte jobbe for å bidra til familiens inntekter, mens barndommen i dag er en tid for lek og læring.'],
  ['Offentlige tjenester som støtter familier','Barnehage (med rett til plass fra rundt ett års alder), skole, helsestasjon (gratis helsekontroller og vaksinasjon for barn), NAV (velferd og stønader) og barnevernet (barnevernstjenesten, som kan gripe inn hvis et barns sikkerhet er truet) støtter alle familier.'],
  ['Helse og helsetjenester','Alle får tildelt en fastlege. Ved akutt, men ikke livstruende, behov tar du kontakt med legevakten; ring 113 for ambulanse, 112 for politi og 110 for brann. Helsetjenester er hovedsakelig offentlige og skattefinansierte, med en liten egenandel som har et årlig tak (frikort).'],
  ['Livsstil, migrasjon og psykisk helse','Kosthold, søvn og mosjon påvirker den fysiske helsen, og stress knyttet til migrasjon er en anerkjent utfordring. Hjelp er tilgjengelig gjennom fastlegen din, helsestasjonen og psykisk helsetjeneste. Folkehelsen i Norge har blitt vesentlig bedre de siste hundre årene, og folk lever lenger, men kreft og hjerte- og karsykdommer er de vanligste dødsårsakene, diabetes og fedme er et økende problem, og røyking øker risikoen for både kreft og hjerte- og karsykdommer. Helsearbeidere ser at flere innvandrere enn nordmenn har diabetes, fedme, dårlig tannhelse, feilernæring (særlig mangel på jern og vitamin D) og depresjoner. Vi har selv et stort ansvar for vår egen helse; helsevesenet gir råd og veiledning. Psykisk helse er like viktig som fysisk helse: dårlig psykisk helse kan gi fysiske plager som vondt i magen eller dårlig søvn, fastlegen kan henvise til psykolog (som også har taushetsplikt), og de fleste i Norge har i dag en åpen og forståelsesfull holdning til psykisk sykdom og mener at psykisk syke skal få hjelp på lik linje med fysisk syke.'],
  ['Nyankomnes rettigheter og plikter','Etter integreringsloven har nyankomne flyktninger både en rett – og, så lenge de mottar introduksjonsstønad, en plikt – til å delta i introduksjonsprogrammet, som kombinerer norskopplæring med skritt mot arbeid.'],
  ['Personlig økonomi','Arbeid, inntekt og forbruk former levestandarden din. Det er viktig å sette opp et budsjett og unngå unødvendig forbruksgjeld; NAV og kommunal gjeldsrådgivning kan hjelpe hvis det blir vanskelig. De fleste voksne får lønn, trygd eller pensjon én gang i måneden. Litt mer enn 35 prosent av forbruket til en vanlig husholdning går til bolig og ca. 11 prosent til mat (SSB, 2022). Det er dyrt å bo i Norge, så i de fleste familier er begge foreldrene i lønnet arbeid, og begge de voksne er ansvarlige for familiens økonomi.'],
  ['Skadelige praksiser','Vold i nære relasjoner, tvangsekteskap og kjønnslemlestelse er ulovlig i Norge, uansett kultur eller religion. Gratis og konfidensiell hjelp er tilgjengelig på et krisesenter, og skoler har minoritetsrådgivere.'],
  ['Familieplanlegging og seksuell identitet','Prevensjon og råd om familieplanlegging er tilgjengelig, blant annet gjennom helsestasjon for ungdom. LHBT+-rettigheter er beskyttet av likestillings- og diskrimineringsloven, og likekjønnet ekteskap har vært lovlig siden 2009.'],
  ['Bolig i Norge','Rundt 82 prosent av husholdningene eier boligen sin, og 18 prosent leier. De to vanligste eieformene er selveierbolig (du kan pusse opp og leie ut uten å spørre noen, og betaler alle utgifter selv: kommunale avgifter, huseierforsikring og vedlikehold) og borettslag (du eier en andel og har enerett til bruk av din bolig, betaler et innskudd når du kjøper og deretter husleie/felleskostnader hver måned som dekker din del av fellesgjelden, kommunale avgifter og huseierforsikring, og må følge borettslagets regler og vedtekter). Å kjøpe bolig krever normalt egenkapital på rundt 10 prosent av kjøpesummen, og banken låner ut resten etter å ha sjekket at du kan dekke avdrag og renter.'],
  ['Å komme til Norge: opphold og statsborgerskap','En innvandrer er en person født i utlandet som bor i Norge. EU/EØS-borgere kan jobbe uten oppholdstillatelse, men må registrere seg hos politiet på nett. Flyktninger kommer enten som overføringsflyktninger (kvoteflyktninger, gjennom FNs UNHCR) eller som asylsøkere, som kan få asyl hvis de er individuelt forfulgt på grunn av rase, religion, nasjonalitet, seksuell legning eller politisk arbeid, eller opphold på grunn av sterke menneskelige hensyn (disse og overføringsflyktninger kalles til daglig flyktninger). Familiemedlemmer til en person med oppholdstillatelse kan søke om familiegjenforening. De tre eller fem første årene får man en midlertidig oppholdstillatelse som som regel må fornyes hvert år; etter tre eller fem år kan man søke om permanent oppholdstillatelse, og etter seks til åtte år kan du søke om norsk statsborgerskap, og UDI (udi.no) behandler søknader og gir veiledning.'],
  ['Introduksjonsprogrammet i detalj','Introduksjonsprogrammet varer normalt fra tre måneder opptil tre år, avhengig av deltakerens bakgrunn, og gir introduksjonsstønad hele veien. Det drives av kommunene, hovedsakelig for flyktninger – ikke alle innvandrere har rett til det. Foreldre til barn under 18 år (eller som venter barn) må også gjennomføre obligatorisk foreldreveiledning, enten i gruppe (8–12 veiledningsmøter på minst én time hver) eller individuelt (5–8 veiledningssamtaler på minst 45 minutter hver). Programmet skal inneholde norskopplæring, hjelp til livsmestring i et nytt land, foreldreveiledning og arbeids- eller utdanningsrettet innhold; målet er grunnleggende ferdigheter i norsk, grunnleggende innsikt i norsk samfunnsliv og å forberede deltakerne til arbeid eller utdanning. Det var Stortinget som vedtok integreringsloven, og loven gir kommunene i oppgave å tilby programmet.'],
  ['Ekteskap, samboerskap og skilsmisse','Rundt 70 prosent av parene i Norge er gift, og 30 prosent er samboere; om lag 20 000 par gifter seg hvert år, og rundt 40 prosent av ekteskapene forventes å ende i skilsmisse, noe som normalt krever ett års separasjon først (umiddelbart hvis ekteskapet innebar tvang eller vold). Siden 2009 kan to personer av samme kjønn gifte seg. Ektefeller har plikt til å forsørge hverandre, står begge ansvarlige for lån de tar opp, og eier sammen det de kjøper – også om bare den ene arbeider utenfor hjemmet – og etter en skilsmisse har både mor og far plikt og rett til omsorg for barna. For barn født fra og med 1. januar 2020 har begge foreldrene felles foreldreansvar, uansett om de er gift, samboere eller lever hver for seg – og i motsetning til ektefeller får ikke samboere automatisk delte økonomiske eller juridiske rettigheter, så mange inngår egne avtaler.'],
  ['Barns økende medbestemmelse','Etter barneloven har barn rett til å bli hørt før avgjørelser som gjelder dem, fra rundt sju års alder, og deres mening skal tillegges stor vekt fra tolv år. Fra 15 år kan unge selv bestemme over egen utdanning og om de vil melde seg inn i eller ut av organisasjoner. Foreldrene beholder det overordnede foreldreansvaret til barnet fyller 18 år, men må gi barnet stadig mer medbestemmelse etter hvert som det blir eldre.'],
  ['Barnevernstjenesten','Norge var det første landet i verden som opprettet en offentlig barnevernstjeneste, gjennom vergerådsloven fra 1900. Barnevernet finnes i alle kommuner, kan tilby støtte som veiledning eller avlastning ved behov, og kan gripe inn for å beskytte et barn – helst i samarbeid med familien, eller gjennom alternativ omsorg om nødvendig. De ansatte har taushetsplikt, men fagpersoner som jobber med barn har plikt til å melde fra ved mistanke om vold eller overgrep, og alle som er bekymret for et barn kan kontakte barnevernet; barneverntjenesten i kommunen er åpen på dagtid, og på kveld, natt og i helger kan barn eller andre som er bekymret for et barn, ringe alarmtelefonen for barn og unge på 116 111.'],
  ['Helsetjenester og pasientrettigheter','Alle som bor i Norge har en fastlege og kan bytte fastlege inntil to ganger i året via helsenorge.no. Et vanlig legebesøk koster typisk 150–300 kroner, men besøk for barn under 16 år og svangerskapskontroller er gratis; når egenandelene dine for året passerer en grense, får du et frikort, og videre offentlig helsehjelp er da gratis ut året. Ring legevakten på 116 117 ved akutt, men ikke livstruende, behov når fastlegen er stengt, og 113 ved medisinsk nødsituasjon (snakk rolig og si hvem du er, hva som har skjedd og hvor du er). Et offentlig helsevesen betyr at staten tar ansvaret for at alle får den behandlingen de trenger, uavhengig av personlig økonomi; det finnes også private helsetjenester, men dem betaler man selv. For å få time hos en legespesialist, for eksempel gynekolog, hudlege eller øre-nese-hals-lege, må man som hovedregel ha henvisning fra fastlegen. Sykehusbehandling, mat og opphold er gratis når du er innlagt (ofte bor en av foreldrene på sykehuset sammen med barnet), poliklinisk behandling betyr at du får behandling på sykehuset uten å være innlagt, helsepersonell og tolker har taushetsplikt, og pasienter kan se sin egen journal – fra 16 år bestemmer den unge selv hvem andre, inkludert foreldre, som kan få tilgang til helseopplysningene.'],
  ['Tannhelse','Offentlige tannlegekontroller er gratis for barn og unge opp til 19 år, selv om foreldre betaler en egenandel for tannregulering. Fra 19 år betaler unge voksne 25 prosent av kostnaden i den offentlige tannhelsetjenesten, og det offentlige betaler 75 prosent; voksne utover dette betaler full pris og ordner tannlege selv, helst med årlig kontroll. Alle bør pusse tenner to ganger daglig, og søt eller syrlig mat og drikke (godteri, brus, juice) skader tennene – dårlige melketenner øker også risikoen for dårlige voksentenner, så foreldre har ansvar for barns tannhelse fra før den første tannen kommer.'],
  ['Svangerskap, vaksinasjon og helsekontroller for barn','Prevensjonsmetoder inkluderer p-piller og p-stav (hormoner som hindrer eggløsning), spiral (settes inn av lege) og kondom – den eneste metoden som også beskytter mot seksuelt overførbare infeksjoner. Gravide får gratis, frivillig svangerskapsomsorg (vanligvis 8–12 kontroller) og gratis fødsel på sykehus. Helsestasjonen følger opp barn i alderen 0–5 år (vekst, syn, hørsel, språk, vaksinasjon), og skolehelsetjenesten viderefører dette gjennom skolegangen; vaksinasjon er gratis og sterkt anbefalt, men krever samtykke fra foreldrene. Etter abortloven kan en kvinne avslutte et svangerskap på egen forespørsel fram til uke 18; etter det kreves godkjenning.'],
  ['De tre fasene ved å flytte til et nytt land','Å flytte til utlandet blir ofte beskrevet i tre faser: en innledende «hvetebrødsdager»-fase preget av begeistring over nye muligheter; en vanskeligere fase, noen ganger etter uker eller måneder, preget av usikkerhet, slitenhet over forskjellene og hjemlengsel; og en tilpasningsfase, der språk og forståelse av norske systemer bedres, og gamle og nye verdier begynner å falle på plass sammen. Familiemedlemmer går ofte gjennom disse fasene på ulike tidspunkter og i ulikt tempo, noe som kan skape spenninger hjemme.'],
  ['Å leve i to kulturer','Kulturer blir noen ganger beskrevet som individualistiske (verdsetter uavhengighet, likeverd og likestilling) eller kollektivistiske (verdsetter lydighet, respekt og gode relasjoner innad i gruppen). Barn som vokser opp mellom kulturer, kan møte motstridende forventninger fra foreldre og fra det norske samfunnet om hva som regnes som høflig eller riktig oppførsel.'],
  ['Sosiale arenaer og uskrevne regler','Sosiale arenaer er steder der mennesker møtes for å være sammen: familien, skolen, arbeidsplassen, kafeer, kurs, kor og organisasjoner. Kurset kaller de to kulturtypene jeg-kulturer (enkeltmennesket er viktigst) og vi-kulturer (gruppa er viktigst). Mange barn er med i organiserte fritidsaktiviteter som idrettslag, korps og speideren, og foreldrene er ofte med som trenere eller sjåfører – en fin måte å bli kjent med folk på for den som er ny. Frivillig arbeid er ulønnet, går over kortere perioder (ingen jobber full tid som frivillig) og er gjerne knyttet til organisasjoner med et samfunnsnyttig formål, som Røde Kors; mange i Skandinavia er frivillige, og organisasjonene fungerer som en opplæring i demokrati (møter, valg og avstemninger). Dugnad er en gammel skikk i Norge, og de fleste landbrukssamfunn i verden har en liknende tradisjon. Uskrevne regler er forskjellige fra kultur til kultur: I Norge håndhilser både kvinner og menn når de møtes og når de går fra hverandre, en vanlig hilsen er «Hei, hvordan går det?» – «Takk, bare bra. Og med deg?», og nordmenn går sjelden på besøk til venner uten at dag og tid er avtalt på forhånd.'],
  ['Befolkningen i Norge','Det bor ca. 5,6 millioner mennesker i Norge. Omtrent én million av disse (ca. 18 prosent av befolkningen) er født i utlandet eller har foreldre som er født i utlandet, og rundt halvparten av innvandrerne i Norge har norsk statsborgerskap. For drøyt hundre år siden var folk i Norge svært fattige, men Norge hadde likevel verdens høyeste levealder; i dag er levestandarden blant de høyeste i verden, de fleste har en grei økonomi, og velferdsstaten gir hjelp og tjenester når folk trenger det.'],
  ['Fritid, dugnad og samfunnsengasjement','Fritid er den delen av døgnet som ikke går med til arbeid, mat eller søvn. Dugnad – ubetalt, frivillig fellesarbeid, som vårrengjøring i et borettslag eller å hjelpe til i en barnehage – ble kåret til Norges nasjonalord i 2004; det er formelt sett frivillig, men å utebli kan få sosiale konsekvenser. Vanlige sosiale arenaer for å bygge nettverk er idrettslag, korps, speider og frivillige organisasjoner som Røde Kors. Politisk engasjement kan være formelt (partimedlemskap, valgkamp) eller uformelt (underskriftskampanjer, demonstrasjoner, sosiale medier), og unge nordmenn er mer politisk aktive enn før: valgdeltakelsen blant de yngste velgerne økte med mer enn ti prosent fra 2007 til 2011 og har holdt seg høy siden, og politiske ungdomsorganisasjoner har fått flere medlemmer. Gjennom medlemskap i organisasjoner får man trening i demokratiske prosesser som diskusjoner, styrearbeid, valg og avstemninger. Alle som bor i et demokrati, har ansvar for at demokratiet skal fungere, ved å være aktive og følge med.'],
  ['Tvangsekteskap og kjønnslemlestelse — de juridiske detaljene','Å tvinge noen til å gifte seg ved bruk av vold, frihetsberøvelse, press eller trusler kan straffes med fengsel i inntil 6 år, og et tvangsekteskap har ingen juridisk gyldighet – den som ble tvunget, kan gå til en norsk domstol og få ekteskapet annullert senest fem år etter vigselen. Medvirkning straffes på samme måte som selve tvangen. Kjønnslemlestelse kan straffes med fengsel i inntil 6 år, eller inntil 15 år i grove tilfeller, og samtykke gjør det ikke lovlig. Det er også forbudt å hjelpe noen med det, å ta en jente ut av Norge for å få det gjort i utlandet, og å fornye eller gjenskape en tidligere kjønnslemlestelse. Ansatte i mange yrker og i trossamfunn som ikke prøver å avverge det (avvergelsesplikt), kan straffes med bot eller fengsel i inntil ett år. Hjelp finnes hos fastlegen, helsestasjonen, politiet og, i utlandet, en norsk ambassade; skoler kan ha minoritetsrådgivere, og hjelp er også tilgjengelig fra kompetanseteamet mot tvangsekteskap og kjønnslemlestelse (tlf. 478 09 050) og Røde Kors-telefonen (tlf. 815 55 201).'],
  ['Begreper innen personlig økonomi','Inntekt dekker alt som blir satt inn på kontoen din – lønn, NAV-ytelser, barnetrygd, kontantstøtte – mens utgifter dekker det du bruker penger på, fra husleie til mat til fritid. Lønn oppgis som bruttolønn (før skatt) eller nettolønn (etter skatt). Å åpne en bankkonto krever norsk fødselsnummer eller D-nummer, og hverdagsbank foregår gjennom BankID; et lån betales tilbake gjennom avdrag pluss rente, så et budsjett bør også sette av penger til sparing eller uforutsette utgifter.'],
  ['Familieliv i tall','Det fødes litt over 50 000 barn i Norge hvert år, og hver kvinne føder i gjennomsnitt omtrent 1,4 barn. Kvinner er i gjennomsnitt rundt 30 år når de får sitt første barn, de fleste gifter seg for første gang mellom 30 og 40 år, og rundt 20 000 par gifter seg hvert år. Kjernefamilien (foreldre og barn) er den vanligste familieformen, rundt 75 prosent av barna bor sammen med både mor og far, og i en husholdning (mennesker som bor i samme bolig og har felles økonomi) bor det i gjennomsnitt litt over to personer. Foreldre som begge er i lønnet arbeid, har til sammen rett til inntil 61 uker med foreldrepenger i forbindelse med fødsel. Familier får barnetrygd for alle barn til de fyller 18 år, likt for alle uansett inntekt, og kontantstøtte for barn mellom 13 og 19 måneder som ikke har fulltidsplass i barnehage (deltidsplass gir redusert kontantstøtte). Nesten 80 prosent av elevene i 1.–4. klasse går på skolefritidsordningen (SFO); en deltidsplass er gratis, mens foreldrene som hovedregel betaler for en full plass. De fleste flytter hjemmefra i tjueårene, mange studenter har mer enn 300 000 kroner i studiegjeld når de er ferdige, en vanlig barnefamilie har mer enn to millioner kroner i boliggjeld, kvinner og menn har lik arverett, og pensjonsalderen er 67 år både for menn og kvinner (noen kan gå av før, andre jobber til de er 70; lønnen bestemmer hvor stor pensjonen blir, men også de som ikke har hatt lønnet arbeid, for eksempel husmødre, får pensjon fra 67 år).'],
  ['Ekteskap, skilsmisse og ord om familien','Du må være 18 år for å gifte deg i Norge (det har ikke vært unntak siden 2018). Begge må ønske å gifte seg, ingen av dem kan være gift fra før, og begge må ha lovlig opphold i Norge. Du kan gifte deg borgerlig (borgerlig vigsel) i kommunen, eller i kirken eller et annet tros- eller livssynssamfunn. Paret betaler vanligvis bryllupet selv. Begge ektefellene trenger ikke være enige for å bli skilt: Vanligvis blir man først separert og kan få skilsmisse etter ett år (eller med en gang etter to år hver for seg, eller ved vold eller tvangsekteskap). Med en ektepakt kan formuen bli særeie i stedet for felleseie, og i et testament bestemmer du hvem som skal arve tingene dine. Nyttige ord: samboer (par som bor sammen uten å være gift), særbo (par som bor hver for seg), stebarn eller bonusbarn (barnet til partneren din), bonusmamma eller bonuspappa (steforelder), svigerforeldre (foreldrene til ektefellen eller kjæresten), aleneforsørger (en forelder som forsørger barna alene) og barnebidrag (penger som forelderen barnet ikke bor hos, betaler til den andre forelderen). En vanlig samværsordning er annenhver helg og én ettermiddag i uka.'],
  ['Merkedager i livet, tradisjoner og normer i hverdagen','Dåp er når et barn blir tatt opp i en kristen kirke. Familier som ikke er religiøse, kan ha navnefest. Konfirmasjon skjer når man er rundt 15 år, enten i kirken eller som humanistisk konfirmasjon i Human-Etisk Forbund. Det er en stor familiefest som foreldrene betaler, og mange får bunad til konfirmasjonen. Begravelsen er vanligvis innen ti virkedager etter dødsfallet, og det er vanlig å kondolere til familien. Normer er uskrevne regler, for eksempel å ta hverandre i hånda første gang man møtes, å komme presis, å ikke bråke på søndager og helligdager (ikke klippe plenen eller bore) og å vente med å besøke nybakte foreldre til de sier at de ønsker besøk. Venner hilser ofte på hverandre ved å si «hei», klemme hverandre eller slå hverandre på skulderen. Mange nordmenn drar på fjellet i påsken.'],
  ['Aldersgrenser du bør kunne','Myndighetsalderen er 18 år: Da kan du stemme, inngå avtaler, bestemme over egne penger, gifte deg og ta førerkort for bil. Fra du er 15 år, er du strafferettslig ansvarlig og bestemmer selv over utdanningen din og om du vil melde deg inn i eller ut av organisasjoner og trossamfunn. Den seksuelle lavalderen er 16 år. Du må være 18 år for å kjøpe tobakk og drikke med under 22 prosent alkohol (som øl og vin), og 20 år for å kjøpe brennevin (22 prosent eller mer). Det er ulovlig å kjøpe alkohol eller tobakk til noen som er under aldersgrensen. Det er vanligvis forbudt å drikke alkohol på offentlig sted etter lokale politivedtekter, røyking har vært forbudt på restauranter og barer siden 2004 (røykeloven), og det er ikke lov å bære kniv på offentlig sted uten en god grunn (for eksempel jobb eller fisketur).'],
  ['Helsekostnader: medisiner, legevakt og sykehjem','Milde smertestillende midler som paracetamol og ibuprofen kan kjøpes i små pakninger i matbutikken og på bensinstasjoner. De fleste andre medisiner selges bare på apoteket, mange bare med resept, og de som jobber på apoteket, gir råd om bruken. Personer med en sykdom som krever behandling i mer enn tre måneder, får medisiner på blå resept og betaler bare en egenandel med et tak. Du betaler egenandel på legevakten på samme måte som hos fastlegen, og det koster mer å gå til spesialist uten henvisning fra fastlegen. Barn får gratis vaksiner gjennom barnevaksinasjonsprogrammet. De som bor på sykehjem, betaler en egenandel ut fra inntekten sin. Tolk hos legen er gratis for pasienten. Ring 113 ved akutt sykdom eller skade, 112 til politiet og 110 til brannvesenet.'],
  ['Vold, sosial kontroll og identitet','Vold er ikke bare slag: Trusler, ydmykelser og kontrollerende oppførsel er psykisk vold. Det er alltid ulovlig å slå barn, og mishandling i nære relasjoner kan straffes med fengsel i inntil seks år (mer i alvorlige tilfeller). Det er minst like skadelig for barn å være vitne til vold i hjemmet som å bli utsatt for vold selv. Negativ sosial kontroll er når familien eller miljøet begrenser friheten til en person, for eksempel ved å bestemme hvem personen skal være sammen med, hva hun skal ha på seg eller hvem hun skal gifte seg med. Det kan hindre unge i å leve et selvstendig liv. I Norge bestemmer ikke kjærester, samboere eller ektefeller over hverandre. Ansatte i mange yrker og i trossamfunn har plikt til å prøve å avverge kjønnslemlestelse (avvergelsesplikt). Brudd på denne plikten kan straffes med bot eller fengsel i inntil ett år. Identiteten formes av personlighet, kjønn og seksualitet: Kjønnsuttrykk er hvordan du viser kjønnet ditt gjennom klær og oppførsel, og seksuell orientering handler om hvem du blir forelsket i og tiltrukket av.'],
  ['Kultur, normer og integrering – viktige ord','Sosialisering er hvordan vi lærer normene, verdiene og språket i et samfunn. Normer er uskrevne regler, mens lover er skrevne regler som kan føre til straff. Integrering betyr å delta i det nye samfunnet og samtidig beholde deler av sin egen kultur. Assimilering betyr å gi slipp på sin egen kultur og bli lik majoriteten. Segregering betyr at grupper lever adskilt med lite kontakt. Kultursjokk er forvirringen man kjenner når man møter en ny kultur, krysspress er å føle seg dratt mellom to kulturer med ulike forventninger, og en kulturkollisjon er når verdiene i to kulturer kommer i konflikt. I Norge regnes religion stort sett som noe privat. Foreldre kan ikke tvinge en religion på barna sine, og fra de er 15 år, bestemmer unge selv. Rasisme og diskriminering er ikke sosialt akseptert og kan anmeldes til politiet.'],
  ['Fattigdom og bolig i tall','Fattigdom i Norge er stort sett relativ fattigdom, det vil si å ha mye mindre penger enn de fleste rundt seg. Absolutt fattigdom betyr at man ikke har råd til grunnleggende behov som mat og bolig. Grupper med høyere risiko for fattigdom er blant andre aleneforsørgere, store familier med tre barn eller flere, unge som bor alene og noen innvandrerfamilier, ofte fordi de har svak tilknytning til arbeidslivet. Det finnes mellom 2,7 og 3 millioner boliger i Norge, og omtrent halvparten av dem er eneboliger. Rundt 82 prosent av husholdningene eier boligen sin. For å få boliglån trenger man vanligvis egenkapital på 10 prosent av kjøpesummen og en stabil inntekt.']
]},
{id:'m3', title:'Norge før og nå', topics:[
  ['Grunnloven av 1814','Norges grunnlov ble undertegnet på Eidsvoll 17. mai 1814. Denne datoen, Grunnlovsdagen, er Norges nasjonaldag – den feires med barnetog i stedet for militærparader.'],
  ['1905 – unionsoppløsningen','Fra 1814 var Norge i union med Sverige. Unionen ble oppløst fredelig i 1905, da Norge ble fullt selvstendig og valgte sin egen konge, Haakon VII.'],
  ['Okkupasjonen og tiden etter','Norge var okkupert av Nazi-Tyskland fra 1940 til 1945. I 1967 ble det første gang funnet olje i Nordsjøen, og i 1969 ble Ekofisk-feltet funnet. Rikdommen dette har gitt, blir i stor grad spart i utlandet gjennom Statens pensjonsfond utland ("Oljefondet") i stedet for å brukes med en gang.'],
  ['Norge, EU og naboland','Norge er ikke medlem av EU, men deltar i EUs indre marked gjennom EØS-avtalen og er en del av Schengen-samarbeidet med åpne grenser.'],
  ['Hvordan det norske demokratiet fungerer','Norge er et konstitusjonelt monarki og et parlamentarisk demokrati, der makten er delt mellom Stortinget (nasjonalforsamlingen, 169 representanter valgt hvert fjerde år), regjeringen (ledet av statsministeren) og uavhengige domstoler. Kong Haakon VIII ble statsoverhode i august 2026, etter at hans far, kong Harald V, døde; rollen er i hovedsak seremoniell. Jonas Gahr Støre (Arbeiderpartiet) fortsatte som statsminister etter valget i september 2025. Stemmerettsalderen er 18 år.'],
  ['Mangfold og det samiske folket','Norge anerkjenner mange familieformer (gift, samboende, aleneforsørgere, familier med to av samme kjønn) og har nasjonale minoriteter som blant annet jøder, kvener, rom og romanifolket/tatere. Samene er et urfolk med sitt eget parlament, Sametinget, som ligger i Karasjok, og har egne språklige og kulturelle rettigheter, særlig i Nord-Norge.'],
  ['Natur, miljø og allemannsretten','Friluftsliv står sentralt i norsk kultur, og støttes av allemannsretten – alles rett til fri ferdsel og opphold i utmark. Norge er sterkt avhengig av fornybar vannkraft og har en av de høyeste andelene elbiler i verden.'],
  ['Likestilling','Norge blir jevnlig rangert blant de mest likestilte landene i verden. Kvinner har hatt stemmerett siden 1913, og foreldrepermisjonen inkluderer en fedrekvote som er forbeholdt fedre.'],
  ['Menneskerettigheter og ytringsfrihet','Grunnloven og internasjonale konvensjoner Norge har ratifisert, beskytter grunnleggende rettigheter, blant annet ytringsfrihet, og likestillings- og diskrimineringsloven forbyr diskriminering på grunnlag av kjønn, etnisitet, religion, funksjonsnedsettelse og seksuell orientering.'],
  ['Religion i Norge','Den norske kirke, som historisk var statskirke, ble formelt skilt fra staten i 2012. Religionsfriheten er grunnlovfestet, og det norske samfunnet er i dag religiøst mangfoldig og i stor grad sekulært i hverdagen.'],
  ['Geografi og befolkning','Norge dekker 385 178 kvadratkilometer, grenser til Sverige, Finland og Russland, og omfatter øygruppen Svalbard. Landet er delt inn i 15 fylker og 357 kommuner. Befolkningen passerte 5,6 millioner i 2025 (opp fra under 3,9 millioner i 1970), i hovedsak drevet av innvandring, og veksten er ventet å nå rundt 6 millioner innen 2040. Om lag tre firedeler av nordmenn bor langs kysten, og halvparten bor på Østlandet. De fire største byene er Oslo (hovedstaden, med rundt 725 000 innbyggere), Bergen, Trondheim og Stavanger. Kystlinjen strekker seg 25 148 km – lenger enn avstanden fra Nordpolen til Sørpolen – med rundt 50 000 øyer. Fjell og vidder dekker om lag halvparten av landet, skog 37 %, og bare 3 % er dyrket mark.'],
  ['Offentlige høytider og tradisjoner','I tillegg til 17. mai omfatter den norske kalenderen offentlige fridager som første nyttårsdag (1. januar), påske (i mars eller april: skjærtorsdag, langfredag, første og andre påskedag – påskeaften er ikke en helligdag), Kristi himmelfartsdag (en torsdag 40 dager etter påske), pinse (10 dager etter Kristi himmelfartsdag) med andre pinsedag som fridag, arbeidernes dag (1. mai, markert med politiske tog) og jul (julaften, første og andre juledag). Enkelte flaggdager markeres, men er ikke fridager: samefolkets dag (6. februar) og kvinnedagen (8. mars, markert i Norge første gang i 1915 og hvert år siden 1972). Nyttårsaften (31. desember) er en familiefeiring, men ikke en offentlig fridag. I tillegg til kalenderen er livsfasehendelser som bursdager, bryllup, dåp, konfirmasjon og begravelser viktige merkedager i norsk liv.'],
  ['Samisk historie og selvstyre','Samene er urfolket ikke bare i Norge, men også i Sverige, Finland og Russland, og regnes som den eldste befolkningsgruppen i landet. Samiske språk er ikke beslektet med norsk, selv om nesten alle norske samer i dag også snakker norsk. Tradisjonelle samiske levebrød omfattet jakt, fangst, fiske og reindrift, som mange samer fortsatt driver med ved siden av moderne yrker. Fra rundt 1850-tallet førte norske myndigheter en fornorskingspolitikk: samiske barn måtte gå på norskspråklige skoler og fikk ikke lære samisk, og en lov fra 1902 forbød personer som ikke snakket norsk, å kjøpe jord i samiske områder – en regel som ikke ble opphevet før i 1965. Sametinget åpnet i 1989, med representanter valgt hvert fjerde år for å ivareta samisk kultur, språk og opplæring. Den samiske nasjonaldrakten, kofta, brukes ved spesielle anledninger som bryllup, og det samiske flagget heises over hele Norge på samefolkets dag, 6. februar.'],
  ['Nasjonale minoriteter og innvandring','I tillegg til samene anerkjenner Norge fem andre grupper som nasjonale minoriteter med århundrelang tilknytning til landet: jøder, kvener/norskfinner, skogfinner, rom og romanifolket/tatere. Norge ratifiserte i 1999 en europeisk avtale som beskytter nasjonale minoriteters rettigheter, og forpliktet seg dermed til å bidra til å bevare deres språk, religion, tradisjoner og kultur. Når det gjelder innvandring, er over én million av dem som bor i Norge i dag, enten født i utlandet eller født i Norge av to utenlandsfødte foreldre; de største gruppene kommer fra Polen, Litauen, Ukraina, Sverige og Syria, og de fleste innvandrere bor i byer heller enn på landsbygda. Mellom 1820 og 1930 var derimot Norge et utvandringsland: av mer enn 30 millioner europeere som flyttet til Amerika i denne perioden, var rundt 800 000 nordmenn. Mange innvandrere har norsk statsborgerskap, det bor innvandrere i alle kommuner, og gode norskkunnskaper er en nøkkel til integrering.'],
  ['Norge i forhistorien – fra steinalder til vikingtid','De første menneskene kom til Norge for rundt 12 000 år siden, trolig over isen etter hvert som innlandsisen trakk seg tilbake, og levde av fisk, vilt, bær og sopp og brukte redskaper av stein, bein og tre i steinalderen (10 000–2000 f.Kr.); jordbruk startet for rundt 4 000 år siden. I bronsealderen (1800–500 f.Kr.), da klimaet var mildere enn i dag, skaffet rike bønder seg redskaper, våpen og smykker av bronse, begynte å bruke hest som trekkdyr, og kvinnene lærte å spinne og veve tøy av saueull. I jernalderen (500 f.Kr.–1050 e.Kr.), da klimaet ble likt det vi har i dag, lærte folk å lage jern av myrmalm, noe som ga bedre redskaper og økt matproduksjon og folketall. I vikingtiden (om lag 800–1050 e.Kr.), fra slutten av 700-tallet, ledet mektige høvdinger tokt, handel og bosetting i utlandet; Harald Hårfagre ble den første kongen av et samlet Norge rundt 872. Det avgjørende vendepunktet for kristendommen kom i slaget på Stiklestad i 1030, der den kristne kongen Olav Haraldsson ble drept i kamp mot hedenske høvdinger – Olav ble senere erklært helgen, og kristendommen erstattet gradvis den norrøne religionen.'],
  ['Middelalderen, Svartedauden og unionen med Danmark','Etter at Olav Haraldsson døde i 1030, ble han gjort til helgen, de mektige bøndene og høvdingene ble kristne og vanlige folk fulgte etter, og kirken fikk stor makt og krevde skatt og jord. Norges befolkning vokste fra rundt 150 000 til 400 000 mellom år 1000 og 1300, men omtrent halvparten av barna døde før de ble ett år gamle, og mange kvinner døde i barsel. Svartedauden, en pestpandemi som nådde Norge på midten av 1300-tallet, tok livet av om lag en tredel av befolkningen – et av de mest alvorlige demografiske sjokkene i norsk historie. Gjennom middelalderen betalte bøndene i økende grad skatt til kirke, konge og adel i stedet for å eie sin egen jord, og Norges første byer – Bergen (den gang Bjørgvin), Trondheim (Nidaros), Oslo, Stavanger og Tønsberg – ble grunnlagt i denne perioden. I Europa døde rundt halvparten av befolkningen av svartedauden. Fra 1397 gikk Norge inn i en union med Danmark og Sverige; etter at Sverige trådte ut, varte unionen med Danmark helt til 1814, med København som politisk og kulturelt sentrum og dansk som skriftspråk. I 1517 protesterte den tyske munken Martin Luther mot makten til den katolske kirken (tilhengerne ble kalt protestanter); den danske kongen gikk over til protestantismen, og den ble kort tid etter Norges statsreligion og forble det til statskirkeordningen opphørte i 2012.'],
  ['Nasjonalromantikken og nynorsk','På midten av 1800-tallet oppmuntret en europeisk nasjonalromantisk bevegelse landene til å dyrke sin egenart; i Norge innebar dette å løfte fram dramatisk natur og folkelige bondetradisjoner gjennom litteratur, maleri og musikk. Fordi det norske skriftspråket i århundrer hadde vært basert på dansk, reiste språkforskeren Ivar Aasen rundt i landet og samlet inn dialektprøver for å bygge en alternativ skriftnorm forankret i norsk talemål – dette ble nynorsk, som fortsatt er en av Norges to offisielle skriftlige målformer ved siden av bokmål (samisk er også et offisielt språk).'],
  ['Industrialisering, utvandring og arbeiderbevegelsen','På midten av 1800-tallet levde om lag 70 % av nordmennene på landsbygda av jordbruk og fiske; etter hvert som befolkningen vokste raskere enn tilgangen på jord og arbeid, flyttet folk til byene for å arbeide i fabrikker – byandelen økte fra om lag 15 % før 1850 til 35 % innen 1900 (i dag bor rundt 80 % i byer og tettsteder), ofte til lange arbeidsdager og trange boforhold, med utbredt barnearbeid; i 1900 jobbet 23 % av alle yrkesaktive i industrien. Rundt 800 000 nordmenn utvandret til Amerika mellom 1850 og 1920 i håp om bedre muligheter. Den norske arbeiderbevegelsen organiserte seg fra 1880-årene og fikk reell innflytelse fra tidlig på 1900-tallet, og vant fram med kortere arbeidstid (Stortinget bestemte først at ingen skulle jobbe mer enn ti timer om dagen, og i 1919 ble dette endret til åtte timer), regler for sikkerhet på arbeidsplassen og sykepenger; om lag halvparten av norske arbeidstakere er fortsatt fagorganisert i dag.'],
  ['Kvinners stemmerett og kvinnebevegelsen','Norske menn fikk allmenn stemmerett i 1898; kvinner fikk den samme retten i 1913 (begge den gang fra 25 år), blant de tidligste i verden. Den organiserte kvinnebevegelsen, aktiv fra 1880-årene, fikk ny kraft på 1970-tallet og vant fram med rettigheter som tilgang til skilsmisse, prevensjon og selvbestemmelse over egen kropp – abortloven av 1976 ga kvinner rett til selvbestemt abort (fram til uke 12), og en ny abortlov fra 2025 gir rett til abort før uke 19 i svangerskapet. Menn og kvinner har i dag formelt like rettigheter til utdanning, arbeid, eiendom, arv og helsetjenester, men det finnes fortsatt forskjeller: kvinner utgjør nesten halvparten av arbeidsstyrken, men innehar bare rundt en tredel av lederstillingene og jobber langt oftere deltid enn menn.'],
  ['Første verdenskrig og mellomkrigstiden','Norge holdt seg nøytralt under første verdenskrig (1914–1918), men krigen førte likevel til mangel på varer som korn, kaffe og sukker, og dermed rasjonering. Mellomkrigstiden, tiden mellom de to verdenskrigene, var preget av finanskrise og utbredt arbeidsledighet i Norge.'],
  ['Andre verdenskrig i Norge','Tyskland gikk til angrep på Norge 9. april 1940; etter noen ukers kamper kapitulerte Norge, og kongen og regjeringen flyktet til England, mens Vidkun Quisling ledet en ikke-valgt, tyskvennlig regjering – navnet hans ble et internasjonalt begrep for en kollaboratør/landssviker. Motstandsarbeidet omfattet sabotasje og illegale aviser, og rundt 50 000 nordmenn flyktet til det nøytrale Sverige under krigen. På Hitlers ordre brente tyske styrker under retretten ned det meste av Finnmark og Nord-Troms i 1944–45. Mer enn 10 000 nordmenn døde som følge av krigen. Av de om lag 2 100 jødene som bodde i Norge før krigen, ble 773 deportert til konsentrasjonsleirer, og bare 38 overlevde og vendte tilbake.'],
  ['Olje, internasjonalt samarbeid og velferdsstaten','Olje ble første gang funnet i Nordsjøen på slutten av 1960-tallet og gjorde Norge til en velstående "oljenasjon", selv om selve ressursen fortsatt er offentlig eiendom mens selskapene kjøper tidsbegrensede rettigheter til å lete etter og utvinne olje – et system som fortsatt debatteres på grunn av miljøkonsekvensene. Det moderne Norge deltar i internasjonalt samarbeid gjennom FN, NATO og EØS (men ikke EU selv), og landets rikdom og velferdssystem hviler på naturressurser – fisk, skog, olje, vannkraft og vind – sammen med prinsippet om at staten garanterer utdanning, helsetjenester og økonomisk støtte til alle som trenger det.'],
  ['Forvaltningsstruktur og maktfordeling','Norges 15 fylker og 357 kommuner er hver et folkevalgt nivå av selvstyre som opererer innenfor nasjonale rammer. Staten fastsetter utenrikspolitikken, driver sykehus, vedtar lover og fastsetter læreplaner for skolen; fylkene driver videregående skoler og fylkesveier; kommunene driver grunnskoler, barnehager, eldreomsorg, renovasjon og vann/avløp, samt lokale veier. Makten er også delt i tre på nasjonalt nivå: Stortinget vedtar lover (lovgivende makt), regjeringen foreslår og iverksetter dem (utøvende makt), og uavhengige domstoler dømmer i saker etter disse lovene (dømmende makt) – en maktfordeling som skal hindre at én statsmakt får for mye makt.'],
  ['Valg og politiske partier','Norge holder valg hvert annet år, vekslende mellom stortingsvalg og lokalvalg til fylkes- og kommunestyrer, hver for en fireårsperiode. Rundt tjue politiske partier stiller til valg, og de kan plasseres på en skala fra «sosialistisk» til «borgerlig». Partiene vedtar et partiprogram på landsmøtet sitt, der de skriver hvilke saker de vil jobbe med i den neste fireårige valgperioden. Stemmerettsalderen er 18 år. For å stemme ved stortingsvalg må du være norsk statsborger, og for å stemme ved kommune- og fylkestingsvalg må du ha bodd i Norge de siste tre årene før valget. Som ved alle norske valg foregår stemmegivningen hemmelig, så ingen er forpliktet til å avsløre hvilket parti de stemte på.'],
  ['Menneskerettigheter – det internasjonale rammeverket','Menneskerettigheter er universelle – rettigheter alle har rett og slett fordi de er mennesker, uansett hvor de bor eller hvilken religion eller etnisitet de tilhører. FNs verdenserklæring om menneskerettigheter ble vedtatt i 1948 og er siden blitt sluttet opp om av alle FNs medlemsland, og mye av den er skrevet inn i norsk lov. Blant kjerneprinsippene: alle er født frie og med samme menneskeverd og rettigheter; alle har de samme rettighetene uansett kjønn, religion, rase, politisk oppfatning eller nasjonalitet; tortur er forbudt i alle former; alle har rett til en rettferdig rettergang; og innbyggere har rett til å stemme i frie valg med hemmelig stemmegivning.'],
  ['Demokratiske rettigheter og plikter','Demokratiet i Norge bygger på rettigheter som følges av plikter. Ytringsfriheten lar folk diskutere og publisere meninger om politikk og religion uten å bli straffet, men rasistiske eller hatefulle ytringer er forbudt ved lov. Fra fylte 15 år kan man fritt melde seg inn i eller ut av et tros- eller livssynssamfunn. Folk kan melde seg inn i politiske partier, fagforeninger og andre organisasjoner, og holde lovlige demonstrasjoner, uten frykt for forfølgelse; fagforeninger kan også streike under visse omstendigheter. Ingen kan fengsles uten en rettssak for en uavhengig dommer, og enhver tiltalt har rett til et forsvar. Til gjengjeld forventes det at innbyggerne følger demokratisk vedtatte lover og søker endring gjennom demokratiske midler – det norske samfunnet bygger i stor grad på gjensidig tillit mellom innbyggere og myndigheter. Trusler mot dette systemet er lav valgdeltakelse, svekket tillit til politikerne, falske nyheter og hatprat som stanser den åpne samfunnsdebatten, store nasjonale kriser som gjør at man går forbi de demokratiske prosessene, og lover og regler for flere land som går foran et lands demokratisk vedtatte lover. Demokrati betyr «folkestyre» (fra gresk): flertallet bestemmer, men flertallet skal ta hensyn til mindretallets meninger. Ytringsfriheten gjelder både for privatpersoner og for radio, tv og aviser.'],
  ['Likestillings- og diskrimineringsloven','Likestilling i Norge betyr prinsippet om at alle har samme verdi uavhengig av kjønn, alder, funksjonsnedsettelse, kulturell bakgrunn, etnisitet eller seksuell orientering. Siden kvinnekampen på 1970-tallet har kvinners yrkesdeltakelse økt kraftig, selv om det fortsatt er forskjeller i lederstillinger og studievalg. Sentrale lover som beskytter likestilling er likestillings- og diskrimineringsloven, ekteskapsloven og arveloven, i tillegg til straffeloven § 185 – som noen ganger kalles "rasismeparagrafen" – som forbyr diskriminerende eller hatefulle ytringer basert på etnisitet, hudfarge, religion, seksuell orientering, kjønnsidentitet eller funksjonsnedsettelse.'],
  ['Natur og naturressurser','Mye av Norges rikdom det siste hundreåret kommer fra naturressurser: fisk, skog, olje, vannkraft fra elver og fossefall, og i økende grad vindkraft. Aluminium, som produseres ved hjelp av store mengder billig vannkraft, er en viktig eksportvare, sammen med fisk og tømmer (som bearbeides til papir og byggematerialer, eller eksporteres rått).'],
  ['Allemannsretten – reglene i detalj','Allemannsretten lar alle gå eller gå på ski fritt over utmark – strender, skog, myr og fjell – og hvile hvor som helst underveis. Å telte på samme sted i mer enn to netter krever grunneierens tillatelse, og teltet må settes opp minst 150 meter fra hus eller hytter. Brukere må unngå å skade dyr, ødelegge naturen eller etterlate søppel, og det er forbudt å tenne bål i eller nær skog fra 15. april til 15. september (engangsgriller er tillatt med forsiktighet). Det er fritt å plukke bær, sopp og viltvoksende blomster; fiske og jakt er også tillatt, men krever vanligvis lisens.'],
  ['Bærekraftig utvikling og FNs bærekraftsmål','FNs bærekraftsmål er en felles global plan som innen 2030 tar sikte på å utrydde fattigdom, redusere ulikhet og stanse klimaendringene. Klima er gjennomsnittsværet målt over lang tid, og skiller seg fra vær fra dag til dag, og den internasjonale vitenskapelige konsensusen er at menneskeskapte CO2-utslipp – ikke naturlige variasjoner – er hoveddrivkraften bak stigende temperaturer, smeltende is, hav som stiger og blir surere, og mer ekstremvær. Ressurser er enten fornybare – som dyr, planter, vind, regn og sollys, som fornyer seg dersom de brukes bærekraftig – eller ikke-fornybare, som olje, gass og kull, som ikke gjør det. Å spise lokalprodusert mat reduserer transportrelaterte utslipp og gjør det lettere å ha oversikt over hvordan maten dyrkes, blant annet bruk av sprøytemidler og antibiotika og dyrevelferd.'],
  ['Kildesortering, avfall og utslipp','Naturvern og miljøvern betyr å begrense skaden på økosystemer og reparere skaden mennesker forårsaker, slik at dyr, planter og mennesker også i framtiden har gode levekår. Nordmenn bruker i økende grad ting om igjen fra bruktmarkedet – bruktsalg av klær og møbler har vokst raskt – og resirkulerer materialer til nye produkter, mens kommunale kildesorteringsordninger sorterer husholdningsavfall og egne gjenbruksstasjoner tar imot møbler, hvitevarer og maling. Hver nordmann produserer flere hundre kilo avfall i året, og Norge kaster årlig rundt 400 000 tonn spiselig mat – en del av den globale tredelen av all mat som produseres, som går til spille. Norges viktigste kilder til klimagassutslipp er olje- og gassproduksjon, industri, bergverk og veitrafikk, selv om det i 2024 for første gang var flere elbiler enn bensinbiler registrert i Norge.'],
  ['Geografi du bør huske','Det sørligste punktet i Norge er Lindesnes, og det nordligste er Knivskjellodden ved Nordkapp. Den lengste fjorden er Sognefjorden, som er 204 kilometer lang og opptil 1308 meter dyp. Det er rundt 450 000 innsjøer (den største er Mjøsa) og rundt 20 000 elver (den lengste er Glomma, over 600 kilometer). Fossene er viktige for kraftproduksjonen. Den største isbreen er Jostedalsbreen, rundt 487 kvadratkilometer, og isbreene i Norge smelter mer og mer for hvert år. Golfstrømmen bringer varmt vann fra det sørlige Atlanterhavet opp langs kysten, så Norge er varmere enn breddegraden skulle tilsi. Norge har fire årstider, og temperaturen har vært fra pluss 35,6 grader (Nesbyen, 1970) til minus 51,4 grader (Karasjok, 1886). I Nord-Norge er vintrene lange, kalde og mørke, med midnattssol om sommeren, og det regner mer på Vestlandet enn på Østlandet. Etter Oslo er de største byene Bergen, Trondheim og Stavanger.'],
  ['Fra 1814 til 1905 – detaljene','Danmark-Norge sto på Frankrikes side i Napoleonskrigene, og da Frankrike tapte, måtte Danmark gi fra seg Norge til Sverige i 1814. Våren 1814 møttes 112 menn på Eidsvoll og skrev Norges grunnlov, som ble underskrevet 17. mai. Norge ble likevel tvunget inn i en union med Sverige i november 1814, men denne unionen var løsere enn unionen med Danmark: Norge fikk beholde grunnloven (med noen endringer), sin egen nasjonalforsamling, Stortinget (grunnlagt i 1814), og indre selvstyre, mens utenrikspolitikken ble styrt fra Sverige og kongen var svensk. Kong Karl Johan, som hovedgata i Oslo, Karl Johans gate, har navn etter, var en av kongene i unionstiden. 7. juni 1905 erklærte Stortinget at den svenske kongen ikke lenger var Norges konge. Reaksjonene i Sverige var voldsomme, og det brøt nesten ut krig, men to folkeavstemninger samme år bekreftet bruddet med Sverige og valgte monarki, og den svenske kongen godtok resultatet. Den danske prins Carl ble kong Haakon 7. (1905–1957). Etter ham kom Olav 5. (1957–1991), Harald 5. (1991–2026) og Haakon 8., som ble konge i august 2026.'],
