<title>Know Norway</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24303a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Layout: one-column phone app — sticky top bar, scrolling panel, fixed bottom tab bar with thumb-sized targets. */
  :root{
    --ink:#1c2320; --ink-soft:#4b5650; --ink-faint:#6f7a73;
    --paper:#f2efe4; --surface:#ffffff; --surface-2:#e9e4d4; --line:#d8d2c0;
    --board-bg:#14181a; --board-fg:#e7a53f; --board-sub:#c99a4f;
    --accent:#2f6a85; --accent-ink:#1f4a5e; --accent-soft:#d9e6ea; --deep:#24303a; --deep-fg:#eef1f3;
    --good:#2f7a4c; --bad:#a3352f; --on-accent:#ffffff;
    --font-display:'Fraunces',Georgia,serif; --font-body:'Karla',system-ui,-apple-system,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --radius-m:14px; --radius-l:20px;
    --shadow-card:0 1px 2px rgba(28,35,32,.06), 0 6px 20px -10px rgba(28,35,32,.2);
    --nav-h:56px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eef0ea; --ink-soft:#b9c0b6; --ink-faint:#8d978f;
      --paper:#181b16; --surface:#20241f; --surface-2:#2a2e26; --line:#383d33;
      --board-bg:#0d0f10; --board-fg:#f0b34c; --board-sub:#c99a4f;
      --accent:#7bb2c9; --accent-ink:#cfe4ec; --accent-soft:#1d2e34; --deep:#141c22; --deep-fg:#eef1f3;
      --good:#5cbf85; --bad:#e07272; --on-accent:#0f1a20;
      --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 6px 20px -10px rgba(0,0,0,.5);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#eef0ea; --ink-soft:#b9c0b6; --ink-faint:#8d978f;
    --paper:#181b16; --surface:#20241f; --surface-2:#2a2e26; --line:#383d33;
    --board-bg:#0d0f10; --board-fg:#f0b34c; --board-sub:#c99a4f;
    --accent:#7bb2c9; --accent-ink:#cfe4ec; --accent-soft:#1d2e34; --deep:#141c22; --deep-fg:#eef1f3;
    --good:#5cbf85; --bad:#e07272; --on-accent:#0f1a20;
    --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 6px 20px -10px rgba(0,0,0,.5);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:16px; margin:0; line-height:1.5; -webkit-tap-highlight-color:transparent; overflow-x:hidden;}
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance; font-weight:600; margin:0;}
  button{font-family:inherit; font-size:inherit; color:inherit; touch-action:manipulation;}
  button:focus-visible,summary:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  [hidden]{display:none !important;}
  @media (prefers-reduced-motion: reduce){ *{transition-duration:0.001ms !important; animation-duration:0.001ms !important; scroll-behavior:auto !important;} }
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}

  /* top bar */
  .appbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--paper); border-bottom:1px solid var(--line);}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 16px;}
  .brand{display:flex; align-items:center; gap:10px; min-width:0; background:none; border:none; padding:0; cursor:pointer; color:inherit;}
  .brand-mark{width:30px; height:30px; flex:0 0 auto; border-radius:8px; background:var(--deep); color:var(--deep-fg); display:flex; align-items:center; justify-content:center;}
  .brand-mark svg{width:18px; height:18px;}
  .brand-name{font-family:var(--font-display); font-weight:600; font-size:1.08rem; white-space:nowrap;}
  .mini-countdown{font-family:var(--font-mono); font-size:.74rem; color:var(--ink-soft); white-space:nowrap; font-variant-numeric:tabular-nums;}
  .mini-countdown b{color:var(--ink); font-size:.9rem;}
  button.mini-countdown{background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 10px; min-height:32px; cursor:pointer;}
  .board[role="button"]{cursor:pointer;}
  .board[role="button"]:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  .date-dialog{border:none; border-radius:var(--radius-l); padding:20px; width:min(92vw,380px); background:var(--surface); color:var(--ink); box-shadow:var(--shadow-card);}
  .date-dialog::backdrop{background:rgba(0,0,0,.45);}
  .date-dialog h2{margin:0 0 6px; font-size:1.25rem;}
  .date-dialog p{margin:0 0 14px; color:var(--ink-soft); font-size:.92rem;}
  .date-dialog label{display:block; font-family:var(--font-mono); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px;}
  .date-dialog input{width:100%; box-sizing:border-box; min-height:48px; padding:10px 12px; font-size:1rem; border:1px solid var(--line); border-radius:var(--radius-m); background:var(--paper); color:var(--ink);}
  .date-actions{display:flex; gap:10px; margin-top:16px;}
  .date-actions .btn{flex:1;}

  /* main column */
  main{max-width:640px; margin:0 auto; padding-inline:16px; padding-block:18px calc(env(safe-area-inset-bottom,0px) + 28px);}
  .panel{display:flex; flex-direction:column; gap:16px;}
  .panel-head h1{font-size:1.6rem; line-height:1.2;}
  .panel-head p{margin:6px 0 0; color:var(--ink-soft); font-size:.95rem;}
  .eyebrow{font-family:var(--font-mono); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px;}

  /* departure-board countdown */
  .board{background:var(--board-bg); border-radius:var(--radius-l); padding:18px; color:var(--board-fg); display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow-card);}
  .board-row{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px;}
  .board-label{font-family:var(--font-mono); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--board-sub);}
  .board-window{font-family:var(--font-mono); font-size:.74rem; color:var(--board-sub);}
  .board-digits{display:flex; gap:5px;}
  .board-cell{font-family:var(--font-mono); font-weight:700; font-size:2.6rem; background:linear-gradient(#1d2224,#101314); color:var(--board-fg);
    border-radius:6px; width:1.15em; text-align:center; position:relative; line-height:1.3; box-shadow:inset 0 0 0 1px #000;}
  .board-cell::after{content:""; position:absolute; left:0; right:0; top:50%; height:2px; background:#000; opacity:.55;}
  .board-status{font-family:var(--font-mono); font-size:.8rem; color:var(--board-fg); opacity:.85;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px; box-shadow:var(--shadow-card);}
  .card h3{font-size:1.05rem; margin-bottom:8px;}
  .card p{margin:0; color:var(--ink-soft); font-size:.92rem;}

  .stat-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stat-tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px;}
  .stat-tile .num{font-family:var(--font-mono); font-size:1.4rem; font-weight:700; font-variant-numeric:tabular-nums;}
  .stat-tile .lbl{font-size:.78rem; color:var(--ink-soft); margin-top:2px;}

  .start-list{display:flex; flex-direction:column; gap:10px;}
  .start-item{display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px 16px; cursor:pointer; min-height:64px;}
  .start-item:active{background:var(--surface-2);}
  .start-item .si-icon{width:40px; height:40px; flex:0 0 auto; border-radius:10px; background:var(--accent-soft); color:var(--accent-ink); display:flex; align-items:center; justify-content:center;}
  .start-item .si-icon svg{width:22px; height:22px;}
  .start-item .si-body{flex:1; min-width:0;}
  .start-item .si-title{font-weight:700; font-size:.98rem;}
  .start-item .si-sub{font-size:.82rem; color:var(--ink-soft);}
  .start-item .si-go{color:var(--ink-faint); font-size:1.2rem;}

  .hist-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:.9rem;}
  .hist-row:last-child{border-bottom:none;}
  .hist-row .h-label{flex:1; min-width:0; font-weight:600;}
  .hist-row .h-date{font-family:var(--font-mono); font-size:.72rem; color:var(--ink-faint);}
  .hist-row .h-score{font-family:var(--font-mono); font-weight:700; width:58px; text-align:right; font-variant-numeric:tabular-nums;}
  .empty{color:var(--ink-faint); font-size:.9rem; margin:0;}

  /* chips: horizontal scroll strip on phones */
  .chip-strip{display:flex; flex-direction:column; gap:8px;}
  .chip{display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius-m); padding:12px 14px; min-height:52px; font-size:.95rem; font-weight:600; cursor:pointer; color:var(--ink);}
  .chip .chip-no{flex:0 0 auto; width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:.8rem; font-weight:700;}
  .chip .chip-t{flex:1; min-width:0;}
  .chip.active .chip-no{background:var(--on-accent); color:var(--accent);}
  .chip.active{background:var(--accent); color:var(--on-accent); border-color:transparent;}

  /* study accordion */
  .module-intro{font-size:.88rem; color:var(--ink-soft); margin:0;}
  .topic{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden;}
  .topic summary{list-style:none; cursor:pointer; padding:15px 16px; display:flex; align-items:center; gap:12px; min-height:52px;}
  .topic summary::-webkit-details-marker{display:none;}
  .topic summary h3{flex:1; min-width:0; font-size:1rem; color:var(--accent-ink);}
  .topic summary .chev{flex:0 0 auto; color:var(--ink-faint); transition:transform .15s ease;}
  .topic[open] summary .chev{transform:rotate(90deg);}
  .topic .t-body{padding:0 16px 16px; margin:0; font-size:.95rem; color:var(--ink-soft); line-height:1.6;}
  .study-tools{display:flex; gap:8px;}
  .study-tools .btn{flex:1;}

  /* buttons */
  .btn{border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:12px 18px; min-height:48px; font-size:.95rem; font-weight:700; cursor:pointer;}
  .btn:active{background:var(--surface-2);}
  .btn-primary{background:var(--accent); color:var(--on-accent); border-color:transparent;}
  .btn-primary:active{filter:brightness(.92); background:var(--accent);}
  .btn-block{width:100%;}
  .btn-small{min-height:40px; padding:8px 14px; font-size:.85rem;}
  .btn-row{display:flex; flex-direction:column; gap:10px;}

  /* quiz */
  .quiz-top{display:flex; align-items:center; gap:12px;}
  .quiz-progress{flex:1; font-family:var(--font-mono); font-size:.76rem; color:var(--ink-faint); font-variant-numeric:tabular-nums;}
  .quiz-timer{font-family:var(--font-mono); font-size:.8rem; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink-soft);}
  .quiz-timer.over{color:var(--bad);}
  .quit-btn{background:none; border:1px solid var(--line); border-radius:999px; padding:6px 12px; min-height:36px; font-size:.78rem; font-weight:600; color:var(--ink-soft); cursor:pointer;}
  .quit-btn.armed{border-color:var(--bad); color:var(--bad);}
  .bar{height:6px; background:var(--surface-2); border-radius:999px; overflow:hidden;}
  .bar span{display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .2s ease;}
  .quiz-q{font-family:var(--font-display); font-size:1.22rem; font-weight:600; line-height:1.35; text-wrap:pretty;}
  .opts{display:flex; flex-direction:column; gap:10px;}
  .opt{display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius-m); padding:14px 16px; min-height:56px; cursor:pointer; font-size:1rem; line-height:1.4;}
  .opt:active:not([disabled]){background:var(--surface-2);}
  .opt .letter{font-family:var(--font-mono); font-weight:700; color:var(--accent-ink); flex:0 0 auto; width:1.2em;}
  .opt.correct{border-color:var(--good); background:color-mix(in srgb, var(--good) 14%, var(--surface));}
  .opt.wrong{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, var(--surface));}
  .opt[disabled]{cursor:default; color:var(--ink);}
  .explain{background:var(--surface-2); border-radius:12px; padding:14px; font-size:.93rem; line-height:1.5;}
  .explain b{display:block; margin-bottom:2px;}
  .explain.good b{color:var(--good);} .explain.bad b{color:var(--bad);}
  .next-bar{position:sticky; bottom:calc(env(safe-area-inset-bottom,0px) + 12px); z-index:5;}
  .next-bar .btn{box-shadow:var(--shadow-card);}
  .result{text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center;}
  .result-score{font-family:var(--font-mono); font-size:3rem; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1;}
  .result-pass{font-size:.95rem; font-weight:600;}
  .result-pass.good{color:var(--good);} .result-pass.bad{color:var(--bad);}
  .miss-list{display:flex; flex-direction:column; gap:8px; text-align:left; width:100%;}
  .miss-list h3{font-size:1rem;}
  .miss-item{border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:12px 14px; font-size:.9rem; color:var(--ink-soft);}
  .miss-item b{display:block; color:var(--ink); margin-bottom:4px;}
  .miss-item .ans{display:block; color:var(--good); font-weight:600; margin-bottom:4px;}

  /* bottom tab bar */
  .tabbar{display:grid; grid-template-columns:repeat(4,1fr); max-width:640px; margin:0 auto; padding:0 8px;}
  .tabbar button{background:none; border:none; border-bottom:3px solid transparent; height:var(--nav-h); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:.68rem; font-weight:700; color:var(--ink-faint); cursor:pointer; padding:0 2px;}
  .tabbar button svg{width:24px; height:24px;}
  .tabbar button[aria-current="page"]{color:var(--accent); border-bottom-color:var(--accent);}
  .back-home{margin-top:8px;}
  .tabbar button[aria-current="page"] svg{stroke-width:2.4;}

  footer.note{color:var(--ink-faint); font-size:.78rem; margin-top:8px;}
  @media (min-width:560px){ .stat-row.four{grid-template-columns:repeat(4,1fr);} .board-cell{font-size:3.2rem;} }
</style>
<style>
  .lang-switch{display:flex; flex:0 0 auto; border:1px solid var(--line); border-radius:999px; padding:2px; background:var(--surface);}
  .lang-switch button{border:none; background:none; border-radius:999px; min-width:44px; min-height:34px; padding:0 10px; font-family:var(--font-mono); font-size:.76rem; font-weight:700; color:var(--ink-soft); cursor:pointer;}
  .lang-switch button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent);}
  .top-right{display:flex; align-items:center; gap:10px; min-width:0;}
  @media (max-width:360px){ .mini-countdown{display:none;} }
  .no-name{display:block; font-family:var(--font-mono); font-size:.72rem; letter-spacing:.04em; color:var(--ink-faint); margin-bottom:2px;}
</style>

<div class="appbar">
<header class="topbar">
  <button class="brand" id="brandHome" data-go="home">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M24 6 6 16h36L24 6Z" stroke-linejoin="round"/><path d="M10 16v20M38 16v20M18 20v14M30 20v14"/><path d="M5 40h38" stroke-linecap="round"/></svg></span>
    <span class="brand-name" data-i18n="brand"></span>
  </button>
  <div class="top-right">
    <button type="button" class="mini-countdown" id="miniCountdown"></button>
    <div class="lang-switch" role="group" aria-label="Language / Språk">
      <button id="langEn" data-lang="en" aria-pressed="true">EN</button>
      <button id="langNo" data-lang="no" aria-pressed="false">NO</button>
    </div>
  </div>
</header>
<nav class="tabbar">
  <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg><span data-i18n="navHome"></span></button>
  <button data-tab="study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg><span data-i18n="navStudy"></span></button>
  <button data-tab="mock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span data-i18n="navMock"></span></button>
  <button data-tab="all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span data-i18n="navAll"></span></button>
</nav>

<main>
  <div class="card" id="noScript" style="border-color:var(--bad);"><h3>The page could not start</h3><p id="noScriptMsg">Scripts are turned off for this page, so the text and buttons cannot load. Open the claude.ai link in Chrome or Safari while signed in, and check that JavaScript is allowed in the browser settings.</p><p id="noScriptErr" class="mono" style="margin-top:8px;font-size:.8rem;color:var(--bad);word-break:break-word;" hidden></p></div>
  <script>
    (function(){
      var box=document.getElementById('noScript'), msg=document.getElementById('noScriptMsg'), err=document.getElementById('noScriptErr');
      msg.textContent='Loading… If this message stays, the study content failed to load on this device. Send the line below to get it fixed.';
      err.hidden=false; err.textContent='Script ran: step 1 of 2. Browser: '+navigator.userAgent;
      window.addEventListener('error', function(e){ box.hidden=false; err.hidden=false; err.textContent='Error: '+(e.message||e)+' (line '+(e.lineno||'?')+'). Browser: '+navigator.userAgent; });
    })();
  </script>
  <!-- HOME -->
  <section class="panel" id="p-home">
    <div class="panel-head">
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="h1"></h1>
      <p data-i18n="lede"></p>
    </div>
    <div class="board" id="countdownBoard" role="button" tabindex="0">
      <div class="board-row"><span class="board-label" data-i18n="nextTest"></span><span class="board-window" id="boardWindow"></span></div>
      <div class="board-row" style="align-items:center;"><div class="board-digits" id="boardDigits"></div><div class="board-status" id="boardStatus"></div></div>
    </div>
    <div class="stat-row four" id="homeStats"></div>
    <div class="start-list">
      <button class="start-item" data-go="study">
        <span class="si-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg></span>
        <span class="si-body"><span class="si-title" data-i18n="goStudyT"></span><br><span class="si-sub" data-i18n="goStudyS"></span></span><span class="si-go">›</span>
      </button>
      <button class="start-item" data-go="mock">
        <span class="si-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg></span>
        <span class="si-body"><span class="si-title" data-i18n="goMockT"></span><br><span class="si-sub" data-i18n="goMockS"></span></span><span class="si-go">›</span>
      </button>
      <button class="start-item" data-go="all">
        <span class="si-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span>
        <span class="si-body"><span class="si-title" data-i18n="goAllT"></span><br><span class="si-sub" data-i18n="goAllS"></span></span><span class="si-go">›</span>
      </button>
    </div>
    <div class="card">
      <h3 data-i18n="recent"></h3>
      <div id="homeHistory"></div>
    </div>
    <footer class="note" data-i18n="footer"></footer>
  </section>

  <!-- STUDY -->

<script>
const CIVIC_MODULES = [
  {id:'m1', title:'Utdanning, kompetanse og arbeidsliv', topics:[
    ['Right to education','Children have both a right and a duty to attend grunnskole (primary and lower secondary school) from age 6 to 16, free of charge. Upper secondary school (videregående) is a right for young people aged 16–19, and adults also have rights to further education, including Norwegian language training.'],
    ['Working life and unions','Most employees can join a fagforening (labour union). Collective agreements (tariffavtaler) set pay and conditions in many sectors, and Norway has one of the highest union membership rates in the world. The Working Environment Act (arbeidsmiljøloven) protects working hours, health and safety, and against unfair dismissal.'],
    ['Tax-financed welfare','Schools, healthcare, and NAV benefits (unemployment, sick pay, pension) are financed mainly through taxes. Norway uses a progressive income tax system as the backbone of its welfare state (velferdsstaten).'],
    ['Personal data and copyright','Personal data is protected by law — you generally need a legal basis or someone’s consent to collect or share their information, including photos. Creative works (åndsverk) are automatically protected by copyright; copying them without permission is not allowed.'],
    ['Digital literacy and critical thinking','Kildekritikk — critically evaluating information sources — matters for spotting misinformation online. Many Norwegian public services are digital-first, and BankID is widely used to log in securely.'],
    ['School values and cooperation','Norwegian schools value cooperation and equality between pupils; physical punishment of pupils is illegal. Foreldresamarbeid (parent–school cooperation), such as parent-teacher conferences, is a normal part of school life.'],
    ['Where to learn Norwegian','Beyond formal courses, workplaces, libraries, and everyday interactions all count as valuable arenas for learning the language.'],
    ['Kindergartens (barnehage)','All activities in a barnehage are governed by the Kindergarten Act and are meant to build on Christian and humanist values, human rights, and respect for nature. Running a kindergarten is expensive; the municipality covers most of the cost and the Storting sets a maximum price (maksepris) for what parents pay, with a lower price for siblings (søskenmoderasjon) and reduced payment or free core hours for low-income families. Parents who don’t speak Norwegian have the right to an interpreter at parents’ meetings (foreldremøter).'],
    ['Primary and lower secondary school facts','All children have a right to 13 years of education in total; the ten years of grunnskole (grades 1–10) are compulsory and free. Children start school in August of the year they turn six, move up automatically every year with no repeating, and wear no uniform. Pupils get oral/written feedback but no grades in primary school (grades 1–7); from lower secondary (grades 8–10) they receive grades on a 1–6 scale (6 best) plus separate grades for orderliness and conduct (good/fair/poor). Corporal punishment is banned in schools and at home. Fewer than 5% of pupils attend fee-paying private schools; the rest attend free public schools following the same national curriculum set by the Storting.'],
    ['School subjects and teaching methods','Primary and lower secondary pupils study mathematics, Norwegian, English, a foreign language, science, social studies, KRLE (Christianity, religion, philosophies of life and ethics), arts and crafts, music, food and health, and elective subjects. Teaching often happens outside the classroom too — walks, school camps, swimming lessons, museum visits — and pupils work extensively in groups and projects, meant to build cooperation skills and prepare them to participate in a democracy.'],
    ['Cooperation between home and school','Parents keep the main responsibility for their children, but school and home share responsibility for a child’s upbringing and learning. Pupil, parents and teacher must hold a development talk (utviklingssamtale) about the child’s progress and wellbeing at least twice a year, and parents are expected to read and act on written information from the school. Real tensions can arise — e.g. parents keeping children out of gym/swimming lessons, extending summer holidays into term time, or opting children out of school-camp activities — and schools flag these as challenges to the cooperation.'],
    ['Upper secondary school and its two tracks','Everyone who has completed grunnskole has the right to upper secondary education (videregående) until they achieve the Higher Education Entrance Qualification or gain equivalent prior learning; public upper secondary school is free, though a few fee-paying private schools exist. Applications go in online before 1 March, and grade 10 results decide which school a pupil can attend. Pupils choose between a vocational programme (yrkesfag), ending in a craft certificate (fagbrev) for trades like carpenter, hairdresser, healthcare worker or car mechanic, or a general studies programme (studiespesialisering), a theoretical track that qualifies for university admission.'],
    ['Higher education and Lånekassen','About 42% of Norwegian adults have higher education, women now make up over 60% of students, and Norwegian-born people with immigrant parents take higher education at above-average rates. Admission to free public universities and university colleges (students pay only for books) is coordinated centrally through Samordna opptak. Because tuition is free but living costs money, most students borrow from the State Educational Loan Fund (Lånekassen), founded in 1947 so that anyone can study regardless of background; part of what is borrowed can convert to a non-repayable grant if the student passes their exams, while loans are repaid in instalments after finishing.'],
    ['Adult education and recognition of prior learning','Adults who never completed grunnskole have the right to free preparatory education (forberedende voksenopplæring), and those 25 or older who never took upper secondary education have the right to free upper secondary education through their county, alongside fee-paying private options. Foreign qualifications can be recognised via the Directorate for Higher Education and Skills (HK-dir), with health personnel authorised separately through the Directorate of Health. Skills gained outside formal education can also be assessed as realkompetanse (prior learning and work experience), which can shorten a course of study, grant admission, or lead to a new job or higher pay — the guiding idea is lifelong learning (livslang læring).'],
    ['Norwegian language levels and rights','Norwegian proficiency for the introduction programme is measured on the Common European Framework scale: A1 and A2 (basic user), B1 and B2 (independent/competent user). Whether your tuition is free and compulsory, or something you must pay for yourself, depends on your residence permit. Tuition must finish within three years (18 months for participants who already have upper secondary or higher education), ending with a Norwegian test that documents the level reached; your target level is set based on your education level on arrival and can be adjusted as you progress.'],
    ['Trade unions and workplace democracy','About half of Norwegian employees belong to a trade union (fagforening). Unions negotiate pay and conditions with employers; if negotiations fail, employees have the right to strike. Norwegian working life is built around employee participation — individual workers have the right to be heard about their own work situation, and every workplace must organise health, safety and environment (HSE/HMS) work through an employee representative, a dedicated safety representative (verneombud), and a management representative.'],
    ['The Working Environment Act and the Holidays Act','The Working Environment Act (arbeidsmiljøloven) covers hiring and contracts, working hours, absence, and HSE, and gives the employer overall responsibility for the working environment while requiring employees to help maintain it. The Holidays Act (ferieloven) gives every employee at least four weeks and one day of paid holiday a year (many get five weeks through their tariffavtale); holiday pay (feriepenger), not ordinary salary, is paid during the holiday and is calculated from what you earned the previous year.'],
    ['NAV and the welfare state in practice','NAV (the Labour and Welfare Administration) has an office in every municipality and administers roughly a third of the national budget with about 22,000 employees, covering sick pay, unemployment benefit, introduction benefit, pensions, child benefit and more. The system runs on mutual trust — the state trusts people not to abuse benefits, and people trust the state to help them when they need it — and it depends on as many people as possible working and paying tax. Around a third of everyone in work in Norway is employed in the public sector, in jobs like teaching, healthcare and NAV casework.'],
    ['Pay, tax cards and the tax return','Average gross annual pay in Norway was just under NOK 670,000 before tax in 2023, with women on average earning less than men, partly because of more part-time work. Most employees pay 30–40% of their pay in tax; the Tax Administration (Skatteetaten) calculates this from your tax card (frikort, prosentkort or tabellkort), which your employer downloads digitally. Every March/April you receive a digital tax return (skattemelding) summarising your income, deductions, wealth and debt from the previous year — check it, and you get a refund if you overpaid or a bill if you underpaid.'],
    ['Employment contracts and undeclared work','Everyone who takes a job is entitled to a written employment contract stating the position, pay and working hours, signed by both employer and employee — without one you cannot claim NAV unemployment benefit even if you paid tax. Undeclared work (svart arbeid) — working without a contract and without paying tax — is illegal and considered economic crime for both employer and employee, and it strips the worker of sick pay, holiday pay, pension points, unemployment benefit, accident insurance, loan eligibility and any documented work history.'],
    ['How the Norwegian labour market has changed','150 years ago, agriculture, forestry and fishing dominated; by 1950 over 20% worked in agriculture, versus under 3% today, even though Norway now produces more food thanks to mechanisation. Industrialisation drew people to cities in the late 1800s, and after oil was discovered in the North Sea in the late 1960s, oil and gas became central to the economy. Over the last 30 years, industrial jobs have declined further and most jobs are now in service occupations — shops, healthcare, schools, kindergartens, transport and IT — while climate change is pushing a transition toward "green" jobs.'],
    ['Applying for a job: CV, application and interview','A Norwegian job application (søknad) is a short letter about yourself and your background; the CV briefly lists your work experience and education — both should be accurate and written in correct Norwegian. Employers weigh experience, references, personality fit and suitability, not only formal qualifications, and usually invite candidates to one or more interviews. Interview etiquette includes arriving on time, dressing appropriately, giving a firm handshake and eye contact, and being positive and building rapport.'],
    ['Finding work through your network','Between 60 and 80% of jobs in Norway are filled through personal networks rather than open advertisements, so alongside checking nav.no and finn.no, building a network — family, friends, former colleagues, neighbours, teachers, case officers — matters for finding work. Newcomers who lack references or a network often start with temping agencies, practical training placements, or short-term/casual jobs to build both.'],
    ['Source criticism and ethical awareness','Kildekritikk means asking who wrote a text, whether they have an agenda, what they want to achieve, whether the information is accurate, and whether it leaves out important facts. Norwegian schools actively train pupils to question and challenge established truths rather than just repeat what they are told, while acknowledging their own knowledge may be incomplete. Etisk bevissthet (ethical awareness) means weighing different considerations against each other so you can make better decisions for society, the people around you and yourself; if you reuse someone else’s text, photos or music you must credit who holds the copyright.'],
    ['Data protection, BankID and digital judgement','Data protection (personvern) is the right to privacy and to control your own personal data — your name, address, phone number, ID number and ethnicity are all personal data, and this right is protected under the European Convention on Human Rights. Norwegians log into banking, government services and shopping using BankID, passwords, fingerprints or facial recognition, leaving digital traces that are stored and could be misused if stolen. Freedom of speech online is real but not unlimited — racist or discriminatory statements are against the law — and good digital judgement (digital dømmekraft) means only posting what you would be willing to say to someone’s face, and always asking permission before sharing photos of other people.']
  ]},
  {id:'m2', title:'Familie, helse og hverdagsliv', topics:[
    ['Children’s rights','The Children Act (barneloven) gives children the right to be heard and to be protected from violence. Physical punishment of children by parents is illegal in Norway.'],
    ['Public agencies supporting families','Barnehage (kindergarten, with a right to a place from around age 1), skole (school), helsestasjon (free child health check-ups and vaccinations), NAV (welfare and benefits), and barnevernet (child welfare services, which can step in if a child’s safety is at risk) all support families.'],
    ['Health and healthcare','Everyone is assigned a fastlege (regular GP). For urgent but non-emergency care, contact legevakt; call 113 for an ambulance, 112 for police, 110 for fire. Healthcare is mainly public and tax-funded, with a small co-payment (egenandel) capped yearly (frikort).'],
    ['Lifestyle, migration and mental health','Diet, sleep and exercise affect physical health, and migration-related stress is a recognised challenge. Support is available through your fastlege, helsestasjon, and mental health services (psykisk helsetjeneste).'],
    ['Newcomer rights and duties','Under the Integration Act (integreringsloven), newly arrived refugees have a right — and while receiving introduction benefit, a duty — to take part in introduksjonsprogrammet, which combines Norwegian training with steps toward work.'],
    ['Personal economy','Work, income and consumption shape your living standard. Making a budget and avoiding unnecessary consumer debt matters; NAV and municipal debt counselling (gjeldsrådgivning) can help if things get difficult.'],
    ['Harmful practices','Domestic violence (vold i nære relasjoner), forced marriage (tvangsekteskap) and female genital mutilation are illegal in Norway, regardless of culture or religion. Free, confidential help is available at a krisesenter (crisis shelter), and schools have minoritetsrådgivere (minority counsellors).'],
    ['Family planning and sexual identity','Contraception and family-planning advice are available, including youth health clinics. LGBT+ rights are protected by the Equality and Anti-Discrimination Act, and same-sex marriage has been legal since 2009.'],
    ['Housing in Norway','Around 82 per cent of households own their home and 18 per cent rent. The two common ownership forms are eierbolig (freehold — full responsibility for costs and upkeep) and borettslag (housing cooperative — you own a share and pay monthly felleskostnader covering shared debt, tax and insurance). Buying normally needs egenkapital (own capital) of about 10 per cent of the price, with the bank lending the rest once it has checked you can cover the instalments (avdrag) and interest (rente).'],
    ['Coming to Norway: residence and citizenship','An innvandrer (immigrant) is someone born abroad who lives in Norway. EU/EEA citizens can work without a residence permit but must register with the police online. Refugees arrive either as overføringsflyktninger (resettlement/quota refugees, through the UN’s UNHCR) or as asylum seekers, who can be granted protection for persecution or on strong humanitarian grounds. Family members of someone with a residence permit can apply for familiegjenforening (family reunification). Permits usually run for three or five years and are renewed yearly at first; after six to eight years you can apply for Norwegian citizenship, and UDI (udi.no) handles applications and guidance.'],
    ['The introduction programme in detail','Introduksjonsprogrammet normally lasts from three months up to three years, depending on the participant’s background, and pays introduksjonsstøtte (introduction benefit) throughout. It is run by municipalities, mainly for refugees — not all immigrants qualify. Parents of children under 18 (or expecting a child) must also complete foreldreveiledning (mandatory parent guidance): 8–12 group sessions of at least one hour, plus 5–8 individual sessions of at least 45 minutes.'],
    ['Marriage, cohabitation and divorce','About 70 per cent of couples in Norway are married and 30 per cent are samboer (cohabiting without marrying); around 20,000 couples marry each year, and roughly 40 per cent of marriages are expected to end in divorce, which normally requires a year of separation first (immediately, if the marriage involved force or violence). Since 2009, two people of the same sex can marry. For children born from 1 January 2020, both parents have joint parental responsibility whether they are married, cohabiting, or living apart — and unlike spouses, samboere do not automatically share financial or legal rights, so many make separate agreements.'],
    ['Children’s growing say as they grow up','Under barneloven, children have the right to be heard before decisions affecting them from around age 7, and their opinion carries significant weight from age 12. From age 15, young people can decide for themselves about their education and about joining or leaving organisations. Parents keep overall parental responsibility until the child turns 18, but must give the child increasing say as they mature.'],
    ['The child welfare service (barnevernet)','Norway was the first country in the world to set up a public child welfare service, under a law (vergerådsloven) from 1900. Barnevernet operates in every municipality, can offer support such as guidance or respite care on request, and can step in to protect a child — ideally together with the family, or through alternative care if needed. Staff have a duty of confidentiality, but professionals who work with children must report suspected violence or abuse, and anyone concerned about a child can contact barnevernet; the children and young people’s helpline is 116 111.'],
    ['Health services and patient rights','Everyone living in Norway has a fastlege and can switch GP up to twice a year via helsenorge.no. A regular GP visit typically costs 150–300 kroner, but visits for children under 16 and antenatal check-ups are free; once your yearly patient charges pass a threshold, you get a frikort (exemption card) and further public healthcare is free for the rest of the year. Call legevakt on 116 117 for urgent but non-emergency care when your GP is closed, and 113 for a medical emergency. Hospital treatment, food and accommodation are free once you are admitted, healthcare staff and interpreters are bound by confidentiality, and patients can see their own medical records — from age 16 a young person decides who else, including parents, can access their health information.'],
    ['Dental health','Public dental check-ups are free for children and young people up to age 19, though parents pay a patient charge for braces. From 19, young adults pay 25 per cent of public dental treatment costs (the state covers the rest); from adulthood, people pay full price and arrange their own dentist, ideally with an annual check-up. Everyone should brush twice a day, and sugary or acidic food and drink (sweets, fizzy drinks, juice) damage teeth — poor milk teeth also raise the risk of poor adult teeth, so parents are responsible for children’s dental hygiene from before the first tooth appears.'],
    ['Pregnancy, vaccination and child health checks','Contraception methods include the pill and implant (hormones that stop ovulation), the coil (fitted by a doctor), and the condom — the only method that also protects against sexually transmitted infections. Pregnant women get free, voluntary antenatal care (typically 8–12 check-ups) and free hospital births. Helsestasjon follows up children aged 0–5 (growth, vision, hearing, language, vaccination) and skolehelsetjenesten continues this through school; vaccination is free and strongly recommended but needs parental consent. Under the Abortion Act, a woman can end a pregnancy on request up to week 18; after that, approval is required.'],
    ['The three phases of moving to a new country','Moving abroad is often described in three phases: an initial "honeymoon" phase of excitement about new possibilities; a harder phase, sometimes after weeks or months, marked by insecurity, tiredness with the differences and homesickness; and an adaptation phase, where language and understanding of Norwegian systems improve and old and new values start to fit together. Family members often move through these phases at different times and speeds, which can create tension at home.'],
    ['Living in two cultures','Cultures are sometimes described as individualist (valuing independence, equal status and equality) or collectivist (valuing obedience, respect and good relations within the group). Children who grow up between cultures may face conflicting expectations from parents and from Norwegian society about what counts as polite or correct behaviour.'],
    ['Leisure time, dugnad and civic engagement','Fritid (spare time) is the part of the day not spent working, eating or sleeping. Dugnad — unpaid, voluntary community work such as spring-cleaning a borettslag or helping out at a barnehage — was voted Norway’s national word in 2004; it is technically voluntary, but skipping it can bring social consequences. Common social arenas for building networks include idrettslag (sports clubs), korps (bands), speider (scouts) and voluntary organisations like the Red Cross. Political engagement can be formal (party membership, election campaigns) or informal (petitions, protests, social media), and turnout among the youngest voters has risen since 2011.'],
    ['Forced marriage and genital mutilation — the legal detail','Forcing someone to marry using violence, deprivation of liberty, pressure or threats carries up to 6 years’ imprisonment, and a forced marriage has no legal validity — the person forced can seek an annulment within five years. Female genital mutilation carries up to 6 years’ imprisonment, or up to 15 years in aggravated cases, and consent does not make it legal; failing to try to prevent it can itself lead to up to a year in prison. Schools may have minoritetsrådgivere (minority counsellors), and help is also available from the forced marriage/FGM expert team (tel. 478 09 050) and the Red Cross helpline (tel. 815 55 201).'],
    ['Personal finance terms','Inntekt (income) covers everything paid into your account — wages, NAV benefits, child benefit, cash-for-care benefit — while utgifter (expenses) covers what you spend, from rent to food to leisure. Pay is quoted as bruttolønn (before tax) or nettolønn (after tax). Opening a bank account needs a Norwegian personal ID number or D-number, and everyday banking runs through BankID; a lån (loan) is repaid through avdrag (instalments) plus rente (interest), so a budsjett (budget) should also set aside money for savings or unforeseen costs.']
  ]},
  {id:'m3', title:'Norge før og nå', topics:[
    ['1814 and the Constitution','Norway’s constitution was signed at Eidsvoll on 17 May 1814. This date, Grunnlovsdag (Constitution Day), is Norway’s national day — celebrated with children’s parades (barnetog) rather than military parades.'],
    ['1905 — the end of the union','From 1814 Norway was in a union with Sweden. This ended peacefully in 1905, when Norway became fully independent and chose its own king, Haakon VII.'],
    ['Occupation and after','Norway was occupied by Nazi Germany from 1940 to 1945. In 1969 oil was discovered at the Ekofisk field; the resulting wealth is largely saved abroad in the Government Pension Fund Global ("Oljefondet") rather than spent immediately.'],
    ['Norway, the EU and its neighbours','Norway is not a member of the European Union, but it takes part in the EU’s single market through the EEA agreement and is part of the Schengen open-border area.'],
    ['How Norwegian democracy works','Norway is a constitutional monarchy and a parliamentary democracy, with power split between Stortinget (parliament, 169 members elected every 4 years), Regjeringen (the government, led by the statsminister), and independent courts. King Haakon VIII became head of state in August 2026, after the death of his father, King Harald V; the role is largely ceremonial. Jonas Gahr Støre (Arbeiderpartiet) continued as Prime Minister after the September 2025 election. Voting age is 18.'],
    ['Diversity and the Sámi people','Norway recognises many family forms (married, cohabiting/samboer, single-parent, same-sex families) and has national minorities including Jews, Kvens, Roma and Romani/Tater. The Sámi are an indigenous people with their own parliament, Sametinget, based in Karasjok, and specific language and cultural rights, especially in northern Norway.'],
    ['Nature, environment and allemannsretten','Friluftsliv (outdoor life) is central to Norwegian culture, supported by allemannsretten — everyone’s right to roam and access uncultivated nature. Norway leans heavily on renewable hydropower and has one of the highest rates of electric car ownership in the world.'],
    ['Gender equality','Norway is consistently ranked among the most gender-equal countries. Women have had the right to vote since 1913, and parental leave includes a father’s quota (fedrekvote) reserved specifically for fathers.'],
    ['Human rights and freedom of expression','The Constitution and international conventions Norway has ratified protect fundamental rights, including ytringsfrihet (freedom of expression), and the Equality and Anti-Discrimination Act bans discrimination based on gender, ethnicity, religion, disability and sexual orientation.'],
    ['Religion in Norway','The Church of Norway (Den norske kirke), historically the state church, was formally separated from the state in 2012. Freedom of religion is constitutionally guaranteed, and Norwegian society today is religiously diverse and largely secular in everyday life.'],
    ['Geography and population','Norway covers 385,178 square kilometres, bordering Sweden, Finland and Russia, and includes the Svalbard archipelago. It is divided into 15 counties (fylker) and 357 municipalities (kommuner). The population passed 5.6 million by 2025 (up from under 3.9 million in 1970), driven mainly by immigration, with growth projected to reach around 6 million by 2040. About three-quarters of Norwegians live along the coast, and half live in Eastern Norway. The four largest cities are Oslo (the capital, roughly 725,000 people), Bergen, Trondheim and Stavanger. The coastline stretches 25,148 km — longer than the distance from the North Pole to the South Pole — with around 50,000 islands. Mountains and plateaus cover about half the country, forest 37%, and only 3% is cultivated land.'],
    ['Public holidays and traditions','Beyond 17 May, Norway’s calendar includes public holidays such as New Year’s Day (1 January), the Easter days (Maundy Thursday through Easter Monday), Ascension Day (a Thursday 40 days after Easter) and Whit Monday (10 days after that), Labour Day (1 May, marked with political marches), and Christmas (Christmas Eve, Christmas Day and Boxing Day). Some flaggdager (flag days) are marked but are not days off work: Sami National Day (6 February) and International Women’s Day (8 March, celebrated in Norway since 1972). New Year’s Eve (31 December) is a family celebration but not a public holiday. Beyond the calendar, life-cycle events such as birthdays, weddings, christenings (dåp), confirmations (konfirmasjon) and funerals are important markers in Norwegian life.'],
    ['Sámi history and self-government','The Sámi are the indigenous people not only of Norway but also of Sweden, Finland and Russia, and are considered the oldest population group in the country. Sámi languages are unrelated to Norwegian, though almost all Norwegian Sámi today also speak Norwegian. Traditional Sámi livelihoods included hunting, trapping, fishing and reindeer herding, which many Sámi still practise alongside modern occupations. From around the 1850s, Norwegian authorities pursued a policy of "Norwegianisation" (fornorsking): Sámi children had to attend Norwegian-language schools and were forbidden from learning Sámi, and a 1902 law barred non-Norwegian-speakers from buying land in Sámi areas — a rule not repealed until 1965. Sametinget, the Sámi Parliament, opened in 1989, with members elected every four years to safeguard Sámi culture, language and education. The Sámi national costume, the kofte, is worn on special occasions such as weddings, and the Sámi flag flies across Norway on Sámi National Day, 6 February.'],
    ['National minorities and immigration','Alongside the Sámi, Norway recognises five other groups as national minorities (nasjonale minoriteter) with centuries-old ties to the country: Jews, Kvens, Forest Finns (skogfinner), Roma and Romani/Tater. Norway ratified a European agreement protecting national minorities’ rights in 1999, committing the state to help preserve their languages, religion, traditions and culture. On immigration, more than one million people living in Norway today were either born abroad or born in Norway to two parents born abroad; the largest groups come from Poland, Lithuania, Ukraine, Sweden and Syria, and most immigrants live in cities rather than the countryside. Between 1820 and 1930, by contrast, Norway was a country of emigration: more than 800,000 Norwegians left for America during that period.'],
    ['Prehistoric Norway — Stone Age to Viking Age','The first people arrived in Norway around 12,000 years ago, following the retreat of the Ice Age glaciers, living off fish, game, berries and mushrooms during the Stone Age; farming began around 4,000 years ago. In the Bronze Age, wealthier farmers acquired bronze tools and jewellery and began using horses to work the land. During the Iron Age, people learned to smelt iron from bog ore, improving tools and boosting food production and population growth. In the Viking Age (about 800–1050 AD), powerful farmer-chieftains led raiding, trading and settlement expeditions abroad; Harald Fairhair (Harald Hårfagre) became the first king of a united Norway around 872. The decisive turning point for Christianity came at the Battle of Stiklestad in 1030, where the Christian king Olav Haraldsson was killed fighting pagan chieftains — Olav was later declared a saint, and Christianity gradually replaced the old Norse religion.'],
    ['Middle Ages, Black Death and the Danish union','Norway’s population grew from around 150,000 to 400,000 between 1000 and 1300, but child mortality was high and many women died in childbirth. The Black Death (Svartedauden), a plague pandemic that reached Norway in the mid-14th century, killed roughly a third of the population — one of the most severe demographic shocks in Norwegian history. Through the Middle Ages, farmers increasingly paid taxes to the church, king and nobility rather than owning their own land, and Norway’s first towns — Bergen, Trondheim (Nidaros), Oslo, Stavanger and Tønsberg — were founded during this period. From 1397 Norway entered a union with Denmark and Sweden; after Sweden left, the union with Denmark lasted until 1814, with Copenhagen as the political and cultural centre and Danish as the written language. In 1517 Martin Luther’s Reformation split European Christianity; Protestantism became Norway’s state religion soon after and remained so until the state church system ended in 2012.'],
    ['National Romanticism and the Nynorsk language','In the mid-19th century, a Europe-wide National Romanticism movement encouraged countries to celebrate their distinctive culture; in Norway this meant showcasing dramatic landscapes and rural farming traditions through literature, painting and music. Because Norway’s written language had been based on Danish for centuries, the linguist Ivar Aasen travelled the country collecting dialect samples to build an alternative written standard rooted in Norwegian speech — this became Nynorsk, still one of Norway’s two official written forms of Norwegian alongside Bokmål (Sámi is also an official language).'],
    ['Industrialisation, emigration and the labour movement','In the mid-1800s around 70% of Norwegians lived rurally from farming and fishing; as the population grew faster than land and jobs, people moved to towns for factory work — the urban share rose from about 15% before 1850 to 35% by 1900, often into long hours and crowded housing, with child labour common. Around 800,000 Norwegians emigrated to America between 1850 and 1920 seeking better prospects. Norway’s labour movement organised from the 1880s onward and gained real influence from the early 1900s, winning shorter hours (the working day was cut to eight hours in 1919), workplace safety rules and sickness benefits; roughly half of Norwegian employees still belong to a trade union today.'],
    ['Women’s suffrage and the women’s movement','Norwegian men gained universal voting rights in 1898; women won the same right in 1913, among the earliest in the world. The organised women’s movement, active from the 1880s, gathered new momentum in the 1970s, winning rights including access to divorce, contraception and reproductive choice — the 1976 Abortion Act gave women the right to choose an abortion, a right updated in 2025 to permit the procedure up to week 19 of pregnancy. Men and women today have formally equal rights to education, work, property, inheritance and healthcare, though gaps persist: women make up nearly half the workforce but hold only around a third of executive positions and work part-time far more often than men.'],
    ['World War I and the interwar years','Norway stayed neutral during World War I (1914–1918), but the war still caused shortages of goods like grain, coffee and sugar, leading to rationing. The interwar period between the two world wars was marked by financial crisis and widespread unemployment across Norway.'],
    ['World War II in Norway','Germany invaded Norway on 9 April 1940; after a few weeks of fighting, Norway capitulated and the King and government fled to England, while Vidkun Quisling headed a non-elected, pro-German government — his name became an international byword for a collaborator/traitor. Resistance activity included sabotage and illegal newspapers, and around 50,000 Norwegians fled to neutral Sweden during the war. On Hitler’s orders, retreating German forces razed most of Finnmark and northern Troms in 1944–45. More than 10,000 Norwegians died as a result of the war. Of the roughly 2,100 Jews living in Norway before the war, 773 were deported to concentration camps and only 38 survived to return.'],
    ['Oil, international cooperation and the welfare state','Oil was first found in the North Sea in the late 1960s and transformed Norway into a wealthy "oil nation," though the resource itself stays public property while companies buy time-limited rights to explore and produce — a system still debated because of its environmental impact. Modern Norway takes part in international cooperation through the UN, NATO and the EEA (though not the EU itself), and its wealth and welfare system rest on natural resources — fish, forests, oil, hydropower and wind — alongside the principle that the state guarantees education, healthcare and financial support to all who need it.'],
    ['Administrative structure and separation of powers','Norway’s 15 counties and 357 municipalities are each an elected layer of self-government operating inside national frameworks. The central government sets foreign policy, runs hospitals, passes laws and sets school curricula; counties run upper secondary schools and county roads; municipalities run primary/lower-secondary schools, kindergartens, elderly care, refuse collection and water/sewerage, and local roads. Power is also split three ways nationally: the Storting makes laws (legislative power), the government proposes and carries them out (executive power), and independent courts judge cases under those laws (judicial power) — a separation meant to stop any one branch holding too much power.'],
    ['Elections and political parties','Norway holds elections every two years, alternating between parliamentary (Storting) elections and local elections for county and municipal councils, each for a four-year term. Around twenty political parties compete, spanning from socialist to conservative, and each publishes a party manifesto (partiprogram) setting out its priorities before an election. As with all Norwegian elections, voting is by secret ballot, so nobody is obliged to reveal which party they supported.'],
    ['Human rights — international framework','Human rights are universal — rights everyone holds simply by being human, regardless of where they live or what religion or ethnicity they belong to. The UN’s Universal Declaration of Human Rights was adopted in 1948 and has since been endorsed by all UN member states, with much of it written into Norwegian law. Among its core provisions: everyone is born free and equal in dignity and rights; everyone has the same rights regardless of gender, religion, race, political opinion or nationality; torture is prohibited in all forms; everyone is entitled to due process; and citizens have the right to vote in free elections by secret ballot.'],
    ['Democratic rights and duties','Democracy in Norway rests on rights paired with duties. Freedom of speech lets people discuss and publish opinions on politics and religion without punishment, but racist or hateful statements are against the law. From age 15, people can freely join or leave a religious or life-stance community. People can join political parties, unions and other associations, and hold lawful demonstrations, without fear of persecution; trade unions may also strike in certain circumstances. No one can be imprisoned without a trial before an independent judge, and every defendant has the right to a defence. In return, citizens are expected to follow democratically made laws and seek change through democratic means — Norwegian society runs substantially on mutual trust between citizens and authorities. Threats to this system include low election turnout, falling political trust, and misinformation and hateful speech that shut down open debate.'],
    ['Equality and anti-discrimination law','Equality (likestilling) in Norway means the principle that everyone has the same worth regardless of gender, age, disability, cultural background, ethnicity or sexual orientation. Since the women’s rights push of the 1970s, women’s workforce participation has risen sharply, though gaps remain in leadership roles and study choices. Key laws protecting equality include the Equality and Anti-Discrimination Act, the Marriage Act and the Inheritance Act, plus Section 185 of the Penal Code — sometimes called the "racism paragraph" — which bans discriminatory or hateful statements based on ethnicity, skin colour, religion, sexual orientation, gender identity or disability.'],
    ['Nature and natural resources','Much of Norway’s wealth over the past century comes from natural resources: fish, forests, oil, hydropower from rivers and waterfalls, and increasingly wind power. Aluminium, produced using large amounts of cheap hydropower, is a major export, alongside fish and timber (processed into paper and building materials, or exported raw).'],
    ['Right to roam — the rules in detail','Allemannsretten lets everyone walk or ski freely across uncultivated land — beaches, forests, marshland and mountains — and rest anywhere along the way. Camping in the same spot for more than two nights needs the landowner’s permission, and a tent must be pitched at least 150 metres from houses or cabins. Users must avoid harming animals, damaging nature or leaving litter, and lighting fires in or near forest is banned from 15 April to 15 September (disposable barbecues are allowed with care). Picking berries, mushrooms and wild flowers is free; fishing and hunting are also allowed but usually require a licence.'],
    ['Sustainable development and the UN goals','The UN Sustainable Development Goals (SDGs, bærekraftsmålene) are a shared global plan aiming, by 2030, to end poverty, reduce inequality and stop climate change. Climate is the average weather measured over a long period, distinct from day-to-day weather, and the international scientific consensus is that human CO2 emissions — not natural variation — are the main driver of rising temperatures, melting ice, rising and more acidic oceans, and more extreme weather. Resources are either renewable — like animals, plants, wind, rain and sunshine, which regenerate if used sustainably — or non-renewable, like oil, gas and coal, which do not. Eating locally produced food cuts transport-related emissions and makes it easier to oversee how food is grown, including pesticide and antibiotic use and animal welfare.'],
    ['Recycling, waste and emissions','Nature conservation and environmental protection (naturvern) means limiting damage to ecosystems and repairing the harm people cause, so animals, plants and people keep good living conditions in future. Norwegians increasingly reuse items secondhand — clothing and furniture resale has grown fast — and recycle materials into new products, while municipal source-separation schemes sort household waste and dedicated recycling stations (gjenbruksstasjoner) take furniture, appliances and paint. Each Norwegian produces several hundred kilos of waste a year, and Norway throws out around 400,000 tonnes of edible food annually — part of a global one-third of all food produced that goes to waste. Norway’s main greenhouse gas sources are oil and gas production, industry, mining and road traffic, though 2024 marked the first year electric cars outnumbered petrol-only cars among new registrations.']
  ]}
];

const CIVIC_MODULES_NO = [
{id:'m1', title:'Utdanning, kompetanse og arbeidsliv', topics:[
  ['Rett til utdanning','Barn har både rett og plikt til å gå på grunnskolen fra de er 6 til 16 år, og skolegangen er gratis. Videregående opplæring er en rett for unge mellom 16 og 19 år, og voksne har også rett til videre opplæring, blant annet norskopplæring.'],
  ['Arbeidsliv og fagforeninger','De fleste arbeidstakere kan melde seg inn i en fagforening. Tariffavtaler fastsetter lønn og arbeidsvilkår i mange bransjer, og Norge har en av de høyeste fagorganiseringsgradene i verden. Arbeidsmiljøloven verner om arbeidstid, helse og sikkerhet, og beskytter mot urettmessig oppsigelse.'],
  ['Skattefinansiert velferd','Skoler, helsetjenester og NAV-ytelser (dagpenger, sykepenger, pensjon) finansieres hovedsakelig gjennom skatter. Norge bruker et progressivt inntektsskattesystem som ryggraden i velferdsstaten.'],
  ['Personopplysninger og opphavsrett','Personopplysninger er beskyttet ved lov — du trenger vanligvis et rettslig grunnlag eller samtykke fra personen for å samle inn eller dele opplysninger om dem, også bilder. Åndsverk er automatisk beskyttet av opphavsrett, og det er ikke tillatt å kopiere dem uten tillatelse.'],
  ['Digital kompetanse og kildekritikk','Kildekritikk, altså å vurdere informasjonskilder kritisk, er viktig for å avsløre feilinformasjon på nettet. Mange norske offentlige tjenester er først og fremst digitale, og BankID brukes mye for sikker innlogging.'],
  ['Skolens verdier og samarbeid','Norske skoler legger vekt på samarbeid og likeverd mellom elevene, og fysisk avstraffelse av elever er forbudt. Foreldresamarbeid, som foreldremøter og utviklingssamtaler, er en naturlig del av skolehverdagen.'],
  ['Hvor man kan lære norsk','I tillegg til formelle kurs er arbeidsplasser, bibliotek og hverdagslige møter med andre alle verdifulle arenaer for å lære språket.'],
  ['Barnehager','Alt som skjer i en barnehage styres av barnehageloven og skal bygge på kristne og humanistiske verdier, menneskerettigheter og respekt for naturen. Det er dyrt å drive barnehage — kommunen dekker det meste av kostnaden, og Stortinget fastsetter en makspris for det foreldre betaler, med søskenmoderasjon og redusert betaling eller gratis kjernetid for familier med lav inntekt. Foreldre som ikke snakker norsk har rett til tolk på foreldremøter.'],
  ['Fakta om grunnskolen','Alle barn har rett til 13 års skolegang totalt; de ti årene i grunnskolen (1.–10. trinn) er obligatoriske og gratis. Barn begynner på skolen i august det året de fyller seks år, går automatisk videre til neste trinn uten å gå om igjen et år, og det er ingen skoleuniform. Elever får muntlig og skriftlig tilbakemelding, men ingen karakterer på barnetrinnet (1.–7. trinn); fra ungdomstrinnet (8.–10. trinn) får de karakterer på en skala fra 1 til 6 (6 er best), i tillegg til egne karakterer i orden og oppførsel (god/nokså god/lite god). Fysisk avstraffelse er forbudt både på skolen og hjemme. Færre enn 5 % av elevene går på private skoler med skolepenger; resten går på gratis offentlige skoler som følger den samme nasjonale læreplanen fastsatt av Stortinget.'],
  ['Skolefag og undervisningsmetoder','Elever på barne- og ungdomstrinnet har fag som matematikk, norsk, engelsk, fremmedspråk, naturfag, samfunnsfag, KRLE (kristendom, religion, livssyn og etikk), kunst og håndverk, musikk, mat og helse, samt valgfag. Undervisningen foregår ofte også utenfor klasserommet — turer, leirskole, svømmeopplæring, museumsbesøk — og elevene jobber mye i grupper og med prosjekter, noe som skal bygge samarbeidsevner og forberede dem på å delta i et demokrati.'],
  ['Samarbeid mellom hjem og skole','Foreldrene har hovedansvaret for barna sine, men skole og hjem deler ansvaret for barnets oppdragelse og læring. Elev, foreldre og lærer skal ha en utviklingssamtale om barnets faglige og sosiale utvikling minst to ganger i året, og foreldre forventes å lese og følge opp skriftlig informasjon fra skolen. Det kan oppstå reelle spenninger — for eksempel at foreldre holder barn borte fra gym- eller svømmetimer, forlenger sommerferien inn i skoletiden, eller melder barna av leirskoleaktiviteter — og skolene peker på dette som utfordringer for samarbeidet.'],
  ['Videregående skole og de to studieretningene','Alle som har fullført grunnskolen har rett til videregående opplæring fram til de oppnår generell studiekompetanse eller tilsvarende realkompetanse; offentlig videregående skole er gratis, selv om det finnes noen private skoler med skolepenger. Søknad sendes inn digitalt innen 1. mars, og karakterene fra 10. trinn avgjør hvilken skole eleven kan komme inn på. Elevene velger mellom yrkesfag, som ender med et fagbrev innen yrker som tømrer, frisør, helsefagarbeider eller bilmekaniker, eller studiespesialisering, en teoretisk retning som gir opptak til universitet og høyskole.'],
  ['Høyere utdanning og Lånekassen','Rundt 42 % av den voksne befolkningen i Norge har høyere utdanning, kvinner utgjør nå over 60 % av studentene, og norskfødte med innvandrerforeldre tar høyere utdanning i større grad enn gjennomsnittet. Opptak til de gratis offentlige universitetene og høyskolene (studentene betaler bare for bøker) samordnes sentralt gjennom Samordna opptak. Fordi studiene er gratis, men det koster å leve, låner de fleste studenter penger fra Lånekassen, opprettet i 1947 for at alle skal kunne studere uavhengig av bakgrunn; en del av lånet kan gjøres om til stipend dersom studenten består eksamenene, mens lånet ellers betales tilbake i avdrag etter fullført utdanning.'],
  ['Voksenopplæring og godkjenning av realkompetanse','Voksne som aldri har fullført grunnskolen har rett til gratis forberedende voksenopplæring, og de som er 25 år eller eldre og aldri har tatt videregående opplæring har rett til gratis videregående gjennom fylkeskommunen, i tillegg til private tilbud mot betaling. Utenlandske utdanninger kan godkjennes gjennom Direktoratet for høyere utdanning og kompetanse (HK-dir), mens helsepersonell søker autorisasjon separat hos Helsedirektoratet. Kompetanse man har fått utenfor det formelle utdanningssystemet kan også vurderes som realkompetanse, noe som kan forkorte et studieløp, gi opptak, eller føre til ny jobb eller høyere lønn — tanken bak er livslang læring.'],
  ['Norsknivåer og rettigheter','Norskferdigheter for introduksjonsprogrammet måles etter den felles europeiske referanserammen: A1 og A2 (grunnleggende bruker), B1 og B2 (selvstendig/kompetent bruker). Om norskopplæringen din er gratis og obligatorisk, eller noe du selv må betale for, avhenger av oppholdstillatelsen din. Opplæringen skal avsluttes innen tre år (18 måneder for deltakere som allerede har videregående eller høyere utdanning), og avsluttes med en norskprøve som dokumenterer nivået som er oppnådd; måloppnåelsen settes ut fra utdanningsnivået ditt ved ankomst og kan justeres etter hvert som du gjør framgang.'],
  ['Fagforeninger og medbestemmelse på arbeidsplassen','Omtrent halvparten av norske arbeidstakere er medlem av en fagforening. Fagforeningene forhandler lønn og arbeidsvilkår med arbeidsgiverne; dersom forhandlingene ikke fører fram, har arbeidstakerne rett til å streike. Norsk arbeidsliv er bygget rundt medbestemmelse — den enkelte arbeidstaker har rett til å bli hørt om sin egen arbeidssituasjon, og hver arbeidsplass må organisere helse-, miljø- og sikkerhetsarbeid (HMS) gjennom en ansattrepresentant, et eget verneombud og en representant fra ledelsen.'],
  ['Arbeidsmiljøloven og ferieloven','Arbeidsmiljøloven regulerer ansettelse og kontrakter, arbeidstid, fravær og HMS, og gir arbeidsgiveren det overordnede ansvaret for arbeidsmiljøet, samtidig som arbeidstakerne plikter å bidra til å opprettholde det. Ferieloven gir alle arbeidstakere minst fire uker og én dag betalt ferie i året (mange får fem uker gjennom tariffavtalen); det er feriepenger, ikke vanlig lønn, som utbetales i ferien, og de beregnes ut fra det du tjente året før.'],
  ['NAV og velferdsstaten i praksis','NAV (Arbeids- og velferdsforvaltningen) har et kontor i hver kommune og forvalter omtrent en tredjedel av statsbudsjettet med rundt 22 000 ansatte, og dekker sykepenger, dagpenger, introduksjonsstønad, pensjon, barnetrygd og mer. Systemet bygger på gjensidig tillit — staten stoler på at folk ikke misbruker ytelsene, og folk stoler på at staten hjelper dem når de trenger det — og det er avhengig av at flest mulig jobber og betaler skatt. Rundt en tredjedel av alle sysselsatte i Norge jobber i offentlig sektor, i yrker som lærer, helsepersonell og saksbehandler i NAV.'],
  ['Lønn, skattekort og skattemelding','Gjennomsnittlig brutto årslønn i Norge var like under 670 000 kroner før skatt i 2023, og kvinner tjener i gjennomsnitt mindre enn menn, blant annet fordi flere kvinner jobber deltid. De fleste arbeidstakere betaler 30–40 % av lønnen i skatt; Skatteetaten beregner dette ut fra skattekortet ditt (frikort, prosentkort eller tabellkort), som arbeidsgiveren laster ned digitalt. Hvert år i mars/april får du en digital skattemelding som oppsummerer inntekt, fradrag, formue og gjeld fra året før — sjekk den, så får du penger tilbake hvis du har betalt for mye skatt, eller restskatt hvis du har betalt for lite.'],
  ['Arbeidskontrakt og svart arbeid','Alle som tar en jobb har rett til en skriftlig arbeidskontrakt som angir stilling, lønn og arbeidstid, signert av både arbeidsgiver og arbeidstaker — uten en slik kontrakt kan du ikke kreve dagpenger fra NAV, selv om du har betalt skatt. Svart arbeid — å jobbe uten kontrakt og uten å betale skatt — er ulovlig og regnes som økonomisk kriminalitet for både arbeidsgiver og arbeidstaker, og det fratar arbeidstakeren sykepenger, feriepenger, pensjonspoeng, dagpenger, yrkesskadeforsikring, lånemuligheter og dokumentert arbeidserfaring.'],
  ['Hvordan det norske arbeidsmarkedet har endret seg','For 150 år siden dominerte jordbruk, skogbruk og fiske; i 1950 jobbet over 20 % i jordbruket, mot under 3 % i dag, selv om Norge nå produserer mer mat takket være mekanisering. Industrialiseringen trakk folk til byene på slutten av 1800-tallet, og etter at det ble funnet olje i Nordsjøen på slutten av 1960-tallet, ble olje og gass en sentral del av økonomien. De siste 30 årene har industriarbeidsplasser gått ytterligere ned, og de fleste jobbene finnes nå i tjenesteytende yrker — butikker, helsevesen, skoler, barnehager, transport og IT — mens klimaendringene driver fram en omstilling mot «grønne» jobber.'],
  ['Å søke jobb: CV, søknad og intervju','En norsk jobbsøknad er et kort brev om deg selv og din bakgrunn; CV-en lister kort opp arbeidserfaring og utdanning — begge deler bør være korrekte og skrevet på godt norsk. Arbeidsgivere vektlegger erfaring, referanser, personlig egnethet og skikkethet, ikke bare formelle kvalifikasjoner, og inviterer som regel kandidater til ett eller flere intervjuer. God intervjuskikk innebærer å møte presis, kle seg passende, gi et fast håndtrykk og øyekontakt, og være positiv og skape god kontakt.'],
  ['Å finne jobb gjennom nettverket sitt','Mellom 60 og 80 % av jobbene i Norge fylles gjennom personlige nettverk, ikke gjennom åpne utlysninger, så i tillegg til å sjekke nav.no og finn.no er det viktig å bygge nettverk — familie, venner, tidligere kolleger, naboer, lærere, saksbehandlere — for å finne arbeid. Nyankomne som mangler referanser eller nettverk starter ofte med bemanningsbyråer, praksisplasser eller korte og midlertidige jobber for å bygge opp begge deler.'],
  ['Kildekritikk og etisk bevissthet','Kildekritikk innebærer å spørre hvem som har skrevet en tekst, om vedkommende har en agenda, hva de ønsker å oppnå, om informasjonen er korrekt, og om den utelater viktige fakta. Norske skoler trener elevene aktivt i å stille spørsmål ved og utfordre etablerte sannheter i stedet for bare å gjenta det de blir fortalt, samtidig som de erkjenner at egen kunnskap kan være ufullstendig. Etisk bevissthet handler om å veie ulike hensyn mot hverandre slik at man kan ta bedre valg for samfunnet, menneskene rundt seg og seg selv; hvis du gjenbruker andres tekst, bilder eller musikk, må du oppgi hvem som har opphavsretten.'],
  ['Personvern, BankID og digital dømmekraft','Personvern er retten til privatliv og til å ha kontroll over egne personopplysninger — navn, adresse, telefonnummer, fødselsnummer og etnisitet er alle personopplysninger, og denne retten er beskyttet av Den europeiske menneskerettskonvensjonen. Nordmenn logger inn i nettbank, offentlige tjenester og nettbutikker med BankID, passord, fingeravtrykk eller ansiktsgjenkjenning, og dette etterlater digitale spor som lagres og kan misbrukes hvis de kommer på avveie. Ytringsfriheten gjelder også på nett, men den er ikke ubegrenset — rasistiske eller diskriminerende uttalelser er ulovlige — og god digital dømmekraft betyr at man bare bør poste det man ville sagt til noen ansikt til ansikt, og alltid spørre om lov før man deler bilder av andre.']
]},
{id:'m2', title:'Familie, helse og hverdagsliv', topics:[
  ['Barns rettigheter','Barneloven gir barn rett til å bli hørt og rett til å bli beskyttet mot vold. Fysisk avstraffelse av barn fra foreldre er ulovlig i Norge.'],
  ['Offentlige tjenester som støtter familier','Barnehage (med rett til plass fra rundt ett års alder), skole, helsestasjon (gratis helsekontroller og vaksinasjon for barn), NAV (velferd og stønader) og barnevernet (barnevernstjenesten, som kan gripe inn hvis et barns sikkerhet er truet) støtter alle familier.'],
  ['Helse og helsetjenester','Alle får tildelt en fastlege. Ved akutt, men ikke livstruende, behov tar du kontakt med legevakten; ring 113 for ambulanse, 112 for politi og 110 for brann. Helsetjenester er hovedsakelig offentlige og skattefinansierte, med en liten egenandel som har et årlig tak (frikort).'],
  ['Livsstil, migrasjon og psykisk helse','Kosthold, søvn og mosjon påvirker den fysiske helsen, og stress knyttet til migrasjon er en anerkjent utfordring. Hjelp er tilgjengelig gjennom fastlegen din, helsestasjonen og psykisk helsetjeneste.'],
  ['Nyankomnes rettigheter og plikter','Etter integreringsloven har nyankomne flyktninger både en rett – og, så lenge de mottar introduksjonsstønad, en plikt – til å delta i introduksjonsprogrammet, som kombinerer norskopplæring med skritt mot arbeid.'],
  ['Personlig økonomi','Arbeid, inntekt og forbruk former levestandarden din. Det er viktig å sette opp et budsjett og unngå unødvendig forbruksgjeld; NAV og kommunal gjeldsrådgivning kan hjelpe hvis det blir vanskelig.'],
  ['Skadelige praksiser','Vold i nære relasjoner, tvangsekteskap og kjønnslemlestelse er ulovlig i Norge, uansett kultur eller religion. Gratis og konfidensiell hjelp er tilgjengelig på et krisesenter, og skoler har minoritetsrådgivere.'],
  ['Familieplanlegging og seksuell identitet','Prevensjon og råd om familieplanlegging er tilgjengelig, blant annet gjennom helsestasjon for ungdom. LHBT+-rettigheter er beskyttet av likestillings- og diskrimineringsloven, og likekjønnet ekteskap har vært lovlig siden 2009.'],
  ['Bolig i Norge','Rundt 82 prosent av husholdningene eier boligen sin, og 18 prosent leier. De to vanligste eieformene er eierbolig (du har fullt ansvar for kostnader og vedlikehold selv) og borettslag (du eier en andel og betaler månedlige felleskostnader som dekker fellesgjeld, skatt og forsikring). Å kjøpe bolig krever normalt egenkapital på rundt 10 prosent av kjøpesummen, og banken låner ut resten etter å ha sjekket at du kan dekke avdrag og renter.'],
