<title>Know Norway</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24303a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Layout: one-column phone app — sticky top bar, scrolling panel, fixed bottom tab bar with thumb-sized targets. */
  :root{
    --ink:#1c2320; --ink-soft:#4b5650; --ink-faint:#6f7a73;
    --paper:#f2efe4; --surface:#ffffff; --surface-2:#e9e4d4; --line:#d8d2c0;
    --board-bg:#14181a; --board-fg:#e7a53f; --board-sub:#c99a4f;
    --accent:#2f6a85; --accent-ink:#1f4a5e; --accent-soft:#d9e6ea; --deep:#24303a; --deep-fg:#eef1f3;
    --good:#2f7a4c; --bad:#a3352f; --on-accent:#ffffff;
    --font-display:'Fraunces',Georgia,serif; --font-body:'Karla',system-ui,-apple-system,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --radius-m:14px; --radius-l:20px;
    --shadow-card:0 1px 2px rgba(28,35,32,.06), 0 6px 20px -10px rgba(28,35,32,.2);
    --nav-h:56px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eef0ea; --ink-soft:#b9c0b6; --ink-faint:#8d978f;
      --paper:#181b16; --surface:#20241f; --surface-2:#2a2e26; --line:#383d33;
      --board-bg:#0d0f10; --board-fg:#f0b34c; --board-sub:#c99a4f;
      --accent:#7bb2c9; --accent-ink:#cfe4ec; --accent-soft:#1d2e34; --deep:#141c22; --deep-fg:#eef1f3;
      --good:#5cbf85; --bad:#e07272; --on-accent:#0f1a20;
      --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 6px 20px -10px rgba(0,0,0,.5);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#eef0ea; --ink-soft:#b9c0b6; --ink-faint:#8d978f;
    --paper:#181b16; --surface:#20241f; --surface-2:#2a2e26; --line:#383d33;
    --board-bg:#0d0f10; --board-fg:#f0b34c; --board-sub:#c99a4f;
    --accent:#7bb2c9; --accent-ink:#cfe4ec; --accent-soft:#1d2e34; --deep:#141c22; --deep-fg:#eef1f3;
    --good:#5cbf85; --bad:#e07272; --on-accent:#0f1a20;
    --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 6px 20px -10px rgba(0,0,0,.5);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:16px; margin:0; line-height:1.5; -webkit-tap-highlight-color:transparent; overflow-x:hidden;}
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance; font-weight:600; margin:0;}
  button{font-family:inherit; font-size:inherit; color:inherit; touch-action:manipulation;}
  button:focus-visible,summary:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  [hidden]{display:none !important;}
  @media (prefers-reduced-motion: reduce){ *{transition-duration:0.001ms !important; animation-duration:0.001ms !important; scroll-behavior:auto !important;} }
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}

  /* top bar */
  .appbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--paper); border-bottom:1px solid var(--line);}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 16px;}
  .brand{display:flex; align-items:center; gap:10px; min-width:0; background:none; border:none; padding:0; cursor:pointer; color:inherit;}
  .brand-mark{width:30px; height:30px; flex:0 0 auto; border-radius:8px; background:var(--deep); color:var(--deep-fg); display:flex; align-items:center; justify-content:center;}
  .brand-mark svg{width:18px; height:18px;}
  .brand-name{font-family:var(--font-display); font-weight:600; font-size:1.08rem; white-space:nowrap;}
  .mini-countdown{font-family:var(--font-mono); font-size:.74rem; color:var(--ink-soft); white-space:nowrap; font-variant-numeric:tabular-nums;}
  .mini-countdown b{color:var(--ink); font-size:.9rem;}
  button.mini-countdown{background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 10px; min-height:32px; cursor:pointer;}
  .board[role="button"]{cursor:pointer;}
  .board[role="button"]:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  .date-dialog{border:none; border-radius:var(--radius-l); padding:20px; width:min(92vw,380px); background:var(--surface); color:var(--ink); box-shadow:var(--shadow-card);}
  .date-dialog::backdrop{background:rgba(0,0,0,.45);}
  .date-dialog h2{margin:0 0 6px; font-size:1.25rem;}
  .date-dialog p{margin:0 0 14px; color:var(--ink-soft); font-size:.92rem;}
  .date-dialog label{display:block; font-family:var(--font-mono); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px;}
  .date-dialog input{width:100%; box-sizing:border-box; min-height:48px; padding:10px 12px; font-size:1rem; border:1px solid var(--line); border-radius:var(--radius-m); background:var(--paper); color:var(--ink);}
  .date-actions{display:flex; gap:10px; margin-top:16px;}
  .date-actions .btn{flex:1;}

  /* main column */
  main{max-width:640px; margin:0 auto; padding-inline:16px; padding-block:18px calc(env(safe-area-inset-bottom,0px) + 28px);}
  .panel{display:flex; flex-direction:column; gap:16px;}
  .panel-head h1{font-size:1.6rem; line-height:1.2;}
  .panel-head p{margin:6px 0 0; color:var(--ink-soft); font-size:.95rem;}
  .eyebrow{font-family:var(--font-mono); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px;}

  /* departure-board countdown */
  .board{background:var(--board-bg); border-radius:var(--radius-l); padding:18px; color:var(--board-fg); display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow-card);}
  .board-row{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px;}
  .board-label{font-family:var(--font-mono); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--board-sub);}
  .board-window{font-family:var(--font-mono); font-size:.74rem; color:var(--board-sub);}
  .board-digits{display:flex; gap:5px;}
  .board-cell{font-family:var(--font-mono); font-weight:700; font-size:2.6rem; background:linear-gradient(#1d2224,#101314); color:var(--board-fg);
    border-radius:6px; width:1.15em; text-align:center; position:relative; line-height:1.3; box-shadow:inset 0 0 0 1px #000;}
  .board-cell::after{content:""; position:absolute; left:0; right:0; top:50%; height:2px; background:#000; opacity:.55;}
  .board-status{font-family:var(--font-mono); font-size:.8rem; color:var(--board-fg); opacity:.85;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px; box-shadow:var(--shadow-card);}
  .card h3{font-size:1.05rem; margin-bottom:8px;}
  .card p{margin:0; color:var(--ink-soft); font-size:.92rem;}

  .stat-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stat-tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px;}
  .stat-tile .num{font-family:var(--font-mono); font-size:1.4rem; font-weight:700; font-variant-numeric:tabular-nums;}
  .stat-tile .lbl{font-size:.78rem; color:var(--ink-soft); margin-top:2px;}

  .start-list{display:flex; flex-direction:column; gap:10px;}
  .start-item{display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px 16px; cursor:pointer; min-height:64px;}
  .start-item:active{background:var(--surface-2);}
  .start-item .si-icon{width:40px; height:40px; flex:0 0 auto; border-radius:10px; background:var(--accent-soft); color:var(--accent-ink); display:flex; align-items:center; justify-content:center;}
  .start-item .si-icon svg{width:22px; height:22px;}
  .start-item .si-body{flex:1; min-width:0;}
  .start-item .si-title{font-weight:700; font-size:.98rem;}
  .start-item .si-sub{font-size:.82rem; color:var(--ink-soft);}
  .start-item .si-go{color:var(--ink-faint); font-size:1.2rem;}

  .hist-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:.9rem;}
  .hist-row:last-child{border-bottom:none;}
  .hist-row .h-label{flex:1; min-width:0; font-weight:600;}
  .hist-row .h-date{font-family:var(--font-mono); font-size:.72rem; color:var(--ink-faint);}
  .hist-row .h-score{font-family:var(--font-mono); font-weight:700; width:58px; text-align:right; font-variant-numeric:tabular-nums;}
  .empty{color:var(--ink-faint); font-size:.9rem; margin:0;}

  /* chips: horizontal scroll strip on phones */
  .chip-strip{display:flex; flex-direction:column; gap:8px;}
  .chip{display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius-m); padding:12px 14px; min-height:52px; font-size:.95rem; font-weight:600; cursor:pointer; color:var(--ink);}
  .chip .chip-no{flex:0 0 auto; width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:.8rem; font-weight:700;}
  .chip .chip-t{flex:1; min-width:0;}
  .chip.active .chip-no{background:var(--on-accent); color:var(--accent);}
  .chip.active{background:var(--accent); color:var(--on-accent); border-color:transparent;}

  /* study accordion */
  .module-intro{font-size:.88rem; color:var(--ink-soft); margin:0;}
  .topic{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden;}
  .topic summary{list-style:none; cursor:pointer; padding:15px 16px; display:flex; align-items:center; gap:12px; min-height:52px;}
  .topic summary::-webkit-details-marker{display:none;}
  .topic summary h3{flex:1; min-width:0; font-size:1rem; color:var(--accent-ink);}
  .topic summary .chev{flex:0 0 auto; color:var(--ink-faint); transition:transform .15s ease;}
  .topic[open] summary .chev{transform:rotate(90deg);}
  .topic .t-body{padding:0 16px 16px; margin:0; font-size:.95rem; color:var(--ink-soft); line-height:1.6;}
  .study-tools{display:flex; gap:8px;}
  .sum-chips{display:flex; flex-wrap:wrap; gap:6px;}
  .sum-chip{border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); border-radius:999px; padding:7px 13px; font-size:.85rem; font-weight:700; cursor:pointer; min-height:36px;}
  .sum-chip[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); border-color:transparent;}
  .sum-group{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px 16px;}
  .sum-group h3{font-size:1rem; color:var(--accent-ink); margin-bottom:6px;}
  .sum-group ul{margin:0; padding-left:1.1em; display:flex; flex-direction:column; gap:5px;}
  .sum-group li{font-size:.93rem; color:var(--ink-soft); line-height:1.5;}
  .sum-group li b{color:var(--ink); font-weight:700;}
  .sum-group li::marker{color:var(--accent);}
  .study-tools .btn{flex:1;}

  /* buttons */
  .btn{border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:12px 18px; min-height:48px; font-size:.95rem; font-weight:700; cursor:pointer;}
  .btn:active{background:var(--surface-2);}
  .btn-primary{background:var(--accent); color:var(--on-accent); border-color:transparent;}
  .btn-primary:active{filter:brightness(.92); background:var(--accent);}
  .btn-block{width:100%;}
  .btn-small{min-height:40px; padding:8px 14px; font-size:.85rem;}
  .btn-row{display:flex; flex-direction:column; gap:10px;}

  /* quiz */
  .quiz-top{display:flex; align-items:center; gap:12px;}
  .quiz-progress{flex:1; font-family:var(--font-mono); font-size:.76rem; color:var(--ink-faint); font-variant-numeric:tabular-nums;}
  .quiz-timer{font-family:var(--font-mono); font-size:.8rem; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink-soft);}
  .quiz-timer.over{color:var(--bad);}
  .quit-btn{background:none; border:1px solid var(--line); border-radius:999px; padding:6px 12px; min-height:36px; font-size:.78rem; font-weight:600; color:var(--ink-soft); cursor:pointer;}
  .quit-btn.armed{border-color:var(--bad); color:var(--bad);}
  .bar{height:6px; background:var(--surface-2); border-radius:999px; overflow:hidden;}
  .bar span{display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .2s ease;}
  .quiz-q{font-family:var(--font-display); font-size:1.22rem; font-weight:600; line-height:1.35; text-wrap:pretty;}
  .opts{display:flex; flex-direction:column; gap:10px;}
  .opt{display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius-m); padding:14px 16px; min-height:56px; cursor:pointer; font-size:1rem; line-height:1.4;}
  .opt:active:not([disabled]){background:var(--surface-2);}
  .opt .letter{font-family:var(--font-mono); font-weight:700; color:var(--accent-ink); flex:0 0 auto; width:1.2em;}
  .opt.correct{border-color:var(--good); background:color-mix(in srgb, var(--good) 14%, var(--surface));}
  .opt.wrong{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, var(--surface));}
  .opt[disabled]{cursor:default; color:var(--ink);}
  .explain{background:var(--surface-2); border-radius:12px; padding:14px; font-size:.93rem; line-height:1.5;}
  .explain b{display:block; margin-bottom:2px;}
  .explain.good b{color:var(--good);} .explain.bad b{color:var(--bad);}
  .next-bar{position:sticky; bottom:calc(env(safe-area-inset-bottom,0px) + 12px); z-index:5;}
  .next-bar .btn{box-shadow:var(--shadow-card);}
  .result{text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center;}
  .result-score{font-family:var(--font-mono); font-size:3rem; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1;}
  .result-pass{font-size:.95rem; font-weight:600;}
  .result-pass.good{color:var(--good);} .result-pass.bad{color:var(--bad);}
  .miss-list{display:flex; flex-direction:column; gap:8px; text-align:left; width:100%;}
  .miss-list h3{font-size:1rem;}
  .miss-item{border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:12px 14px; font-size:.9rem; color:var(--ink-soft);}
  .miss-item b{display:block; color:var(--ink); margin-bottom:4px;}
  .miss-item .ans{display:block; color:var(--good); font-weight:600; margin-bottom:4px;}

  /* bottom tab bar */
  .tabbar{display:grid; grid-template-columns:repeat(5,1fr); max-width:640px; margin:0 auto; padding:0 8px;}
  .tabbar button{background:none; border:none; border-bottom:3px solid transparent; height:var(--nav-h); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:.68rem; font-weight:700; color:var(--ink-faint); cursor:pointer; padding:0 2px;}
  .tabbar button svg{width:24px; height:24px;}
  .tabbar button[aria-current="page"]{color:var(--accent); border-bottom-color:var(--accent);}
  .back-home{margin-top:8px;}
  .tabbar button[aria-current="page"] svg{stroke-width:2.4;}

  footer.note{color:var(--ink-faint); font-size:.78rem; margin-top:8px;}
  @media (min-width:560px){ .stat-row.four{grid-template-columns:repeat(4,1fr);} .board-cell{font-size:3.2rem;} }
</style>
<style>
  .lang-switch{display:flex; flex:0 0 auto; border:1px solid var(--line); border-radius:999px; padding:2px; background:var(--surface);}
  .lang-switch button{border:none; background:none; border-radius:999px; min-width:44px; min-height:34px; padding:0 10px; font-family:var(--font-mono); font-size:.76rem; font-weight:700; color:var(--ink-soft); cursor:pointer;}
  .lang-switch button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent);}
  .top-right{display:flex; align-items:center; gap:10px; min-width:0;}
  @media (max-width:360px){ .mini-countdown{display:none;} }
  .no-name{display:block; font-family:var(--font-mono); font-size:.72rem; letter-spacing:.04em; color:var(--ink-faint); margin-bottom:2px;}
</style>

<div class="appbar">
<header class="topbar">
  <button class="brand" id="brandHome" data-go="home">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M24 6 6 16h36L24 6Z" stroke-linejoin="round"/><path d="M10 16v20M38 16v20M18 20v14M30 20v14"/><path d="M5 40h38" stroke-linecap="round"/></svg></span>
    <span class="brand-name" data-i18n="brand"></span>
  </button>
  <div class="top-right">
    <button type="button" class="mini-countdown" id="miniCountdown"></button>
    <div class="lang-switch" role="group" aria-label="Language / Språk">
      <button id="langEn" data-lang="en" aria-pressed="true">EN</button>
      <button id="langNo" data-lang="no" aria-pressed="false">NO</button>
    </div>
  </div>
</header>
<nav class="tabbar">
  <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg><span data-i18n="navHome"></span></button>
  <button data-tab="study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg><span data-i18n="navStudy"></span></button>
  <button data-tab="sum"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span data-i18n="navSum"></span></button>
  <button data-tab="mock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span data-i18n="navMock"></span></button>
  <button data-tab="all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span data-i18n="navAll"></span></button>
</nav>
</div>

<main>
  <div class="card" id="noScript" style="border-color:var(--bad);"><h3>The page could not start</h3><p id="noScriptMsg">Scripts are turned off for this page, so the text and buttons cannot load. Open the claude.ai link in Chrome or Safari while signed in, and check that JavaScript is allowed in the browser settings.</p><p id="noScriptErr" class="mono" style="margin-top:8px;font-size:.8rem;color:var(--bad);word-break:break-word;" hidden></p></div>
  <script>
    (function(){
      var box=document.getElementById('noScript'), msg=document.getElementById('noScriptMsg'), err=document.getElementById('noScriptErr');
      msg.textContent='Loading… If this message stays, the study content failed to load on this device. Send the line below to get it fixed.';
      err.hidden=false; err.textContent='Script ran: step 1 of 2. Browser: '+navigator.userAgent;
      window.addEventListener('error', function(e){ box.hidden=false; err.hidden=false; err.textContent='Error: '+(e.message||e)+' (line '+(e.lineno||'?')+'). Browser: '+navigator.userAgent; });
    })();
  </script>
  <!-- HOME -->
  <section class="panel" id="p-home">
    <div class="panel-head">
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="h1"></h1>
      <p data-i18n="lede"></p>
    </div>
    <div class="board" id="countdownBoard" role="button" tabindex="0">
      <div class="board-row"><span class="board-label" data-i18n="nextTest"></span><span class="board-window" id="boardWindow"></span></div>
      <div class="board-row" style="align-items:center;"><div class="board-digits" id="boardDigits"></div><div class="board-status" id="boardStatus"></div></div>
    </div>
    <div class="stat-row four" id="homeStats"></div>
    <div class="start-list">
      <button class="start-item" data-go="study">
        <span class="si-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg></span>
        <span class="si-body"><span class="si-title" data-i18n="goStudyT"></span><br><span class="si-sub" data-i18n="goStudyS"></span></span><span class="si-go">›</span>

<script>
const CIVIC_MODULES = [
  {id:'m1', title:'Utdanning, kompetanse og arbeidsliv', topics:[
    ['Right to education','Children have both a right and a duty to attend grunnskole (primary and lower secondary school) from age 6 to 16, free of charge. Everyone who has completed grunnskole has the right to upper secondary school (videregående), which is free at public schools, and adults also have rights to further education, including Norwegian language training.'],
    ['Working life and unions','Most employees can join a fagforening (labour union). Collective agreements (tariffavtaler) set pay and conditions in many sectors, and about half (ca. 50%) of all employees are members of a union. The Working Environment Act (arbeidsmiljøloven) protects working hours, health and safety, and against unfair dismissal.'],
    ['Tax-financed welfare','Schools, healthcare, and NAV benefits (unemployment, sick pay, pension) are financed mainly through taxes. Norway uses a progressive income tax system as the backbone of its welfare state (velferdsstaten).'],
    ['Personal data and copyright','Personal data is protected by law — you generally need a legal basis or someone’s consent to collect or share their information, including photos. Creative works (åndsverk) are automatically protected by copyright; copying them without permission is not allowed.'],
    ['Digital literacy and critical thinking','Kildekritikk — critically evaluating information sources — matters for spotting misinformation online. Many Norwegian public services are digital-first, and BankID is widely used to log in securely.'],
    ['School values and cooperation','Norwegian schools value cooperation and equality between pupils; physical punishment of pupils is illegal. Foreldresamarbeid (parent–school cooperation), such as parent-teacher conferences, is a normal part of school life. The school’s objects clause (formålsparagraf) builds on basic values in Christian and humanist heritage and tradition, such as respect for human dignity and nature, and on intellectual freedom (åndsfrihet), charity (nestekjærlighet), forgiveness, equality and solidarity. All pupils have an equal right to education, and no distinction may be made between pupils because of where they live, their family background or their gender. Pupils who need extra help should get it; there are few special schools in Norway, and most children get the help they need at their local school.'],
    ['Where to learn Norwegian','Beyond formal courses, workplaces, libraries, and everyday interactions all count as valuable arenas for learning the language. If you accept a language-practice placement (språkpraksis) at a workplace, you get a unique chance to learn the language in a natural setting.'],
    ['Kindergartens (barnehage)','All activities in a barnehage are governed by the Kindergarten Act and are meant to build on Christian and humanist values, human rights, and respect for nature. Running a kindergarten is expensive; the municipality covers most of the cost and the Storting sets a maximum price (maksepris) for what parents pay, with a lower price for siblings (søskenmoderasjon) and reduced payment or free core hours for low-income families. Parents who don’t speak Norwegian have the right to an interpreter at parents’ meetings (foreldremøter). Most children aged 1–5 attend barnehage. It is a pedagogical service, not just childcare: it prepares children for school, and it must promote democracy and equality and work against all forms of discrimination.'],
    ['Primary and lower secondary school facts','All children have a right to 13 years of education in total; the ten years of grunnskole (grades 1–10) are compulsory and free. Children start school in August of the year they turn six, move up automatically every year with no repeating, and wear no uniform. Pupils get oral/written feedback but no grades in primary school (grades 1–7); from lower secondary (grades 8–10) they receive grades on a 1–6 scale (6 best) plus separate grades for orderliness and conduct (good/fair/poor). Corporal punishment is banned in schools and at home. Fewer than 5% of pupils attend fee-paying private schools; the rest attend free public schools following the same national curriculum set by the Storting.'],
    ['School subjects and teaching methods','Primary and lower secondary pupils study mathematics, Norwegian, English, a foreign language, science, social studies, physical education (kroppsøving), KRLE (Christianity, religion, philosophies of life and ethics), arts and crafts, music, food and health, and elective subjects. Teaching often happens outside the classroom too — walks, school camps, swimming lessons, museum visits — and pupils work extensively in groups and projects, meant to build cooperation skills and prepare them to participate in a democracy.'],
    ['Cooperation between home and school','Parents keep the main responsibility for their children, but school and home share responsibility for a child’s upbringing and learning. Pupil, parents and teacher must hold a development talk (utviklingssamtale) about the child’s progress and wellbeing at least twice a year, and parents are expected to read and act on written information from the school. Real tensions can arise — e.g. parents keeping children out of gym/swimming lessons, extending summer holidays into term time, or opting children out of school-camp activities — and schools flag these as challenges to the cooperation.'],
    ['Upper secondary school and its two tracks','Everyone who has completed grunnskole has the right to upper secondary education (videregående) until they achieve either the Higher Education Entrance Qualification (studiekompetanse) or a vocational qualification (yrkeskompetanse); public upper secondary school is free, though a few fee-paying private schools exist. Applications go in online before 1 March, and grade 10 results decide which school a pupil can attend. Pupils choose between a vocational programme (yrkesfag), ending in a craft certificate (fagbrev) for trades like carpenter, hairdresser, healthcare worker or car mechanic, or a general studies programme (studiespesialisering), a theoretical track that qualifies for university admission.'],
    ['Higher education and Lånekassen','About 42% of Norwegian adults have higher education, women make up about 60% of students and have a slightly higher education level than men, and Norwegian-born people with immigrant parents take higher education at above-average rates. Admission to free public universities and university colleges (students pay only for books) is coordinated centrally through Samordna opptak, and the application deadline is 15 April. Because tuition is free but living costs money, most students borrow from the State Educational Loan Fund (Lånekassen), founded in 1947 so that anyone can study regardless of background; part of what is borrowed can convert to a non-repayable grant if the student passes their exams, while loans are repaid in instalments after finishing.'],
    ['Adult education and recognition of prior learning','Adults who have not completed grunnskole have the right to free preparatory education for adults (forberedende opplæring for voksne, FOV), which the municipality must provide. Those aged 25 or older who have completed grunnskole (in Norway or another country) but not upper secondary have the right to free upper secondary education through their county, alongside fee-paying private options, and many can get grants and/or loans from Lånekassen while they study. Foreign qualifications can be recognised via the Directorate for Higher Education and Skills (HK-dir), with health personnel authorised separately through the Directorate of Health. Skills gained outside formal education can also be assessed as realkompetanse (prior learning and work experience), which can shorten a course of study, grant admission, or lead to a new job or higher pay — the guiding idea is lifelong learning (livslang læring).'],
    ['Norwegian language levels and rights','Norwegian proficiency for the introduction programme is measured on the Common European Framework scale: A1 and A2 (basic user), B1 and B2 (independent/competent user). Whether your tuition is free and compulsory, or something you must pay for yourself, depends on your residence permit. Tuition must finish within three years (18 months for participants who already have upper secondary or higher education), ending with a Norwegian test that documents the level reached; your target level is set based on your education level on arrival and can be adjusted as you progress.'],
    ['Trade unions and workplace democracy','About half of Norwegian employees belong to a trade union (fagforening). Unions negotiate pay and conditions with employers; if negotiations fail, employees have the right to strike. Norwegian working life is built around employee participation — individual workers have the right to be heard about their own work situation, and every workplace must organise health, safety and environment (HSE/HMS) work through an employee representative, a dedicated safety representative (verneombud), and a management representative.'],
    ['The Working Environment Act and the Holidays Act','The Working Environment Act (arbeidsmiljøloven) covers hiring and contracts, working hours, absence, and HSE, and gives the employer overall responsibility for the working environment while requiring employees to help maintain it. The Holidays Act (ferieloven) gives every employee at least four weeks and one day of paid holiday a year (many get five weeks through their tariffavtale); holiday pay (feriepenger), not ordinary salary, is paid during the holiday and is calculated from what you earned the previous year.'],
    ['Laws, agreements and pay','Laws for working life are passed by the Storting and apply to all employers and employees, while agreements (avtaler) are negotiated between the employers’ and the employees’ organisations and apply only to the industries that made them. Under the Working Environment Act, employees also have duties: to help create a good working environment, to take part in the measures introduced to improve it, and to join in the organised safety and environment work. Pay is a matter of negotiation, either directly between employer and employee or between their representatives, often the union. Pay is usually paid into a bank account on a fixed date once a month, with a payslip (lønnsslipp) showing your pay and the tax deducted. Gross pay (bruttolønn) is pay before tax and net pay (nettolønn) is pay after tax. Everyone who earns more than a minimum amount a year must pay tax, and it is your own responsibility to make sure the Tax Administration has correct information about you.'],
    ['NAV and the welfare state in practice','NAV (the Labour and Welfare Administration) has an office in every municipality and administers roughly a third of the national budget with about 22,000 employees, covering sick pay, unemployment benefit, introduction benefit, pensions, child benefit, cash-for-care benefit (kontantstøtte), social assistance and more, and it also helps people qualify for work. The state and the municipalities have the main responsibility for providing welfare. The welfare state is built on the idea of equal worth (likeverd), and politicians decide which schemes exist, so the schemes can change depending on who is in power and on the economy. The system runs on mutual trust — the state trusts people not to abuse benefits, and people trust the state to help them when they need it — and it depends on as many people as possible working and paying tax. Around a third of everyone in work in Norway is employed in the public sector, in jobs like teaching, healthcare and NAV casework.'],
    ['Pay, tax cards and the tax return','Average gross annual pay in Norway was just under NOK 670,000 before tax in 2023, with women on average earning less than men, partly because of more part-time work. Most employees pay 30–40% of their pay in tax; the Tax Administration (Skatteetaten) calculates this from your tax card (frikort, prosentkort or tabellkort), which your employer downloads digitally. Every March/April you receive a digital tax return (skattemelding) summarising your income, deductions, wealth and debt from the previous year — check it, and you get a refund if you overpaid or a bill if you underpaid.'],
    ['Employment contracts and undeclared work','Everyone who takes a job is entitled to a written employment contract stating the position, pay and working hours, signed by both employer and employee — without one you cannot claim NAV unemployment benefit even if you paid tax. Undeclared work (svart arbeid) — working without a contract and without paying tax — is illegal and considered economic crime for both employer and employee, and it strips the worker of sick pay, holiday pay, pension points, unemployment benefit, accident insurance, loan eligibility and any documented work history.'],
    ['How the Norwegian labour market has changed','150 years ago, agriculture, forestry and fishing dominated; by 1950 over 20% worked in agriculture, versus under 3% today, even though Norway now produces more food thanks to mechanisation. Industrialisation drew people to cities in the late 1800s, and after oil was discovered in the North Sea in the late 1960s, oil and gas became central to the economy. Over the last 30 years, industrial jobs have declined further and most jobs are now in service occupations — shops, healthcare, schools, kindergartens, transport and IT — while climate change is pushing a transition toward "green" jobs.'],
    ['Applying for a job: CV, application and interview','A Norwegian job application (søknad) is a short letter about yourself and your background; the CV briefly lists your work experience and education — both should be accurate and written in correct Norwegian. Employers weigh experience, references, personality fit and suitability, not only formal qualifications, and usually invite candidates to one or more interviews. Interview etiquette includes arriving on time, dressing appropriately, giving a firm handshake and eye contact, and being positive and building rapport.'],
    ['Finding work through your network','Between 60 and 80% of jobs in Norway are filled through personal networks rather than open advertisements, so alongside checking nav.no and finn.no, building a network — family, friends, former colleagues, neighbours, teachers, case officers — matters for finding work. Newcomers who lack references or a network often start with temping agencies, practical training placements, or short-term/casual jobs to build both.'],
    ['Source criticism and ethical awareness','Kildekritikk means asking who wrote a text, whether they have an agenda, what they want to achieve, whether the information is accurate, and whether it leaves out important facts. Norwegian schools actively train pupils to question and challenge established truths rather than just repeat what they are told, while acknowledging their own knowledge may be incomplete. Etisk bevissthet (ethical awareness) means weighing different considerations against each other so you can make better decisions for society, the people around you and yourself; if you reuse someone else’s text, photos or music you must credit who holds the copyright.'],
    ['Data protection, BankID and digital judgement','Data protection (personvern) is the right to privacy and to control your own personal data — your name, address, phone number, ID number and ethnicity are all personal data, and this right is protected under the European Convention on Human Rights. Norwegians log into banking, government services and shopping using BankID, passwords, fingerprints or facial recognition, leaving digital traces that are stored and could be misused if stolen. Freedom of speech online is real but not unlimited — racist or discriminatory statements are against the law — and good digital judgement (digital dømmekraft) means only posting what you would be willing to say to someone’s face, and always asking permission before sharing photos of other people.'],
    ['Notice periods, sick pay and holidays — the rules','The legal minimum notice period (oppsigelsestid) is one month. It rises to two months after five years with the same employer and three months after ten years (longer for older employees with long service), unless the contract or tariff agreement gives more. A normal full-time week is 37.5 hours. If you are ill, sick pay (sykepenger) normally equals your full salary up to a ceiling of six times the National Insurance basic amount (6G): the employer pays the first 16 days and NAV pays after that. The Holidays Act also covers when holiday can be taken, illness during holiday (you can ask to take the lost days later) and holiday during a notice period, and holiday pay (feriepenger) is based on what you earned the year before.'],
    ['Who collects tax and what it pays for','Income tax is shared between the municipality you live in, the county and the state, and employers also pay an employer’s contribution (arbeidsgiveravgift) on top of wages. Your employer deducts tax from your pay every month and transfers it to the public sector; the Tax Administration (Skatteetaten) issues tax cards and calculates your tax from the information it holds. Taxes and duties (skatter og avgifter) are the main source of funding for welfare goods such as schools, hospitals, roads, pensions and NAV benefits, while most oil income is saved in the Government Pension Fund Global. Working without paying tax (svart arbeid) is illegal.'],
    ['Vocational training, apprentices and which jobs need university','Most vocational programmes in upper secondary school follow the 2+2 model: two years at school, then two years as a paid apprentice (lærling) in a company, ending with a trade or journeyman’s certificate (fagbrev or svennebrev). General studies end with a diploma (vitnemål) that qualifies you for higher education. About half of pupils choose each track, and nearly 80 per cent complete upper secondary education. Trades such as plumber (rørlegger), electrician, carpenter and healthcare worker (helsefagarbeider) are learned through upper secondary school, while professions such as nurse, teacher, engineer, doctor and dentist require higher education. You apply for university and university college places through Samordna opptak (samordnaopptak.no) and for student loans and grants through Lånekassen.']
  ]},
  {id:'m2', title:'Familie, helse og hverdagsliv', topics:[
    ['Children’s rights','The Children Act (barneloven) gives children the right to be heard and to be protected from violence. Physical punishment of children by parents is illegal in Norway. The Act applies to children under 18: every birth is reported to the Folkeregisteret, parents have the main responsibility and must provide food, clothes and what the child needs for a good life until age 18, must make sure the child attends compulsory schooling, and the child has a right to contact (samvær) with both parents even if they live apart. Barnehage, school and leisure activities also influence children, but parents have the main responsibility for raising them; in the past children were seen as «small adults» who had to work to help the family’s income, while today childhood is a time for play and learning.'],
    ['Public agencies supporting families','Barnehage (kindergarten, with a right to a place from around age 1), skole (school), helsestasjon (free child health check-ups and vaccinations), NAV (welfare and benefits), and barnevernet (child welfare services, which can step in if a child’s safety is at risk) all support families.'],
    ['Health and healthcare','Everyone is assigned a fastlege (regular GP). For urgent but non-emergency care, contact legevakt; call 113 for an ambulance, 112 for police, 110 for fire. Healthcare is mainly public and tax-funded, with a small co-payment (egenandel) capped yearly (frikort).'],
    ['Lifestyle, migration and mental health','Diet, sleep and exercise affect physical health, and migration-related stress is a recognised challenge. Support is available through your fastlege, helsestasjon, and mental health services (psykisk helsetjeneste). Public health in Norway has improved greatly over the last 100 years and people live longer, but cancer and cardiovascular disease are the most common causes of death, diabetes and obesity are growing problems, and smoking raises the risk of both cancer and heart disease. Health workers see that more immigrants than other Norwegians have diabetes, obesity, poor dental health, malnutrition (especially lack of iron and vitamin D) and depression. You yourself have a large responsibility for your own health; the health service gives advice and guidance. Mental health is as important as physical health: poor mental health can cause physical problems such as stomach pain or poor sleep, the GP can refer you to a psychologist (who also has a duty of confidentiality), and most people in Norway today are open and understanding about mental illness and believe it should be treated like physical illness.'],
    ['Newcomer rights and duties','Under the Integration Act (integreringsloven), newly arrived refugees have a right — and while receiving introduction benefit, a duty — to take part in introduksjonsprogrammet, which combines Norwegian training with steps toward work.'],
    ['Personal economy','Work, income and consumption shape your living standard. Making a budget and avoiding unnecessary consumer debt matters; NAV and municipal debt counselling (gjeldsrådgivning) can help if things get difficult. Most adults get wages, benefits or a pension once a month. Housing takes just over 35 per cent of an average household’s spending and food about 11 per cent (SSB, 2022). Living in Norway is expensive, so in most families both parents work outside the home, and both adults are responsible for the family’s finances.'],
    ['Harmful practices','Domestic violence (vold i nære relasjoner), forced marriage (tvangsekteskap) and female genital mutilation are illegal in Norway, regardless of culture or religion. Free, confidential help is available at a krisesenter (crisis shelter), and schools have minoritetsrådgivere (minority counsellors).'],
    ['Family planning and sexual identity','Contraception and family-planning advice are available, including youth health clinics. LGBT+ rights are protected by the Equality and Anti-Discrimination Act, and same-sex marriage has been legal since 2009.'],
    ['Housing in Norway','Around 82 per cent of households own their home and 18 per cent rent. The two common ownership forms are selveierbolig (freehold — you can renovate or rent it out without asking anyone, and pay all costs yourself: municipal fees, home insurance and upkeep) and borettslag (housing cooperative — you own a share with the sole right to use your home, pay an innskudd (deposit) when you buy, then a monthly rent/felleskostnader covering your share of the shared debt, municipal fees and building insurance, and must follow the cooperative’s rules). Buying normally needs egenkapital (own capital) of about 10 per cent of the price, with the bank lending the rest once it has checked you can cover the instalments (avdrag) and interest (rente).'],
    ['Coming to Norway: residence and citizenship','An innvandrer (immigrant) is someone born abroad who lives in Norway. EU/EEA citizens can work without a residence permit but must register with the police online. Refugees arrive either as overføringsflyktninger (resettlement/quota refugees, through the UN’s UNHCR) or as asylum seekers, who can be granted asylum if they are individually persecuted because of race, religion, nationality, sexual orientation or political activity, or residence on strong humanitarian grounds (both groups, and resettlement refugees, are called refugees in everyday speech). Family members of someone with a residence permit can apply for familiegjenforening (family reunification). For the first three or five years you get a temporary residence permit, which usually has to be renewed every year; after three or five years you can apply for permanent residence (permanent oppholdstillatelse), and after six to eight years you can apply for Norwegian citizenship, and UDI (udi.no) handles applications and guidance.'],
    ['The introduction programme in detail','Introduksjonsprogrammet normally lasts from three months up to three years, depending on the participant’s background, and pays introduksjonsstøtte (introduction benefit) throughout. It is run by municipalities, mainly for refugees — not all immigrants qualify. Parents of children under 18 (or expecting a child) must also complete foreldreveiledning (mandatory parent guidance), given either in a group (8–12 meetings of at least one hour each) or individually (5–8 sessions of at least 45 minutes each). The programme must include Norwegian training, help with livsmestring (coping with life in a new country), parent guidance and work- or education-oriented content; its goals are basic Norwegian skills, basic insight into Norwegian society and preparing participants for work or education. Integreringsloven was passed by Stortinget and gives the municipalities the task of offering the programme.'],
    ['Marriage, cohabitation and divorce','About 70 per cent of couples in Norway are married and 30 per cent are samboer (cohabiting without marrying); around 20,000 couples marry each year, and roughly 40 per cent of marriages are expected to end in divorce, which normally requires a year of separation first (immediately, if the marriage involved force or violence). Since 2009, two people of the same sex can marry. Married couples have a duty to support each other, are both responsible for loans they take out, and own what they buy together — even if only one of them works outside the home — and after a divorce both parents have the duty and right to care for the children. For children born from 1 January 2020, both parents have joint parental responsibility whether they are married, cohabiting, or living apart — and unlike spouses, samboere do not automatically share financial or legal rights, so many make separate agreements.'],
    ['Children’s growing say as they grow up','Under barneloven, children have the right to be heard before decisions affecting them from around age 7, and their opinion carries significant weight from age 12. From age 15, young people can decide for themselves about their education and about joining or leaving organisations. Parents keep overall parental responsibility until the child turns 18, but must give the child increasing say as they mature.'],
    ['The child welfare service (barnevernet)','Norway was the first country in the world to set up a public child welfare service, under a law (vergerådsloven) from 1900. Barnevernet operates in every municipality, can offer support such as guidance or respite care on request, and can step in to protect a child — ideally together with the family, or through alternative care if needed. Staff have a duty of confidentiality, but professionals who work with children must report suspected violence or abuse, and anyone concerned about a child can contact barnevernet; the municipal child welfare service is open in the daytime, and in the evening, at night and at weekends children or anyone worried about a child can call the alarm line for children and young people, 116 111.'],
    ['Health services and patient rights','Everyone living in Norway has a fastlege and can switch GP up to twice a year via helsenorge.no. A regular GP visit typically costs 150–300 kroner, but visits for children under 16 and antenatal check-ups are free; once your yearly patient charges pass a threshold, you get a frikort (exemption card) and further public healthcare is free for the rest of the year. Call legevakt on 116 117 for urgent but non-emergency care when your GP is closed, and 113 for a medical emergency (speak calmly and say who you are, what has happened and where you are). The public health service means the state takes responsibility for everyone getting the treatment they need regardless of personal finances; private services also exist, but you pay for them yourself. You normally need a referral from your GP to see a specialist such as a gynaecologist, dermatologist or ENT doctor. Hospital treatment, food and accommodation are free once you are admitted (a parent often stays with a child in hospital), poliklinisk treatment means treatment at a hospital without being admitted, healthcare staff and interpreters are bound by confidentiality, and patients can see their own medical records — from age 16 a young person decides who else, including parents, can access their health information.'],
    ['Dental health','Public dental check-ups are free for children and young people up to age 19, though parents pay a patient charge for braces. From 19, young adults pay 25 per cent of the cost of treatment in the public dental service and the public sector pays 75 per cent; adults beyond this pay full price and arrange their own dentist, ideally with an annual check-up. Everyone should brush twice a day, and sugary or acidic food and drink (sweets, fizzy drinks, juice) damage teeth — poor milk teeth also raise the risk of poor adult teeth, so parents are responsible for children’s dental hygiene from before the first tooth appears.'],
    ['Pregnancy, vaccination and child health checks','Contraception methods include the pill and implant (hormones that stop ovulation), the coil (fitted by a doctor), and the condom — the only method that also protects against sexually transmitted infections. Pregnant women get free, voluntary antenatal care (typically 8–12 check-ups) and free hospital births. Helsestasjon follows up children aged 0–5 (growth, vision, hearing, language, vaccination) and skolehelsetjenesten continues this through school; vaccination is free and strongly recommended but needs parental consent. Under the Abortion Act, a woman can end a pregnancy on request up to week 18; after that, approval is required.'],
    ['The three phases of moving to a new country','Moving abroad is often described in three phases: an initial "honeymoon" phase of excitement about new possibilities; a harder phase, sometimes after weeks or months, marked by insecurity, tiredness with the differences and homesickness; and an adaptation phase, where language and understanding of Norwegian systems improve and old and new values start to fit together. Family members often move through these phases at different times and speeds, which can create tension at home.'],
    ['Living in two cultures','Cultures are sometimes described as individualist (valuing independence, equal status and equality) or collectivist (valuing obedience, respect and good relations within the group). Children who grow up between cultures may face conflicting expectations from parents and from Norwegian society about what counts as polite or correct behaviour.'],
    ['Social arenas and unwritten rules','Social arenas are places where people meet to be together: family, school, work, cafés, courses, choirs and organisations. The course calls the two culture types jeg-kulturer (the individual matters most) and vi-kulturer (the group matters most). Many children take part in organised activities such as sports clubs, bands and scouts, where parents often help out as coaches or drivers — a good way for newcomers to get to know people. Voluntary work is unpaid, usually for short periods (nobody volunteers full-time), and often linked to organisations with a socially useful purpose such as the Red Cross; many Scandinavians volunteer, and organisations work as training in democracy (meetings, elections, votes). Dugnad is an old custom, and most farming societies in the world have a similar tradition. Unwritten rules differ between cultures: in Norway both men and women shake hands when they meet and when they part, a common greeting is «Hei, hvordan går det?» – «Takk, bare bra. Og med deg?», and Norwegians rarely visit friends without arranging a specific day and time in advance.'],
    ['Norway’s population','About 5.6 million people live in Norway. About one million of them (around 18 per cent of the population) were born abroad or have parents born abroad, and around half of the immigrants in Norway have Norwegian citizenship. A little over a hundred years ago people in Norway were very poor, yet Norway still had the world’s highest life expectancy; today the standard of living is among the highest in the world, most people have a decent economy, and the welfare state gives help and services when people need them.'],
    ['Leisure time, dugnad and civic engagement','Fritid (spare time) is the part of the day not spent working, eating or sleeping. Dugnad — unpaid, voluntary community work such as spring-cleaning a borettslag or helping out at a barnehage — was voted Norway’s national word in 2004; it is technically voluntary, but skipping it can bring social consequences. Common social arenas for building networks include idrettslag (sports clubs), korps (bands), speider (scouts) and voluntary organisations like the Red Cross. Political engagement can be formal (party membership, election campaigns) or informal (petitions, protests, social media), and young Norwegians are more politically active than before: turnout among the youngest voters rose by more than ten per cent from 2007 to 2011 and has stayed high since, and political youth organisations have gained members. Membership in organisations also gives training in democratic processes such as discussions, board work, elections and votes. Everyone living in a democracy shares responsibility for making it work by being active and following what happens.'],
    ['Forced marriage and genital mutilation — the legal detail','Forcing someone to marry using violence, deprivation of liberty, pressure or threats carries up to 6 years’ imprisonment (helping to do so is punished the same way), and a forced marriage has no legal validity — the person forced can seek an annulment within five years. Female genital mutilation carries up to 6 years’ imprisonment, or up to 15 years in aggravated cases, and consent does not make it legal. It is also illegal to help someone do it, to take a girl out of Norway to have it done abroad, or to renew or recreate an earlier genital mutilation. Employees in many professions and in religious communities who fail to try to prevent it (avvergelsesplikt) can be punished with fines or up to a year in prison. Help is available from the GP, the helsestasjon, the police and, abroad, a Norwegian embassy; schools may have minoritetsrådgivere (minority counsellors), and help is also available from the forced marriage/FGM expert team (tel. 478 09 050) and the Red Cross helpline (tel. 815 55 201).'],
    ['Personal finance terms','Inntekt (income) covers everything paid into your account — wages, NAV benefits, child benefit, cash-for-care benefit — while utgifter (expenses) covers what you spend, from rent to food to leisure. Pay is quoted as bruttolønn (before tax) or nettolønn (after tax). Opening a bank account needs a Norwegian personal ID number or D-number, and everyday banking runs through BankID; a lån (loan) is repaid through avdrag (instalments) plus rente (interest), so a budsjett (budget) should also set aside money for savings or unforeseen costs.'],
    ['Family life in numbers','Just over 50,000 children are born in Norway every year, and the fertility rate is about 1.4 children per woman. Women are on average about 30 when they have their first child, most people marry for the first time between 30 and 40, and around 20,000 couples marry each year. The nuclear family (kjernefamilie: parents and children) is the most common family form, around 75 per cent of children live with both parents, and an average household (people who live in the same home and share finances) has just over two people. Parents who are both in paid work are together entitled to up to 61 weeks of parental benefit (foreldrepenger) in connection with a birth. Families get child benefit (barnetrygd) for every child until age 18, the same amount regardless of income, and cash-for-care benefit (kontantstøtte) for children aged 13–19 months who do not have a full-time barnehage place (a part-time place gives reduced kontantstøtte). Nearly 80 per cent of pupils in grades 1–4 attend the after-school programme (SFO); a part-time place is free, while parents normally pay for a full-time place. Most young people move away from home in their twenties, many students finish with over NOK 300,000 in student debt, an average family with children has more than NOK 2 million in housing debt, women and men have equal inheritance rights, and the retirement age is 67 for both men and women (some can retire earlier, others work until 70; the pension depends on your earlier pay, but people who never had paid work, such as homemakers, also get a pension from 67).'],
    ['Marriage, divorce and family words','You must be 18 to marry in Norway (there have been no exceptions since 2018). Both people must want to marry, neither can already be married, and both need lawful residence in Norway. You can have a civil wedding (borgerlig vigsel) through the municipality, or marry in a church or another religious or life-stance community; the couple usually pays for their own wedding. A divorce does not need both spouses to agree: normally you first get a separation and can get a divorce after one year (or straight away after two years living apart, or in cases of violence or forced marriage). A marriage settlement (ektepakt) can make property separate (særeie) instead of shared, and a will (testament) decides who inherits your belongings. Useful words: samboer (unmarried partners living together), særbo (a couple who live in separate homes), stebarn or bonusbarn (your partner’s child), bonusmamma or bonuspappa (step-parent), svigerforeldre (parents-in-law), aleneforsørger (a single parent who supports the children alone), and barnebidrag (child support that the parent the child does not live with pays to the other parent). A common access arrangement (samvær) is every other weekend plus one afternoon a week.'],
    ['Life events, traditions and everyday norms','Christening (dåp) welcomes a baby into a Christian church; families who are not religious may hold a naming ceremony (navnefest). Confirmation (konfirmasjon) happens around age 15, either in church or as a secular humanist confirmation from the Norwegian Humanist Association (Human-Etisk Forbund). It is a big family celebration paid for by the parents, and many get a bunad (national costume) for it. Funerals are normally held within ten working days of a death, and it is normal to offer condolences (kondolere) to the family. Norms are unwritten rules, for example shaking hands the first time you meet someone, being on time, keeping noise down on Sundays and public holidays (no lawn mowing or drilling), and waiting until new parents say they want visitors. Friends often greet each other with “hei”, a hug or a pat on the shoulder. Many Norwegians spend Easter in the mountains.'],
    ['Age limits to know','The age of majority (myndighetsalder) is 18: you can then vote, sign contracts, control your own money, marry and take a car driving licence. From 15 you are criminally responsible and decide yourself about your education and about joining or leaving organisations and religious communities; the age of consent is 16. You must be 18 to buy tobacco and drinks with less than 22 per cent alcohol (such as beer and wine), and 20 to buy spirits (22 per cent or more). Buying alcohol or tobacco for someone underage is illegal. Drinking alcohol in public places is usually banned by local police regulations, smoking has been banned in restaurants and bars since 2004, and carrying a knife in public without a good reason (such as work or fishing) is not allowed.'],
    ['Health costs: medicines, emergency clinics and care homes','Mild painkillers such as paracetamol and ibuprofen can be bought in small packs at grocery stores and petrol stations; most other medicines are sold only at pharmacies, many of them only with a prescription (resept), and pharmacy staff advise on how to use them. People with an illness that needs treatment for more than three months get medicine on blue prescription (blå resept) and pay only a capped co-payment. You pay a patient charge at the out-of-hours clinic (legevakt) just as at your GP, and seeing a specialist without a referral from your GP costs more. Children get free vaccines through the childhood immunisation programme. People living in nursing homes (sykehjem) pay a share based on their income. An interpreter at the doctor is free for the patient. Call 113 for a medical emergency, 112 for the police and 110 for the fire service.'],
    ['Violence, social control and identity','Violence is not only hitting: threats, humiliation and controlling behaviour are psychological violence. Hitting children is always illegal, and abuse in close relationships can be punished with up to six years in prison (more in serious cases). Witnessing violence at home is at least as harmful for children as being hit themselves. Negative social control means a family or community limits a person’s freedom, for example by controlling who they see, what they wear or whom they marry, and it can stop young people from living independent lives. In Norway partners and spouses do not decide over each other. People in many professions and in religious communities have a duty to try to prevent female genital mutilation (avvergelsesplikt); failing to do so can be punished with fines or up to one year in prison. Identity is shaped by personality, gender and sexuality: gender expression (kjønnsuttrykk) is how you show your gender through clothes and behaviour, and sexual orientation is about whom you fall in love with and are attracted to.'],
    ['Culture, norms and integration — key words','Socialisation (sosialisering) is how we learn a society’s norms, values and language. Norms are unwritten rules, while laws are written rules that can lead to punishment. Integration means taking part in the new society while keeping parts of your own culture; assimilation means giving up your own culture and becoming like the majority; segregation means groups live separately with little contact. Culture shock is the confusion you feel when you meet a new culture, cross-pressure (krysspress) is feeling pulled between two cultures with different expectations, and a culture clash (kulturkollisjon) happens when the values of two cultures conflict. In Norway religion is mostly seen as a private matter, parents cannot force a religion on their children, and from age 15 young people choose for themselves. Racism and discrimination are not socially accepted and can be reported to the police.'],
    ['Poverty and housing in numbers','Poverty in Norway is mostly relative poverty, which means having much less money than most people around you. Absolute poverty means not being able to afford basic needs like food and housing. Groups at higher risk of poverty include single parents, large families with three or more children, young people living alone and some immigrant families, often because they have weak ties to working life. Norway has between 2.7 and 3 million homes, and about half of them are detached houses (eneboliger). Around 82 per cent of households own their home; to get a mortgage you normally need your own capital (egenkapital) of 10 per cent of the price and a stable income.']
  ]},
  {id:'m3', title:'Norge før og nå', topics:[
    ['1814 and the Constitution','Norway’s constitution was signed at Eidsvoll on 17 May 1814. This date, Grunnlovsdag (Constitution Day), is Norway’s national day — celebrated with children’s parades (barnetog) rather than military parades.'],
    ['1905 — the end of the union','From 1814 Norway was in a union with Sweden. This ended peacefully in 1905, when Norway became fully independent and chose its own king, Haakon VII.'],
    ['Occupation and after','Norway was occupied by Nazi Germany from 1940 to 1945. Oil was first found in the North Sea in 1967, and the Ekofisk field in 1969; the resulting wealth is largely saved abroad in the Government Pension Fund Global ("Oljefondet") rather than spent immediately.'],
    ['Norway, the EU and its neighbours','Norway is not a member of the European Union, but it takes part in the EU’s single market through the EEA agreement and is part of the Schengen open-border area.'],
    ['How Norwegian democracy works','Norway is a constitutional monarchy and a parliamentary democracy, with power split between Stortinget (parliament, 169 members elected every 4 years), Regjeringen (the government, led by the statsminister), and independent courts. King Haakon VIII became head of state in August 2026, after the death of his father, King Harald V; the role is largely ceremonial. Jonas Gahr Støre (Arbeiderpartiet) continued as Prime Minister after the September 2025 election. Voting age is 18.'],
    ['Diversity and the Sámi people','Norway recognises many family forms (married, cohabiting/samboer, single-parent, same-sex families) and has national minorities including Jews, Kvens, Roma and Romani/Tater. The Sámi are an indigenous people with their own parliament, Sametinget, based in Karasjok, and specific language and cultural rights, especially in northern Norway.'],
    ['Nature, environment and allemannsretten','Friluftsliv (outdoor life) is central to Norwegian culture, supported by allemannsretten — everyone’s right to roam and access uncultivated nature. Norway leans heavily on renewable hydropower and has one of the highest rates of electric car ownership in the world.'],
    ['Gender equality','Norway is consistently ranked among the most gender-equal countries. Women have had the right to vote since 1913, and parental leave includes a father’s quota (fedrekvote) reserved specifically for fathers.'],
    ['Human rights and freedom of expression','The Constitution and international conventions Norway has ratified protect fundamental rights, including ytringsfrihet (freedom of expression), and the Equality and Anti-Discrimination Act bans discrimination based on gender, ethnicity, religion, disability and sexual orientation.'],
    ['Religion in Norway','The Church of Norway (Den norske kirke), historically the state church, was formally separated from the state in 2012. Freedom of religion is constitutionally guaranteed, and Norwegian society today is religiously diverse and largely secular in everyday life.'],
    ['Geography and population','Norway covers 385,178 square kilometres, bordering Sweden, Finland and Russia, and includes the Svalbard archipelago. It is divided into 15 counties (fylker) and 357 municipalities (kommuner). The population passed 5.6 million by 2025 (up from under 3.9 million in 1970), driven mainly by immigration, with growth projected to reach around 6 million by 2040. About three-quarters of Norwegians live along the coast, and half live in Eastern Norway. The four largest cities are Oslo (the capital, roughly 725,000 people), Bergen, Trondheim and Stavanger. The coastline stretches 25,148 km — longer than the distance from the North Pole to the South Pole — with around 50,000 islands. Mountains and plateaus cover about half the country, forest 37%, and only 3% is cultivated land.'],
    ['Public holidays and traditions','Beyond 17 May, Norway’s calendar includes public holidays such as New Year’s Day (1 January), Easter (in March or April: Maundy Thursday, Good Friday, Easter Sunday and Easter Monday — Easter Saturday is not a public holiday), Ascension Day (a Thursday 40 days after Easter), Whitsun (pinse, 10 days after Ascension Day) with Whit Monday as a day off, Labour Day (1 May, marked with political marches), and Christmas (Christmas Eve, Christmas Day and Boxing Day). Some flaggdager (flag days) are marked but are not days off work: Sami National Day (6 February) and International Women’s Day (8 March, first marked in Norway in 1915 and every year since 1972). New Year’s Eve (31 December) is a family celebration but not a public holiday. Beyond the calendar, life-cycle events such as birthdays, weddings, christenings (dåp), confirmations (konfirmasjon) and funerals are important markers in Norwegian life.'],
    ['Sámi history and self-government','The Sámi are the indigenous people not only of Norway but also of Sweden, Finland and Russia, and are considered the oldest population group in the country. Sámi languages are unrelated to Norwegian, though almost all Norwegian Sámi today also speak Norwegian. Traditional Sámi livelihoods included hunting, trapping, fishing and reindeer herding, which many Sámi still practise alongside modern occupations. From around the 1850s, Norwegian authorities pursued a policy of "Norwegianisation" (fornorsking): Sámi children had to attend Norwegian-language schools and were forbidden from learning Sámi, and a 1902 law barred non-Norwegian-speakers from buying land in Sámi areas — a rule not repealed until 1965. Sametinget, the Sámi Parliament, opened in 1989, with members elected every four years to safeguard Sámi culture, language and education. The Sámi national costume, the kofte, is worn on special occasions such as weddings, and the Sámi flag flies across Norway on Sámi National Day, 6 February.'],
    ['National minorities and immigration','Alongside the Sámi, Norway recognises five other groups as national minorities (nasjonale minoriteter) with centuries-old ties to the country: Jews, Kvens/Norwegian Finns (kvener/norskfinner), Forest Finns (skogfinner), Roma and Romani/Tater. Norway ratified a European agreement protecting national minorities’ rights in 1999, committing the state to help preserve their languages, religion, traditions and culture. On immigration, more than one million people living in Norway today were either born abroad or born in Norway to two parents born abroad; the largest groups come from Poland, Lithuania, Ukraine, Sweden and Syria, and most immigrants live in cities rather than the countryside. Between 1820 and 1930, by contrast, Norway was a country of emigration: of more than 30 million Europeans who moved to America in that period, about 800,000 were Norwegians. Many immigrants have Norwegian citizenship, there are immigrants in every municipality, and good Norwegian skills are seen as a key to integration.'],
    ['Prehistoric Norway — Stone Age to Viking Age','The first people arrived in Norway around 12,000 years ago, probably walking over the ice as the Ice Age glaciers retreated, and lived off fish, game, berries and mushrooms, using tools of stone, bone and wood, during the Stone Age (10,000–2000 BC); farming began around 4,000 years ago. In the Bronze Age (1800–500 BC), when the climate was milder than today, wealthier farmers acquired bronze tools, weapons and jewellery, began using horses as draught animals, and women learned to spin and weave wool. During the Iron Age (500 BC–1050 AD), when the climate became like today’s, people learned to make iron from bog ore, improving tools and boosting food production and population growth. In the Viking Age (about 800–1050 AD), from the end of the 700s, powerful farmer-chieftains (høvdinger) led raiding, trading and settlement expeditions abroad; Harald Fairhair (Harald Hårfagre) became the first king of a united Norway around 872. The decisive turning point for Christianity came at the Battle of Stiklestad in 1030, where the Christian king Olav Haraldsson was killed fighting pagan chieftains — Olav was later declared a saint, and Christianity gradually replaced the old Norse religion.'],
    ['Middle Ages, Black Death and the Danish union','After Olav Haraldsson’s death in 1030 the Church made him a saint, the powerful farmers and chieftains became Christian and ordinary people followed, and the Church gained great power, collecting taxes and land. Norway’s population grew from around 150,000 to 400,000 between 1000 and 1300, but about half of all children died before their first birthday and many women died in childbirth. The Black Death (Svartedauden), a plague pandemic that reached Norway in the mid-14th century, killed roughly a third of the population — one of the most severe demographic shocks in Norwegian history. Through the Middle Ages, farmers increasingly paid taxes to the church, king and nobility rather than owning their own land, and Norway’s first towns — Bergen (then Bjørgvin), Trondheim (Nidaros), Oslo, Stavanger and Tønsberg — were founded during this period. The Black Death killed about half of Europe’s population. From 1397 Norway entered a union with Denmark and Sweden; after Sweden left, the union with Denmark lasted until 1814, with Copenhagen as the political and cultural centre and Danish as the written language. In 1517 the German monk Martin Luther protested against the power of the Catholic Church (his followers were called Protestants); the Danish king became Protestant, so Protestantism became Norway’s state religion soon after and remained so until the state church system ended in 2012.'],
    ['National Romanticism and the Nynorsk language','In the mid-19th century, a Europe-wide National Romanticism movement encouraged countries to celebrate their distinctive culture; in Norway this meant showcasing dramatic landscapes and rural farming traditions through literature, painting and music. Because Norway’s written language had been based on Danish for centuries, the linguist Ivar Aasen travelled the country collecting dialect samples to build an alternative written standard rooted in Norwegian speech — this became Nynorsk, still one of Norway’s two official written forms of Norwegian alongside Bokmål (Sámi is also an official language).'],
    ['Industrialisation, emigration and the labour movement','In the mid-1800s around 70% of Norwegians lived rurally from farming and fishing; as the population grew faster than land and jobs, people moved to towns for factory work — the urban share rose from about 15% before 1850 to 35% by 1900 (today about 80% live in towns and urban settlements), often into long hours and crowded housing, with child labour common; in 1900, 23% of all workers were employed in industry. Around 800,000 Norwegians emigrated to America between 1850 and 1920 seeking better prospects. Norway’s labour movement organised from the 1880s onward and gained real influence from the early 1900s, winning shorter hours (the Storting first set a maximum of ten hours a day, cut to eight hours in 1919), workplace safety rules and sickness benefits; roughly half of Norwegian employees still belong to a trade union today.'],
    ['Women’s suffrage and the women’s movement','Norwegian men gained universal voting rights in 1898; women won the same right in 1913 (in both cases from age 25 at the time), among the earliest in the world. The organised women’s movement, active from the 1880s, gathered new momentum in the 1970s, winning rights including access to divorce, contraception and reproductive choice — the 1976 Abortion Act gave women the right to decide on an abortion themselves (up to week 12), and a new abortion law from 2025 gives the right to abortion before week 19 of pregnancy. Men and women today have formally equal rights to education, work, property, inheritance and healthcare, though gaps persist: women make up nearly half the workforce but hold only around a third of executive positions and work part-time far more often than men.'],
    ['World War I and the interwar years','Norway stayed neutral during World War I (1914–1918), but the war still caused shortages of goods like grain, coffee and sugar, leading to rationing. The interwar period between the two world wars was marked by financial crisis and widespread unemployment across Norway.'],
    ['World War II in Norway','Germany invaded Norway on 9 April 1940; after a few weeks of fighting, Norway capitulated and the King and government fled to England, while Vidkun Quisling headed a non-elected, pro-German government — his name became an international byword for a collaborator/traitor. Resistance activity included sabotage and illegal newspapers, and around 50,000 Norwegians fled to neutral Sweden during the war. On Hitler’s orders, retreating German forces razed most of Finnmark and northern Troms in 1944–45. More than 10,000 Norwegians died as a result of the war. Of the roughly 2,100 Jews living in Norway before the war, 773 were deported to concentration camps and only 38 survived to return.'],
    ['Oil, international cooperation and the welfare state','Oil was first found in the North Sea in the late 1960s and transformed Norway into a wealthy "oil nation," though the resource itself stays public property while companies buy time-limited rights to explore and produce — a system still debated because of its environmental impact. Modern Norway takes part in international cooperation through the UN, NATO and the EEA (though not the EU itself), and its wealth and welfare system rest on natural resources — fish, forests, oil, hydropower and wind — alongside the principle that the state guarantees education, healthcare and financial support to all who need it.'],
    ['Administrative structure and separation of powers','Norway’s 15 counties and 357 municipalities are each an elected layer of self-government operating inside national frameworks. The central government sets foreign policy, runs hospitals, passes laws and sets school curricula; counties run upper secondary schools and county roads; municipalities run primary/lower-secondary schools, kindergartens, elderly care, refuse collection and water/sewerage, and local roads. Power is also split three ways nationally: the Storting makes laws (legislative power), the government proposes and carries them out (executive power), and independent courts judge cases under those laws (judicial power) — a separation meant to stop any one branch holding too much power.'],
