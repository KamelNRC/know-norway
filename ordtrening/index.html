<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Norsk Ordtrening</title>
<meta name="theme-color" content="#1f3a5f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Layout: single centred study column — deck picker, mode tabs, one big practice stage; stacks cleanly at phone width. */
  :root{
    --bg:#eaeef2; --surface:#ffffff; --surface-2:#f3f5f8; --line:#d3dae2;
    --ink:#142130; --ink-soft:#4a5867; --ink-faint:#6f7c8a;
    --accent:#1f3a5f; --accent-soft:#dbe4ef; --on-accent:#ffffff;
    --flag:#b3202b; --flag-soft:#f6dfe1;
    --good:#1c7a4c; --good-soft:#d9efe3; --bad:#b3202b; --bad-soft:#f6dfe1;
    --font-display:'Young Serif',Georgia,'Times New Roman',serif;
    --font-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
    --r:12px; --r-l:18px;
    --shadow:0 1px 2px rgba(20,33,48,.06),0 10px 30px -16px rgba(20,33,48,.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e141b; --surface:#161f29; --surface-2:#1c2733; --line:#2b3846;
      --ink:#e5ebf1; --ink-soft:#a9b6c3; --ink-faint:#83919f;
      --accent:#9cbfe6; --accent-soft:#1f3044; --on-accent:#0e141b;
      --flag:#ff7b84; --flag-soft:#3a1f24;
      --good:#5fcf95; --good-soft:#173628; --bad:#ff7b84; --bad-soft:#3a1f24;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.7);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e141b; --surface:#161f29; --surface-2:#1c2733; --line:#2b3846;
    --ink:#e5ebf1; --ink-soft:#a9b6c3; --ink-faint:#83919f;
    --accent:#9cbfe6; --accent-soft:#1f3044; --on-accent:#0e141b;
    --flag:#ff7b84; --flag-soft:#3a1f24;
    --good:#5fcf95; --good-soft:#173628; --bad:#ff7b84; --bad-soft:#3a1f24;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;margin:0;padding-inline:16px;padding-block:20px 48px}
  .wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
  h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance}
  button,input{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;touch-action:manipulation}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}

  /* Header */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;gap:2px}
  .brand h1{font-size:clamp(1.7rem,4.5vw,2.3rem);line-height:1.1}
  .brand h1 .cross{display:inline-block;width:.62em;height:.46em;margin-left:.3em;vertical-align:.05em;border-radius:2px;
    background:linear-gradient(var(--flag),var(--flag)) 0 0/100% 100%;position:relative}
  .brand h1 .cross::before{content:"";position:absolute;inset:0;background:
    linear-gradient(90deg,transparent 30%,var(--surface) 30%,var(--surface) 46%,transparent 46%),
    linear-gradient(transparent 40%,var(--surface) 40%,var(--surface) 60%,transparent 60%)}
  .brand p{margin:0;color:var(--ink-soft)}
  .stats{display:flex;gap:18px;font-variant-numeric:tabular-nums}
  .stat{display:flex;flex-direction:column;align-items:flex-end}
  .stat b{font-family:var(--font-display);font-weight:400;font-size:1.5rem;line-height:1.1}
  .stat span{font-size:.8rem;color:var(--ink-faint)}

  /* Deck picker */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;display:flex;flex-direction:column;gap:12px}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
  .seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:700;color:var(--ink-soft)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
  .row{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
  .row.between{justify-content:space-between}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.88rem;color:var(--ink-soft);display:inline-flex;gap:6px;align-items:center}
  .chip small{color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
  .toggle{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--ink-soft);cursor:pointer;user-select:none}
  .toggle input{width:18px;height:18px;accent-color:var(--accent)}
  .poolinfo{font-size:.9rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
  .bar i{display:block;height:100%;background:var(--good);width:0;transition:width .4s}

  /* Mode tabs */
  nav.modes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  nav.modes button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
  nav.modes button b{font-size:.95rem}
  nav.modes button span{font-size:.72rem;color:var(--ink-faint)}
  nav.modes button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
  nav.modes button[aria-pressed="true"] span{color:var(--on-accent);opacity:.8}
  @media (max-width:620px){nav.modes{grid-template-columns:repeat(3,1fr)}}

  /* Stage */
  .stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow);padding:20px;min-height:380px;display:flex;flex-direction:column;gap:16px}
  .stage-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .dir{font-size:.85rem}
  .count{font-variant-numeric:tabular-nums;color:var(--ink-faint);font-size:.9rem}
  .empty{margin:auto;text-align:center;color:var(--ink-soft);max-width:40ch}

  /* Flashcard */
  .card-scene{perspective:1200px;flex:1;display:flex}
  .card{position:relative;width:100%;min-height:260px;flex:1;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1);cursor:pointer;border:0;background:none;padding:0;text-align:center}
  .card.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-l);border:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px}
  .face.back{transform:rotateY(180deg);background:var(--surface)}
  .big{font-family:var(--font-display);font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.15;overflow-wrap:anywhere}
  .mid{font-size:clamp(1.15rem,3.6vw,1.45rem);font-weight:700;overflow-wrap:anywhere}
  .tag{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
  .hint{font-size:.85rem;color:var(--ink-faint)}
  .forms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:520px}
  .forms div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;gap:2px}
  .forms em{font-style:normal;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
  .forms code{font-family:var(--font-mono);font-size:.95rem;overflow-wrap:anywhere}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 18px;font-weight:700;min-width:120px}
  .btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .btn.good{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
  .btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
  .btn kbd{font-family:var(--font-mono);font-size:.72rem;opacity:.6;margin-left:6px}
  .speak{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;display:inline-grid;place-items:center;flex:none}
  .speak svg{width:18px;height:18px;fill:currentColor}
  .boxes{display:flex;gap:3px;justify-content:center}
  .boxes i{width:14px;height:5px;border-radius:3px;background:var(--line)}
  .boxes i.on{background:var(--good)}

  /* Quiz */
  .prompt{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:10px}
  .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  @media (max-width:560px){.opts{grid-template-columns:1fr}}
  .opt{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:14px;text-align:left;display:flex;gap:10px;align-items:flex-start;font-size:1.02rem;min-width:0}
  .opt kbd{font-family:var(--font-mono);font-size:.75rem;color:var(--ink-faint);border:1px solid var(--line);border-radius:5px;padding:0 5px;flex:none;margin-top:2px}
  .opt span{min-width:0;overflow-wrap:anywhere}
  .opt.right{background:var(--good-soft);border-color:var(--good)}
  .opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
  .opt:disabled{cursor:default}
  .feedback{min-height:1.5em;text-align:center;font-weight:700}
  .feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}

  /* Match */
  .match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
  .tile{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:12px;min-height:54px;text-align:left;font-size:.98rem;overflow-wrap:anywhere;transition:background .15s,border-color .15s,opacity .3s}
  .tile.no{font-family:var(--font-display);font-size:1.08rem}
  .tile.sel{border-color:var(--accent);background:var(--accent-soft)}
  .tile.done{background:var(--good-soft);border-color:var(--good);opacity:.55;cursor:default}
  .tile.err{background:var(--bad-soft);border-color:var(--bad)}

  /* Write / Conjugate */
  .answer{display:flex;flex-direction:column;gap:10px;max-width:520px;width:100%;margin:0 auto}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
  .inwrap{display:flex;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);overflow:hidden}
  .inwrap span{padding-left:12px;color:var(--ink-faint);font-family:var(--font-mono)}
  .inwrap input{flex:1;min-width:0;border:0;background:transparent;padding:12px;font-family:var(--font-mono);font-size:1.05rem;outline:none}
  .inwrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .inwrap.ok{border-color:var(--good);background:var(--good-soft)}
  .inwrap.no{border-color:var(--bad);background:var(--bad-soft)}
  .fix{font-family:var(--font-mono);font-size:.9rem;color:var(--good);min-height:1.3em}
  .keys{display:flex;gap:6px;justify-content:center}
  .keys button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:42px;height:38px;font-family:var(--font-mono);font-size:1.05rem}

  /* List */
  .search{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:10px 12px;width:100%}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);max-height:560px;overflow-y:auto}
  table{border-collapse:collapse;width:100%;font-size:.93rem}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{position:sticky;top:0;background:var(--surface-2);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);z-index:1}
  td.no{font-weight:700}
  td.f{font-family:var(--font-mono);font-size:.86rem;white-space:nowrap}
  td.dot{width:18px;padding-right:0}
  td.dot i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line)}
  td.dot i.l{background:var(--good)} td.dot i.p{background:#d4a017}
  .catrow td{background:var(--accent-soft);font-weight:700;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}

  footer{color:var(--ink-faint);font-size:.82rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .linkbtn{border:0;background:none;color:var(--ink-faint);text-decoration:underline;padding:0}
  .confirm{display:inline-flex;gap:8px;align-items:center}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
  @media (max-width:560px){.stage{padding:14px}.stats{gap:12px}.btn{min-width:0;flex:1}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>Norsk Ordtrening<span class="cross" aria-hidden="true"></span></h1>
      <p>Verb fra VERB.pdf og VerbStor.pdf, pluss vanlige ord. Every word has its English meaning.</p>
    </div>
    <div class="stats" aria-label="Fremgang">
      <div class="stat"><b id="stLearned">0</b><span>lært / learned</span></div>
      <div class="stat"><b id="stTotal">0</b><span>ord totalt</span></div>
    </div>
  </header>

  <section class="panel" aria-label="Velg ordliste">
    <div class="row between">
      <div class="seg" role="group" aria-label="Ordliste">
        <button id="dVerb" data-deck="verb">Verb</button>
        <button id="dWord" data-deck="word">Ordforråd</button>
        <button id="dAll" data-deck="all">Alt</button>
      </div>
      <label class="toggle"><input type="checkbox" id="onlyNew"> Bare ord jeg ikke kan ennå</label>
    </div>
    <div class="chips" id="chips"></div>
    <div class="row between">
      <span class="poolinfo" id="poolInfo"></span>
      <div style="flex:1;min-width:140px;max-width:300px" class="bar"><i id="poolBar"></i></div>
    </div>
  </section>

  <nav class="modes" aria-label="Øvingsmåte">
    <button data-mode="cards"><b>Kort</b><span>Flashcards</span></button>
    <button data-mode="quiz"><b>Flervalg</b><span>Quiz</span></button>
    <button data-mode="match"><b>Par</b><span>Matching</span></button>
    <button data-mode="write"><b>Skriv</b><span>Type it</span></button>
    <button data-mode="conj"><b>Bøying</b><span>Verb forms</span></button>
    <button data-mode="list"><b>Liste</b><span>Browse all</span></button>
  </nav>

  <main class="stage" id="stage" aria-live="polite"></main>

  <footer>
    <span>Fremgangen lagres i denne nettleseren. Progress is saved in this browser.</span>
    <span class="confirm" id="resetWrap"><button class="linkbtn" id="resetBtn">Nullstill fremgang</button></span>
  </footer>
</div>

<script>
/* ---------------- DATA ---------------- */

/* ---------------- BUILD ITEMS ---------------- */
const ITEMS = [];
const CATS = {verb: [], word: []};
(function build(){
  let grp = null;
  VERB_DATA.trim().split('\n').forEach(line => {
    line = line.trim(); if (!line) return;
    if (line.startsWith('#')) { grp = line.slice(1).trim(); return; }
    const [inf, pres, pret, perf, en] = line.split('|');
    ITEMS.push({id: 'v:' + inf + ':' + pret, kind: 'verb', cat: grp, no: 'å ' + inf, en, inf, pres, pret, perf});
  });
  Object.keys(VERB_GROUPS).forEach(k => CATS.verb.push({key: k, no: VERB_GROUPS[k][0], en: VERB_GROUPS[k][1]}));
  let cat = null;
  VOCAB_DATA.trim().split('\n').forEach(line => {
    line = line.trim(); if (!line) return;
    if (line.startsWith('#')) { const [k, no, en] = line.slice(1).trim().split('|'); cat = k; CATS.word.push({key: k, no, en}); return; }
    const [no, en] = line.split('|');
    ITEMS.push({id: 'w:' + cat + ':' + no, kind: 'word', cat, no, en});
  });
})();
const CAT_INDEX = {};
[...CATS.verb, ...CATS.word].forEach(c => CAT_INDEX[c.key] = c);

/* ---------------- STORAGE ---------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let progress = store.get('nt-progress', {});
const saved = store.get('nt-state', {});
const state = {
  deck: saved.deck || 'verb',
  cats: new Set(saved.cats || []),
  onlyNew: !!saved.onlyNew,
  mode: saved.mode || 'cards',
  dir: saved.dir || 'no-en',
};
function saveState() { store.set('nt-state', {deck: state.deck, cats: [...state.cats], onlyNew: state.onlyNew, mode: state.mode, dir: state.dir}); }
const box = it => progress[it.id] || 0;
const LEARNED = 3;
function mark(it, ok) {
  const b = box(it);
  progress[it.id] = ok ? Math.min(5, b + 1) : 0;
  store.set('nt-progress', progress);
  updateStats();
}

/* ---------------- HELPERS ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function pickWeighted(list, avoid) {
  const cand = list.length > 1 && avoid ? list.filter(x => x !== avoid) : list;
  const w = cand.map(it => Math.pow(6 - box(it), 2));
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < cand.length; i++) { r -= w[i]; if (r <= 0) return cand[i]; }
  return cand[cand.length - 1];
}
function pool() {
  return ITEMS.filter(it => {
    if (state.deck !== 'all' && it.kind !== state.deck) return false;
    if (state.deck !== 'all' && state.cats.size && !state.cats.has(it.cat)) return false;
    if (state.onlyNew && box(it) >= LEARNED) return false;
    return true;
  });
}
function catLabel(it) {
  const c = CAT_INDEX[it.cat];
  return it.kind === 'verb' ? 'verb · ' + c.en : c.en;
}
/* Answer checking: accept any "/"-alternative, optional parts in (), and ignore å / har / en / ei / et. */
function expand(s) {
  let out = [''];
  const re = /\(([^)]*)\)/g; let last = 0, m;
  const parts = [];
  while ((m = re.exec(s))) { parts.push([s.slice(last, m.index), m[1]]); last = re.lastIndex; }
  const tail = s.slice(last);
  parts.forEach(([pre, opt]) => { out = out.flatMap(o => [o + pre, o + pre + opt]); });
  return out.map(o => o + tail);
}
function norm(s) {
  return s.toLowerCase().replace(/…/g, '').replace(/[.,!?;:"]/g, ' ')
    .replace(/\s+/g, ' ').trim()
    .replace(/^(å|har|en|ei|et) /, '').replace(/\s+/g, ' ').trim();
}
function variants(ans) {
  return ans.split('/').flatMap(a => expand(a.trim())).map(norm).filter(Boolean);
}
function isRight(input, ans) {
  const n = norm(input);
  if (!n) return false;
  return variants(ans).includes(n);
}

/* ---------------- SPEECH ---------------- */
let noVoice = null;
function findVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  noVoice = vs.find(v => /^(nb|no|nn)/i.test(v.lang)) || null;
}
try { findVoice(); speechSynthesis.onvoiceschanged = () => { findVoice(); if (noVoice) render(); }; } catch (e) {}
function speak(text) {
  if (!noVoice) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/…/g, '').replace(/\s\/\s/g, ', '));
    u.voice = noVoice; u.lang = noVoice.lang; u.rate = .9;
    speechSynthesis.speak(u);
  } catch (e) {}
}
const SPEAK_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
function speakBtn(text) { return noVoice ? `<button class="speak" data-say="${esc(text)}" aria-label="Lytt / Listen">${SPEAK_ICON}</button>` : ''; }
document.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b) { e.stopPropagation(); speak(b.dataset.say); } });

/* ---------------- DECK UI ---------------- */
function renderDeck() {
  document.querySelectorAll('[data-deck]').forEach(b => b.setAttribute('aria-pressed', b.dataset.deck === state.deck));
  $('#onlyNew').checked = state.onlyNew;
  const chips = $('#chips');
  if (state.deck === 'all') { chips.innerHTML = '<span class="hint">Alle verb og alle ord blandet. All verbs and words mixed.</span>'; }
  else {
    const list = CATS[state.deck];
    const count = k => ITEMS.filter(i => i.cat === k && i.kind === state.deck).length;
    chips.innerHTML = `<button class="chip" data-cat="" aria-pressed="${state.cats.size === 0}">Alle</button>` +
      list.map(c => `<button class="chip" data-cat="${c.key}" aria-pressed="${state.cats.has(c.key)}" title="${esc(c.en)}">${esc(c.no)} <small>${count(c.key)}</small></button>`).join('');
  }
  const p = pool();
  const base = ITEMS.filter(it => (state.deck === 'all' || it.kind === state.deck) && (state.deck === 'all' || !state.cats.size || state.cats.has(it.cat)));
  const learned = base.filter(it => box(it) >= LEARNED).length;
  $('#poolInfo').textContent = `${p.length} ord i øvelsen · ${learned} av ${base.length} lært`;
  $('#poolBar').style.width = (base.length ? learned / base.length * 100 : 0) + '%';
  document.querySelectorAll('[data-mode]').forEach(b => {
    b.setAttribute('aria-pressed', b.dataset.mode === state.mode);
  });
}
function updateStats() {
  $('#stLearned').textContent = ITEMS.filter(it => box(it) >= LEARNED).length;
  $('#stTotal').textContent = ITEMS.length;
}
document.querySelectorAll('[data-deck]').forEach(b => b.addEventListener('click', () => {
  state.deck = b.dataset.deck; state.cats.clear(); saveState(); resetSession(); renderDeck(); render();
}));
$('#chips').addEventListener('click', e => {
  const c = e.target.closest('[data-cat]'); if (!c) return;
  const k = c.dataset.cat;
  if (!k) state.cats.clear(); else if (state.cats.has(k)) state.cats.delete(k); else state.cats.add(k);
  saveState(); resetSession(); renderDeck(); render();
});
$('#onlyNew').addEventListener('change', e => { state.onlyNew = e.target.checked; saveState(); resetSession(); renderDeck(); render(); });
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
  state.mode = b.dataset.mode; saveState(); resetSession(); renderDeck(); render();
}));
function restoreReset() {
  $('#resetWrap').innerHTML = '<button class="linkbtn" id="resetBtn">Nullstill fremgang</button>';
  bindReset();
}
function bindReset() {
  $('#resetBtn').onclick = () => {
    const w = $('#resetWrap');
    w.innerHTML = 'Sikker? <button class="linkbtn" id="rsYes">Ja, slett alt</button> <button class="linkbtn" id="rsNo">Avbryt</button>';
    $('#rsYes').onclick = () => { progress = {}; store.set('nt-progress', progress); restoreReset(); updateStats(); resetSession(); renderDeck(); render(); };
    $('#rsNo').onclick = restoreReset;
  };
}

}

/* ---- Flashcards ---- */
function renderCards() {
  const p = pool();
  if (!p.length) return emptyMsg();
  if (!S.queue) {
    S.queue = shuffle(p).sort((a, b) => box(a) - box(b));
    S.i = 0; S.known = 0; S.again = 0; S.flipped = false;
  }
  if (S.i >= S.queue.length) {
    stage.innerHTML = `<div class="empty"><h2 style="font-size:1.6rem">Bra jobba!</h2>
      <p>Du gikk gjennom ${S.queue.length} kort. ${S.known} kunne du, ${S.again} måtte du øve på igjen.</p>
      <div class="actions"><button class="btn primary" id="again">Ny runde</button></div></div>`;
    $('#again').onclick = () => { resetSession(); render(); };
    return;
  }
  const it = S.queue[S.i];
  const noSide = `<span class="tag">${esc(catLabel(it))}</span>
      <div class="big">${esc(it.no)}</div>${speakBtn(it.no)}`;
  const enSide = `<span class="tag">${esc(catLabel(it))}</span><div class="mid">${esc(it.en)}</div>`;
  const backExtra = it.kind === 'verb' ? formsHTML(it) : '';
  const front = state.dir === 'no-en' ? noSide : enSide;
  const back = state.dir === 'no-en'
    ? `<div class="big" style="font-size:1.3rem">${esc(it.no)}</div><div class="mid">${esc(it.en)}</div>${backExtra}`
    : `<div class="mid">${esc(it.en)}</div><div class="big">${esc(it.no)}</div>${speakBtn(it.no)}${backExtra}`;
  stage.innerHTML = `
    <div class="stage-top">${dirSeg()}<span class="count">${S.i + 1} / ${S.queue.length}</span></div>
    <div class="card-scene"><div class="card ${S.flipped ? 'flipped' : ''}" id="card" role="button" tabindex="0" aria-label="Snu kortet / flip card">
      <div class="face front">${front}<span class="hint">Trykk for å snu · tap or press Space</span></div>
      <div class="face back">${back}${boxes(it)}</div>
    </div></div>
    <div class="actions">
      <button class="btn bad" id="cAgain">Øv igjen<kbd>1</kbd></button>
      <button class="btn good" id="cKnow">Jeg kan den<kbd>2</kbd></button>
    </div>`;
  const card = $('#card');
  card.onclick = () => { S.flipped = !S.flipped; card.classList.toggle('flipped', S.flipped); };
  $('#cAgain').onclick = () => cardAnswer(false);
  $('#cKnow').onclick = () => cardAnswer(true);
}
function cardAnswer(ok) {
  const it = S.queue[S.i];
  mark(it, ok);
  if (ok) S.known++; else { S.again++; S.queue.splice(Math.min(S.queue.length, S.i + 4), 0, it); }
  S.i++; S.flipped = false;
  renderDeck(); renderCards();
}

/* ---- Quiz ---- */
function renderQuiz() {
  const p = pool();
  const all = ITEMS.filter(it => state.deck === 'all' || it.kind === state.deck);
  if (!p.length) return emptyMsg();
  if (!S.q) newQuiz(p, all);
  const {it, opts, answered, pick} = S.q;
  const ask = state.dir === 'no-en' ? it.no : it.en;
  const val = o => state.dir === 'no-en' ? o.en : o.no;
  S.score = S.score || {right: 0, total: 0, streak: 0};
  stage.innerHTML = `
    <div class="stage-top">${dirSeg()}<span class="count">${S.score.right} / ${S.score.total} riktige · rekke ${S.score.streak}</span></div>
    <div class="prompt"><span class="tag">${esc(catLabel(it))}</span>
      <div class="${state.dir === 'no-en' ? 'big' : 'mid'}">${esc(ask)}</div>${state.dir === 'no-en' ? speakBtn(it.no) : ''}
      <span class="hint">${state.dir === 'no-en' ? 'Hva betyr dette på engelsk?' : 'Hva heter dette på norsk?'}</span></div>
    <div class="opts">${opts.map((o, i) => {
      let cls = '';
      if (answered) { if (o === it) cls = 'right'; else if (o === pick) cls = 'wrong'; }
      return `<button class="opt ${cls}" data-i="${i}" ${answered ? 'disabled' : ''}><kbd>${i + 1}</kbd><span>${esc(val(o))}</span></button>`;
    }).join('')}</div>
    <div class="feedback ${answered ? (pick === it ? 'ok' : 'no') : ''}">${answered ? (pick === it ? 'Riktig!' : 'Feil. Riktig svar: ' + esc(val(it))) : ''}</div>
    ${answered && it.kind === 'verb' ? `<div style="display:flex;justify-content:center">${formsHTML(it)}</div>` : ''}
    <div class="actions">${answered ? '<button class="btn primary" id="qNext">Neste<kbd>Enter</kbd></button>' : ''}</div>`;
  stage.querySelectorAll('.opt').forEach(b => b.onclick = () => quizPick(+b.dataset.i));
  if (answered) $('#qNext').onclick = () => { S.q = null; renderQuiz(); };
}
function newQuiz(p, all) {
  const it = pickWeighted(p, S.last);
  S.last = it;
  const key = o => (state.dir === 'no-en' ? o.en : o.no).toLowerCase();
  let src = all.filter(o => o.cat === it.cat && o !== it);
  if (src.length < 6) src = all.filter(o => o !== it);
  const seen = new Set([key(it)]); const dist = [];
  for (const o of shuffle(src)) { if (!seen.has(key(o))) { seen.add(key(o)); dist.push(o); } if (dist.length === 3) break; }
  S.q = {it, opts: shuffle([it, ...dist]), answered: false, pick: null};
}
function quizPick(i) {
  const q = S.q; if (q.answered) return;
  q.answered = true; q.pick = q.opts[i];
  const ok = q.pick === q.it;
  S.score.total++; if (ok) { S.score.right++; S.score.streak++; } else S.score.streak = 0;
  mark(q.it, ok); renderDeck(); renderQuiz();
}

/* ---- Match ---- */
function renderMatch() {
  const p = pool();
  if (p.length < 2) return emptyMsg('Du trenger minst to ord for å spille Par. Choose a bigger selection.');
  if (!S.m) {
    const chosen = []; const seenNo = new Set(), seenEn = new Set();
    for (const it of shuffle(p).sort((a, b) => box(a) - box(b) + (Math.random() - .5) * 2)) {
      if (seenNo.has(it.no) || seenEn.has(it.en)) continue;
      seenNo.add(it.no); seenEn.add(it.en); chosen.push(it);
      if (chosen.length === 6) break;
    }
    S.m = {items: chosen, left: shuffle(chosen), right: shuffle(chosen), done: new Set(), miss: new Set(), sel: null, errors: 0, start: Date.now()};
    S.rounds = S.rounds || 0;
  }
  const m = S.m;
  const finished = m.done.size === m.items.length;
  const secs = Math.round(((finished ? m.end : Date.now()) - m.start) / 1000);
  stage.innerHTML = `
    <div class="stage-top"><span class="label">Finn parene · match Norwegian to English</span><span class="count">${m.done.size} / ${m.items.length} · ${m.errors} feil</span></div>
    ${finished ? `<div class="empty"><h2 style="font-size:1.6rem">Ferdig på ${secs} sekunder</h2><p>${m.errors === 0 ? 'Ingen feil. Perfekt!' : m.errors + ' feil denne runden.'}</p>
      <div class="actions"><button class="btn primary" id="mNext">Ny runde<kbd>Enter</kbd></button></div></div>` : `
    <div class="match">
      <div class="col">${m.left.map(it => `<button class="tile no ${m.done.has(it) ? 'done' : ''} ${m.sel && m.sel.side === 'L' && m.sel.it === it ? 'sel' : ''}" data-side="L" data-id="${esc(it.id)}" ${m.done.has(it) ? 'disabled' : ''}>${esc(it.no)}</button>`).join('')}</div>
      <div class="col">${m.right.map(it => `<button class="tile ${m.done.has(it) ? 'done' : ''} ${m.sel && m.sel.side === 'R' && m.sel.it === it ? 'sel' : ''}" data-side="R" data-id="${esc(it.id)}" ${m.done.has(it) ? 'disabled' : ''}>${esc(it.en)}</button>`).join('')}</div>
    </div>`}`;
  if (finished) { $('#mNext').onclick = () => { S.m = null; renderMatch(); }; return; }
  stage.querySelectorAll('.tile').forEach(t => t.onclick = () => matchClick(t));
}
function matchClick(t) {
  const m = S.m;
  const it = m.items.find(x => x.id === t.dataset.id);
  const side = t.dataset.side;
  if (!m.sel || m.sel.side === side) { m.sel = {side, it}; if (side === 'L') speak(it.no); renderMatch(); return; }
  if (m.sel.it === it) {
    m.done.add(it); mark(it, !m.miss.has(it)); m.sel = null;
    if (m.done.size === m.items.length) m.end = Date.now();
    renderDeck(); renderMatch();
  } else {
    m.errors++; m.miss.add(m.sel.it); m.miss.add(it);
    const other = stage.querySelector('.tile.sel');
    t.classList.add('err'); if (other) other.classList.add('err');
    m.sel = null;
    setTimeout(renderMatch, 450);
  }
}

/* ---- Write ---- */
let lastInput = null;
document.addEventListener('focusin', e => { if (e.target.matches('.inwrap input')) lastInput = e.target; });
function keysHTML() { return `<div class="keys">${['æ', 'ø', 'å'].map(k => `<button type="button" data-key="${k}">${k}</button>`).join('')}</div>`; }
stage.addEventListener('mousedown', e => { if (e.target.closest('[data-key]')) e.preventDefault(); });
stage.addEventListener('click', e => {
  const k = e.target.closest('[data-key]'); if (!k) return;
  const inp = lastInput && document.body.contains(lastInput) ? lastInput : stage.querySelector('.inwrap input:not([readonly])');
  if (!inp || inp.readOnly) return;
  const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? inp.value.length;
  inp.value = inp.value.slice(0, s) + k.dataset.key + inp.value.slice(en);
  inp.focus(); inp.setSelectionRange(s + 1, s + 1);
});
function renderWrite() {
  const p = pool();
  if (!p.length) return emptyMsg();
  if (!S.w) { const it = pickWeighted(p, S.last); S.last = it; S.w = {it, done: false, ok: false, val: ''}; }
  S.score = S.score || {right: 0, total: 0};
  const {it, done, ok, val} = S.w;
  const prefix = it.kind === 'verb' ? 'å' : '';
  stage.innerHTML = `
    <div class="stage-top"><span class="label">Skriv ordet på norsk · type the Norwegian</span><span class="count">${S.score.right} / ${S.score.total} riktige</span></div>
    <div class="prompt"><span class="tag">${esc(catLabel(it))}</span><div class="mid" style="font-size:1.6rem">${esc(it.en)}</div></div>
    <form class="answer" id="wForm" autocomplete="off">
      <div class="inwrap ${done ? (ok ? 'ok' : 'no') : ''}">${prefix ? `<span>${prefix}</span>` : ''}
        <input id="wIn" value="${esc(val)}" ${done ? 'readonly' : ''} placeholder="Skriv her…" autocapitalize="off" spellcheck="false" aria-label="Svar på norsk"></div>
      <div class="fix">${done ? (ok ? 'Riktig! ' + esc(it.no) : 'Riktig svar: ' + esc(it.no)) : ''}</div>
      ${done && it.kind === 'verb' ? formsHTML(it) : ''}
      ${done ? '' : keysHTML()}
      <div class="actions">${done ? `<button class="btn primary" type="submit">Neste<kbd>Enter</kbd></button>${speakBtn(it.no)}` : '<button class="btn" type="button" id="wSkip">Vis svaret</button><button class="btn primary" type="submit">Sjekk<kbd>Enter</kbd></button>'}</div>
    </form>`;
  const inp = $('#wIn');
  if (!done) inp.focus(); else $('#wForm button[type=submit]').focus();
  $('#wForm').onsubmit = e => {
    e.preventDefault();
    if (S.w.done) { S.w = null; renderWrite(); return; }
    writeCheck(inp.value);
  };
  const skip = $('#wSkip'); if (skip) skip.onclick = () => writeCheck('');
}
function writeCheck(v) {
  const it = S.w.it;
  const ok = isRight(v, it.no);
  S.w.done = true; S.w.ok = ok; S.w.val = v;
  S.score.total++; if (ok) S.score.right++;
  mark(it, ok); renderDeck(); renderWrite();
}

/* ---- Conjugation ---- */
function renderConj() {
  const p = pool().filter(it => it.kind === 'verb');
  if (!p.length) return emptyMsg('Bøying fungerer bare med verb. Velg «Verb» øverst. Verb forms only works with the verb list — pick “Verb” at the top.');
  if (!S.c) { const it = pickWeighted(p, S.last); S.last = it; S.c = {it, done: false, vals: ['', '', ''], res: []}; }
  S.score = S.score || {right: 0, total: 0};
  const {it, done, vals, res} = S.c;
  const fields = [['pres', 'Presens', ''], ['pret', 'Preteritum', ''], ['perf', 'Perfektum', 'har']];
  stage.innerHTML = `
    <div class="stage-top"><span class="label">Bøy verbet · conjugate the verb</span><span class="count">${S.score.right} / ${S.score.total} helt riktige</span></div>
    <div class="prompt"><span class="tag">${esc(catLabel(it))}</span><div class="big">${esc(it.no)}</div><div class="hint" style="font-size:1rem">${esc(it.en)}</div></div>
    <form class="answer" id="cForm" autocomplete="off">
      ${fields.map(([k, lab, pre], i) => `<div class="field"><label for="c_${k}">${lab}</label>
        <div class="inwrap ${done ? (res[i] ? 'ok' : 'no') : ''}">${pre ? `<span>${pre}</span>` : ''}<input id="c_${k}" value="${esc(vals[i])}" ${done ? 'readonly' : ''} autocapitalize="off" spellcheck="false"></div>
        <div class="fix">${done && !res[i] ? esc((pre ? pre + ' ' : '') + it[k]) : ''}</div></div>`).join('')}
      ${done ? '' : keysHTML()}
      <div class="actions">${done ? `<button class="btn primary" type="submit">Neste<kbd>Enter</kbd></button>${speakBtn(`${it.no}, ${it.pres}, ${it.pret}, har ${it.perf}`)}` : '<button class="btn" type="button" id="cSkip">Vis svaret</button><button class="btn primary" type="submit">Sjekk<kbd>Enter</kbd></button>'}</div>
    </form>`;
  if (!done) $('#c_pres').focus(); else $('#cForm button[type=submit]').focus();
  stage.querySelectorAll('#cForm input').forEach((inp, i, arr) => inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !done && i < 2 && !arr[i + 1].value) { e.preventDefault(); arr[i + 1].focus(); }
  }));
  $('#cForm').onsubmit = e => {
    e.preventDefault();
    if (S.c.done) { S.c = null; renderConj(); return; }
    conjCheck(fields.map(([k]) => $('#c_' + k).value));
  };
  const skip = $('#cSkip'); if (skip) skip.onclick = () => conjCheck(['', '', '']);
}
function conjCheck(vals) {
  const it = S.c.it;
  const res = [isRight(vals[0], it.pres), isRight(vals[1], it.pret), isRight(vals[2], it.perf)];
  const all = res.every(Boolean);
  Object.assign(S.c, {done: true, vals, res});
  S.score.total++; if (all) S.score.right++;
  mark(it, all); renderDeck(); renderConj();
}

/* ---- List ---- */
function renderList() {
  const p = pool();
  const q = S.search || '';
  const showVerbs = p.some(it => it.kind === 'verb');
  stage.innerHTML = `
    <input class="search" id="lSearch" type="search" placeholder="Søk på norsk eller engelsk… / search" value="${esc(q)}" aria-label="Søk">
    <div class="hint">Grønn prikk = lært, gul = på vei. Green dot = learned, yellow = in progress.</div>
    <div class="tablewrap"><table><thead><tr><th></th><th>Norsk</th><th>English</th>${showVerbs ? '<th>Presens</th><th>Preteritum</th><th>Perfektum</th>' : ''}</tr></thead><tbody id="lBody"></tbody></table></div>`;
  const body = $('#lBody');
  function fill() {
    const term = norm(S.search || '');
    const rows = p.filter(it => !term || it.no.toLowerCase().includes(term) || it.en.toLowerCase().includes(term) ||
      (it.kind === 'verb' && [it.pres, it.pret, it.perf].some(f => f.toLowerCase().includes(term))));
    let cur = null, html = '';
    const cols = showVerbs ? 6 : 3;
    rows.forEach(it => {
      const ck = it.kind + it.cat;
      if (ck !== cur) { cur = ck; const c = CAT_INDEX[it.cat]; html += `<tr class="catrow"><td colspan="${cols}">${esc(it.kind === 'verb' ? 'Verb · ' + c.no : c.no)} · ${esc(c.en)}</td></tr>`; }
      const b = box(it);
      html += `<tr><td class="dot"><i class="${b >= LEARNED ? 'l' : b > 0 ? 'p' : ''}"></i></td><td class="no">${esc(it.no)}</td><td>${esc(it.en)}</td>${showVerbs ? (it.kind === 'verb' ? `<td class="f">${esc(it.pres)}</td><td class="f">${esc(it.pret)}</td><td class="f">har ${esc(it.perf)}</td>` : '<td></td><td></td><td></td>') : ''}</tr>`;
    });
    body.innerHTML = html || `<tr><td colspan="${cols}">Ingen treff.</td></tr>`;
  }
  fill();
  $('#lSearch').addEventListener('input', e => { S.search = e.target.value; fill(); });
}

/* ---------------- ROUTER & KEYS ---------------- */
function render() {
  ({cards: renderCards, quiz: renderQuiz, match: renderMatch, write: renderWrite, conj: renderConj, list: renderList}[state.mode] || renderCards)();
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (state.mode === 'cards' && S.queue && S.i < S.queue.length) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); $('#card').click(); }
    else if (e.key === '1') cardAnswer(false);
    else if (e.key === '2') cardAnswer(true);
  } else if (state.mode === 'quiz' && S.q) {
    if (!S.q.answered && /^[1-4]$/.test(e.key) && S.q.opts[+e.key - 1]) quizPick(+e.key - 1);
    else if (S.q.answered && e.key === 'Enter') { e.preventDefault(); S.q = null; renderQuiz(); }
  } else if (state.mode === 'match' && S.m && S.m.end && e.key === 'Enter') { e.preventDefault(); S.m = null; renderMatch(); }
  else if (state.mode === 'cards' && S.queue && S.i >= S.queue.length && e.key === 'Enter') { resetSession(); render(); }
});

bindReset();
updateStats(); renderDeck(); render();
</script>

</html>
